version: "3.9"

services:
  keycloak-db:
    image: postgres:16-alpine
    container_name: windband-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5433:5432"
    volumes:
      - keycloakdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: windband-keycloak
    restart: unless-stopped
    command: start-dev
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: keycloak.michalbzowski.pl
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY: "edge"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8180
    ports:
      - "8180:8180"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8180/health/ready 2>/dev/null || exit 0"]
      interval: 15s
      timeout: 10s
      retries: 3

  db:
    image: postgres:16-alpine
    container_name: windband-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: windband
      POSTGRES_USER: windband
      POSTGRES_PASSWORD: windband
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windband"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: windband-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: windband
      DB_USER: windband
      DB_PASS: windband
      SERVER_PORT: 8080
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      BASE_URL: ${BASE_URL:-https://windband.michalbzowski.pl}
      KEYCLOAK_URL: http://keycloak:8180
      KEYCLOAK_PUBLIC_URL: http://keycloak.michalbzowski.pl
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-windband}
    ports:
      - "8080:8080"

volumes:
  pgdata:
  keycloakdata:
