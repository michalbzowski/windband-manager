# ===========================================================================
# Windband Manager — fully self-contained LOCAL stack
# ===========================================================================
# One command, no external services, everything on localhost:
#
#     docker compose up -d
#
# Services (all on the host's localhost):
#   - db            PostgreSQL for the app          -> localhost:5432
#   - keycloak-db   PostgreSQL for Keycloak         -> localhost:5433
#   - keycloak      OIDC provider (realm auto-import) -> http://localhost:8180
#   - app           Spring Boot app (built here)    -> http://localhost:8080
#
# The Keycloak realm "windband" (client "windband-local" + user admin/admin)
# is imported automatically on first start from ./keycloak/import.
#
# No reverse proxy, no custom domains, no Superset, no cloud references.
# Log in to the app at http://localhost:8080 with admin / admin.
# ===========================================================================

services:
  keycloak-db:
    image: postgres:16-alpine
    container_name: windband-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    ports:
      - "5433:5432"
    volumes:
      - keycloakdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: windband-keycloak
    restart: unless-stopped
    # start-dev = plain HTTP, no TLS/proxy required (laptop-friendly).
    # --import-realm loads every JSON under /opt/keycloak/data/import on boot.
    command: start-dev --import-realm
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      # Issuer host must match what the browser AND the app container use.
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_PORT: 8180
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8180:8180"
    volumes:
      # Auto-import the local realm on first start.
      - ./keycloak/import:/opt/keycloak/data/import:ro
      # Custom login theme (hot-reload in dev mode).
      - ./themes:/opt/keycloak/themes:ro
    healthcheck:
      # KC 25 hides /health unless KC_HEALTH_ENABLED. Probe the realm's OIDC
      # discovery endpoint instead — that's the exact readiness signal the app
      # needs before it can start its OIDC client.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8180 && printf 'GET /realms/windband/.well-known/openid-configuration HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  db:
    image: postgres:16-alpine
    container_name: windband-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: windband
      POSTGRES_USER: windband
      POSTGRES_PASSWORD: ${WINDDB_PASSWORD:-windband}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windband"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # Built locally from the repo Dockerfile so `docker compose up` is enough.
    build:
      context: .
      dockerfile: Dockerfile
    image: windband-manager-app:local
    container_name: windband-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    # Make `localhost` inside the container resolve to the Docker host, so the
    # app reaches the published Keycloak port at localhost:8180 — the SAME URL
    # the browser uses. This keeps the OIDC issuer claim consistent and removes
    # the need for any custom-domain extra_hosts.
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "8080:8080"
    environment:
      # Use the local Spring profile: plain-HTTP localhost OIDC URLs.
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: windband
      DB_USER: windband
      DB_PASS: ${WINDDB_PASSWORD:-windband}
      SERVER_PORT: 8080
      # Mail: point at a local SMTP (e.g. mailpit on 1025) if you run one;
      # otherwise sending simply fails without blocking startup.
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-windband}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-windband-local}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-windband-local-secret}
      # Score-file upload root (persisted in the `scores` volume).
      SCORES_ROOT_PATH: /srv/windband-scores
    volumes:
      - scores:/srv/windband-scores

volumes:
  pgdata:
  keycloakdata:
  scores:
