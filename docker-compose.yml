services:
  keycloak-db:
    image: postgres:16-alpine
    container_name: windband-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    ports:
      - "5433:5432"
    volumes:
      - keycloakdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: windband-keycloak
    restart: unless-stopped
    command: start-dev
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HOSTNAME: keycloak.michalbzowski.pl
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY: "edge"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8180
    ports:
      - "8180:8180"
    volumes:
      # Motyw Keycloaka — hot-reload w trybie development
      - ./themes:/opt/keycloak/themes:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8180/health/ready 2>/dev/null || exit 0"]
      interval: 15s
      timeout: 10s
      retries: 3

  db:
    image: postgres:16-alpine
    container_name: windband-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: windband
      POSTGRES_USER: windband
      POSTGRES_PASSWORD: ${WINDDB_PASSWORD:-windband}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windband"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: windband-manager-app:latest
    container_name: windband-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    extra_hosts:
      - "keycloak.michalbzowski.pl:172.17.0.1"
      - "superset.michalbzowski.pl:172.17.0.1"
      - "superset:172.20.0.6"
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: windband
      DB_USER: windband
      DB_PASS: ${WINDDB_PASSWORD:-windband}
      SERVER_PORT: 8080
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      BASE_URL: ${BASE_URL:-https://windband.michalbzowski.pl}
      KEYCLOAK_URL: http://keycloak:8180
      KEYCLOAK_INTERNAL_URL: keycloak:8180
      KEYCLOAK_PUBLIC_URL: http://keycloak.michalbzowski.pl
      KEYCLOAK_AUTH_URL: keycloak.michalbzowski.pl
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-windband}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-windband-manager}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-windband-secret-key-change-in-production-2026}
      SUPERSET_BASE_URL: http://superset:8088
      SUPERSET_PUBLIC_URL: ${SUPERSET_PUBLIC_URL:-https://superset.michalbzowski.pl}
      SUPERSET_GUEST_TOKEN_JWT_SECRET: ${SUPERSET_GUEST_TOKEN_JWT_SECRET:-WindbandGuestToken2026!ChangeMe#VeryLongSecretForSecurity}
      SUPERSET_USERNAME: ${SUPERSET_USERNAME:-admin}
      SUPERSET_PASSWORD: ${SUPERSET_PASSWORD:-admin}
      KEYCLOAK_SUPERSET_CLIENT_ID: ${KEYCLOAK_SUPERSET_CLIENT_ID:-superset}
      KEYCLOAK_SUPERSET_CLIENT_SECRET: ${KEYCLOAK_SUPERSET_CLIENT_SECRET:-iDOlRVY6BvflwAW7oCPE7QDjFB52g11J}

volumes:
  pgdata:
  keycloakdata:
