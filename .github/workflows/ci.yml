name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Anuluj poprzedni run dla tego samego PR/branch — oszczędza minuty CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# dorny/test-reporter wymaga checks: write; bez tego zwraca 404
permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Build & Test (mvn verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # ubuntu-latest ma Dockera preinstalowanego (potrzebny do Testcontainers/PostgreSQL)
    # TestcontainersInitializer ma graceful fallback na H2 gdyby Docker nie wstał.

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Verify (unit + integration)
        run: ./mvnw -B verify '-Dtest=!pl.michalbzowski.windband.application.report.ReportCompilationTest' -Dsurefire.forkCount=1

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@31a54ee7ebcacc03a09ea97a7e5465a47b84aea5 # v1.9.1
        with:
          name: Maven Tests
          path: '**/target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false

  # --------------------------------------------------------------------------
  # pipeline-lint: audyt security workflowów GH Actions (Tech Radar Vol.35 #103 zizmor).
  # Uruchamiaj lokalnie przed edycja pipeline'u: scripts/pipeline-lint.sh
  # --------------------------------------------------------------------------
  pipeline-lint:
    name: Pipeline lint (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: zizmor audit
        run: |
          pipx install zizmor==1.32.0
          # min-severity high => findingi ponizej nie blokuja; wyjscie niezerowe = fail.
          # po przypieciu 'uses:' do SHA nie ma high; docelowo zuzyc do --min-severity low
          zizmor . --min-severity high --no-online-audits

  # --------------------------------------------------------------------------
  # pit: mutation testing ONLY of packages changed by this commit/PR.
  # Straze fake-coverage testow agentowych (Tech Radar Vol.35 #2, Adopt).
  # pelny baseline lokalnie: scripts/mutation-check.sh '<glob>'
  # --------------------------------------------------------------------------
  pit:
    name: Mutation testing (PIT, changed pkgs)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Compute changed business packages
        id: scope
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="${{ github.event.before }}"; fi
          if ! git rev-parse -q --verify "${BASE}^{commit}" >/dev/null 2>&1; then
            BASE="$(git rev-parse HEAD^)"
          fi
          TARGETS="$(git diff --name-only "$BASE" "${{ github.sha }}" -- src/main/java \
            | sed -E 's|^src/main/java/||; s|/[^/]+\.java$||; s|/|.|g' \
            | grep -E '^pl\.michalbzowski\.windband\.(domain|application|util)' \
            | sort -u | sed 's/$/.*/' | paste -sd, -)"
          echo "targets=${TARGETS}" >> "$GITHUB_OUTPUT"
          if [ -z "$TARGETS" ]; then
            echo "Brak zmian w domain/application/util — pomijam PIT."
          else
            echo "Zakres PIT: $TARGETS"
          fi

      - name: Cache PIT history (incremental)
        if: steps.scope.outputs.targets != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .pitest
          key: pitest-history-${{ github.run_id }}
          restore-keys: |
            pitest-history-

      - name: Run PIT
        if: steps.scope.outputs.targets != ''
        run: |
          ./mvnw -B -Ppit test-compile org.pitest:pitest-maven:mutationCoverage \
            -Dpit.target.classes="${{ steps.scope.outputs.targets }}" \
            -Dsurefire.forkCount=1

      - name: Upload mutation report
        if: always() && steps.scope.outputs.targets != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pit-reports
          path: target/pit-reports/**
          retention-days: 14
          if-no-files-found: ignore
