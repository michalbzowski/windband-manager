name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Anuluj poprzedni run dla tego samego PR/branch — oszczędza minuty CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# dorny/test-reporter wymaga checks: write; bez tego zwraca 404
permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Build & Test (mvn verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # ubuntu-latest ma Dockera preinstalowanego (potrzebny do Testcontainers/PostgreSQL)
    # TestcontainersInitializer ma graceful fallback na H2 gdyby Docker nie wstał.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Verify (unit + integration)
        run: ./mvnw -B verify

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Maven Tests
          path: '**/target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false
