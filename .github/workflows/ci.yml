name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Anuluj poprzedni run dla tego samego PR/branch — oszczędza minuty CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# dorny/test-reporter wymaga checks: write; bez tego zwraca 404
permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Build & Test (mvn verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # ubuntu-latest ma Dockera preinstalowanego (potrzebny do Testcontainers/PostgreSQL)
    # TestcontainersInitializer ma graceful fallback na H2 gdyby Docker nie wstał.

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Verify (unit + integration)
        run: ./mvnw -B verify '-Dtest=!pl.michalbzowski.windband.application.report.ReportCompilationTest' -Dsurefire.forkCount=1

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@31a54ee7ebcacc03a09ea97a7e5465a47b84aea5 # v1.9.1
        with:
          name: Maven Tests
          path: '**/target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false

  # --------------------------------------------------------------------------
  # pipeline-lint: audyt security workflowów GH Actions (Tech Radar Vol.35 #103 zizmor).
  # Uruchamiaj lokalnie przed edycja pipeline'u: scripts/pipeline-lint.sh
  # --------------------------------------------------------------------------
  pipeline-lint:
    name: Pipeline lint (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: zizmor audit
        run: |
          pipx install zizmor==1.32.0
          # min-severity high => findingi ponizej nie blokuja; wyjscie niezerowe = fail.
          # po przypieciu 'uses:' do SHA nie ma high; docelowo zuzyc do --min-severity low
          zizmor . --min-severity high --no-online-audits

  # --------------------------------------------------------------------------
  # pit: mutation testing ONLY of packages changed by this commit/PR.
  # Straze fake-coverage testow agentowych (Tech Radar Vol.35 #2, Adopt).
  # pelny baseline lokalnie: scripts/mutation-check.sh '<glob>'
  # --------------------------------------------------------------------------
  pit:
    name: Mutation testing (PIT, changed pkgs)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Compute changed business packages
        id: scope
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="${{ github.event.before }}"; fi
          if ! git rev-parse -q --verify "${BASE}^{commit}" >/dev/null 2>&1; then
            BASE="$(git rev-parse HEAD^)"
          fi
          TARGETS="$(git diff --name-only "$BASE" "${{ github.sha }}" -- src/main/java \
            | sed -E 's|^src/main/java/||; s|/[^/]+\.java$||; s|/|.|g' \
            | grep -E '^pl\.michalbzowski\.windband\.(domain|application|util)' \
            | sort -u | sed 's/$/.*/' | paste -sd, -)"
          echo "targets=${TARGETS}" >> "$GITHUB_OUTPUT"
          if [ -z "$TARGETS" ]; then
            echo "Brak zmian w domain/application/util — pomijam PIT."
          else
            echo "Zakres PIT: $TARGETS"
          fi

      - name: Cache PIT history (incremental)
        if: steps.scope.outputs.targets != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .pitest
          key: pitest-history-${{ github.run_id }}
          restore-keys: |
            pitest-history-

      - name: Run PIT
        if: steps.scope.outputs.targets != ''
        run: |
          ./mvnw -B -Ppit test-compile org.pitest:pitest-maven:mutationCoverage \
            -Dpit.target.classes="${{ steps.scope.outputs.targets }}" \
            -Dsurefire.forkCount=1

      - name: Upload mutation report
        if: always() && steps.scope.outputs.targets != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pit-reports
          path: target/pit-reports/**
          retention-days: 14
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  # Radar bezpieczeństwa P1/P2 (free/OSS, bez kont i licencji):
  #   gitleaks        — sekrety w historii git (przeszłe + obecne); bramka: finding = fail
  #   Trivy fs        — bramka CRITICAL z fixem (.trivyignore) + raport HIGH/CRITICAL
  #   dependency-check— CVE w zależnościach; warunkowy od darmowego klucza NVD (secret)
  # FindSecBugs działa już wewnątrz istniejącego joba Build (SpotBugs).
  # --------------------------------------------------------------------------
  secrets-scan:
    name: Secrets (gitleaks, MIT)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (pełna historia — gitleaks skanuje cały log)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # gitleaks CLI = MIT (repo gitleaks/gitleaks). CELOWO nie używamy oficjalnego
      # gitleaks-action — od v2 action jest pod licencją komercyjną Gitleaks LLC (EULA),
      # a repo wymaga czystego OSS (decyzja 2026-11). Wersja przypięta świadomie.
      - name: Install gitleaks binary (pinned)
        run: |
          VER=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gl.tgz
          tar xzf /tmp/gl.tgz -C "$RUNNER_TEMP"

      # Explicit --config: domyślne reguły (extend.useDefault=true w pliku) + nasz allowlist.
      - name: gitleaks detect
        run: |
          "$RUNNER_TEMP/gitleaks" detect --source . --config ./.gitleaks.toml --no-banner

  trivy-fs:
    name: FS scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # trivy CLI = Apache-2.0 (pinned). Celowo surowy CLI zamiast trivy-action:
      # jeden job musi zrobić dwa różne skany — bramka CRITICAL + raport HIGH (decyzja 2026-11).
      - name: Install trivy (pinned)
        run: |
          VER=0.76.2
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${VER}/trivy_${VER}_Linux-64bit.tar.gz" -o /tmp/tr.tgz
          tar xzf /tmp/tr.tgz -C "$RUNNER_TEMP"

      # BRAMKA: tylko CRITICAL, tylko z fixem (ignore-unfixed), minus udokumentowane
      # w .trivyignore (CVE bez fixa na linii Spring 6.1/Boot 3.3 — wygasają przy P5).
      # HIGH są raportowane niżej, ale nie blokują, dopóki backlog P5 (Boot 3.4/3.5) żyje.
      # --exit-code 1 JEST OBOWIĄZKOWY: domyślnie trivy wyrzuca 0 nawet przy findingach!
      - name: Trivy gate (CRITICAL)
        run: |
          "$RUNNER_TEMP/trivy" fs --scanners vuln --severity CRITICAL \
            --ignore-unfixed --ignorefile ./.trivyignore --exit-code 1 --no-progress .

      # RAPORT (celowo bez --exit-code: ma informować, nie blokować)
      - name: Trivy report (HIGH+CRITICAL)
        run: |
          "$RUNNER_TEMP/trivy" fs --scanners vuln --severity HIGH,CRITICAL \
            --ignorefile ./.trivyignore --no-progress .
          "$RUNNER_TEMP/trivy" fs --scanners vuln --severity HIGH,CRITICAL \
            --ignorefile ./.trivyignore --no-progress -f json -o trivy-fs-report.json .

      - name: Upload report (JSON)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-fs-report
          path: trivy-fs-report.json
          if-no-files-found: ignore

  dependency-check:
    name: Deps scan (OWASP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # DC 13.x aktualizuje bazę przez NVD API 2.0 — wymaga (darmowego) klucza
    # z https://tenant.nvd.nist.gov . Bez sekretu job jest POMINİYTY, a twardą
    # bramką SCA pozostają Dependabot alerts + trivy-fs (decyzja 2026-11).
    if: ${{ secrets.NVD_API_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      # goal (a nie `verify`) — nie uruchamia testów, skanuje deklarowane zależności.
      # -DnvdApiKey tylko gdy secret istnieje — pusty string BREAKS klienta NVD.
      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ARGS=()
          if [ -n "${NVD_API_KEY:-}" ]; then ARGS+=("-DnvdApiKey=${NVD_API_KEY}"); fi
          ./mvnw -B dependency-check:check "${ARGS[@]}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-check-reports
          path: target/dependency-check/**
          retention-days: 14
          if-no-files-found: ignore
