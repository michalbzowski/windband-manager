name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Ręczny trigger (dostepny na dowolnym branchu) — głównie dla joba dast-nuclei:
  # weryfikacja end-to-end PRZED merge do main + ponowne skany bez czekania na push.
  workflow_dispatch:

# Anuluj poprzedni run dla tego samego PR/branch — oszczędza minuty CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# dorny/test-reporter wymaga checks: write; bez tego zwraca 404
# (run 44089140171: rerun w tym samym kontekście zostawił utkwiony w
# in_progress check-run "Maven Tests"; kolejna próba create = HttpError 404 —
# świeży run bez historycznych stanów tego problemu nie ma)
permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Build & Test (mvn verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # ubuntu-latest ma Dockera preinstalowanego (potrzebny dla Testcontainers/PostgreSQL)
    # TestcontainersInitializer ma graceful fallback na H2 gdyby Docker nie wstał.

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Verify (unit + integration)
        run: ./mvnw -B verify '-Dtest=!pl.michalbzowski.windband.application.report.ReportCompilationTest' -Dsurefire.forkCount=1

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@31a54ee7ebcacc03a09ea97a7e5465a47b84aea5 # v1.9.1
        # continue-on-error: anotacje to dodatek, nie bramka — testy i tak gwarantuje
        # mvn verify powyżej. Root-cause 404 dornyego nie jest w pełni rozpoznany:
        # endpoint /check-runs w tym repo zwraca dla tokena użytkownika
        # 403 "must authenticate via a GitHub App" (probe 2026-11-17), a GITHUB_TOKEN
        # runu dostawał 404 mimo poprawnego SHA — runy 44089140171 i 44097149929,
        # obie zielone w mvn, czerwone wyłącznie na tym kroku. Osobne śledztwo = osobny PR.
        continue-on-error: true
        with:
          name: Maven Tests
          path: '**/target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false

  # --------------------------------------------------------------------------
  # pipeline-lint: audyt security workflowów GH Actions (Tech Radar Vol.35 #103 zizmor).
  # Uruchamiaj lokalnie przed edycja pipeline'u: scripts/pipeline-lint.sh
  # --------------------------------------------------------------------------
  pipeline-lint:
    name: Pipeline lint (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: zizmor audit
        run: |
          pipx install zizmor==1.32.0
          # min-severity high => findingi ponizej nie blokuja; wyjscie niezerowe = fail.
          # po przypieciu 'uses:' do SHA nie ma high; docelowo zuzyc do --min-severity low
          zizmor . --min-severity high --no-online-audits

  # --------------------------------------------------------------------------
  # pit: mutation testing ONLY of packages changed by this commit/PR.
  # Straze fake-coverage testow agentowych (Tech Radar Vol.35 #2, Adopt).
  # pelny baseline lokalnie: scripts/mutation-check.sh '<glob>'
  # --------------------------------------------------------------------------
  pit:
    name: Mutation testing (PIT, changed pkgs)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Compute changed business packages
        id: scope
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="${{ github.event.before }}"; fi
          if ! git rev-parse -q --verify "${BASE}^{commit}" >/dev/null 2>&1; then
            BASE="$(git rev-parse HEAD^)"
          fi
          TARGETS="$(git diff --name-only "$BASE" "${{ github.sha }}" -- src/main/java \
            | sed -E 's|^src/main/java/||; s|/[^/]+\.java$||; s|/|.|g' \
            | grep -E '^pl\.michalbzowski\.windband\.(domain|application|util)' \
            | sort -u | sed 's/$/.*/' | paste -sd, -)"
          echo "targets=${TARGETS}" >> "$GITHUB_OUTPUT"
          if [ -z "$TARGETS" ]; then
            echo "Brak zmian w domain/application/util — pomijam PIT."
          else
            echo "Zakres PIT: $TARGETS"
          fi

      - name: Cache PIT history (incremental)
        if: steps.scope.outputs.targets != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .pitest
          key: pitest-history-${{ github.run_id }}
          restore-keys: |
            pitest-history-

      - name: Run PIT
        if: steps.scope.outputs.targets != ''
        run: |
          ./mvnw -B -Ppit test-compile org.pitest:pitest-maven:mutationCoverage \
            -Dpit.target.classes="${{ steps.scope.outputs.targets }}" \
            -Dsurefire.forkCount=1

      - name: Upload mutation report
        if: always() && steps.scope.outputs.targets != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pit-reports
          path: target/pit-reports/**
          retention-days: 14
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  # Radar bezpieczeństwa P1/P2 (free/OSS, bez kont i licencji):
  #   gitleaks        — sekrety w historii git (przeszłe + obecne); bramka: finding = fail
  #   Trivy fs        — bramka CRITICAL z fixem (.trivyignore) + raport HIGH/CRITICAL
  #   semgrep SAST    — reguły Java pinned w repo (p/java), bramka: finding = fail
  #   dependency-check— CVE w zależnościach; warunkowy od darmowego klucza NVD (secret)
  # FindSecBugs działa już wewnątrz istniejącego joba Build (SpotBugs).
  # --------------------------------------------------------------------------
  secrets-scan:
    name: Secrets (gitleaks, MIT)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (pełna historia — gitleaks skanuje cały log)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # gitleaks CLI = MIT (repo gitleaks/gitleaks). CELOWO nie używamy oficjalnego
      # gitleaks-action — od v2 action jest pod licencją komercyjną Gitleaks LLC (EULA),
      # a repo wymaga czystego OSS (decyzja 2026-11). Wersja przypięta świadomie.
      - name: Install gitleaks binary (pinned)
        run: |
          VER=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gl.tgz
          tar xzf /tmp/gl.tgz -C "$RUNNER_TEMP"

      # Explicit --config: domyślne reguły (extend.useDefault=true w pliku) + nasz allowlist.
      - name: gitleaks detect
        run: |
          "$RUNNER_TEMP/gitleaks" detect --source . --config ./.gitleaks.toml --no-banner

  trivy-fs:
    name: FS scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # needs: build — trivy fs pobiera pomy rodzicielskie zdalnie, gdy lokalny
    # cache jest pusty; Maven Central throttluje nawet IP runnerow GitHuba
    # (429 po fan-out'ach, blok ~30 min) — run 44084995227 umarł właśnie tak.
    # Po buildzie cache m2 jest już w shared actions/cache (~100% hitu),
    # więc trivy czyta pomy z dysku i nie dzwoni do centrala.
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Warmup cache zalecany przez trivy (własny błąd 429 podpowiada go wprost):
      # setup-java z maven-cache + go-offline = skan już bez zdalnych dzwonów.
      - name: "Set up JDK 21, maven cache"
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Warm Maven cache (dependency:go-offline)
        run: ./mvnw -B -q dependency:go-offline

      # trivy CLI = Apache-2.0 (pinned). Celowo surowy CLI zamiast trivy-action:
      # jeden job musi zrobić dwa różne skany — bramka CRITICAL + raport HIGH (decyzja 2026-11).
      - name: Install trivy (pinned)
        run: |
          VER=0.76.2
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${VER}/trivy_${VER}_Linux-64bit.tar.gz" -o /tmp/tr.tgz
          tar xzf /tmp/tr.tgz -C "$RUNNER_TEMP"

      # BRAMKA: tylko CRITICAL, tylko z fixem (ignore-unfixed), minus udokumentowane
      # w .trivyignore (CVE bez fixa na linii Spring 6.1/Boot 3.3 — wygasają przy P5).
      # HIGH są raportowane niżej, ale nie blokują, dopóki backlog P5 (Boot 3.4/3.5) żyje.
      # --exit-code 1 JEST OBOWIĄZKOWY: domyślnie trivy wyrzuca 0 nawet przy findingach!
      - name: Trivy gate (CRITICAL)
        run: |
          "$RUNNER_TEMP/trivy" fs --scanners vuln --severity CRITICAL \
            --ignore-unfixed --ignorefile ./.trivyignore --exit-code 1 --no-progress .

      # RAPORT (celowo bez --exit-code: ma informować, nie blokować)
      - name: Trivy report (HIGH+CRITICAL)
        run: |
          "$RUNNER_TEMP/trivy" fs --scanners vuln --severity HIGH,CRITICAL \
            --ignorefile ./.trivyignore --no-progress .
          "$RUNNER_TEMP/trivy" fs --scanners vuln --severity HIGH,CRITICAL \
            --ignorefile ./.trivyignore --no-progress -f json -o trivy-fs-report.json .

      - name: Upload report (JSON)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-fs-report
          path: trivy-fs-report.json
          if-no-files-found: ignore

  dependency-check:
    name: Deps scan (OWASP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # DC 13.x aktualizuje bazę przez NVD API 2.0 — wymaga (darmowego) klucza
    # z https://tenant.nvd.nist.gov . Bez sekretu kroki DC są pomijane w run:,
    # bramką SCA pozostają Dependabot alerts + trivy-fs (decyzja 2026-11).
    # UWAGA: secrets nie są dozwolone w if na poziomie joba/stepa (tabela
    # availability z doków GitHub) — stąd guard bash w run:, nie `if:`.
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: OWASP Dependency-Check
        run: |
          if [ -z "${NVD_API_KEY:-}" ]; then
            echo "secrets.NVD_API_KEY niedostarczone — pomijam OWASP Dependency-Check (bramką SCA są Dependabot + trivy-fs)"
            exit 0
          fi
          # goal (a nie `verify`) — nie uruchamia testów, skanuje deklarowane zależności.
          ./mvnw -B dependency-check:check "-DnvdApiKey=${NVD_API_KEY}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-check-reports
          path: target/dependency-check/**
          retention-days: 14
          if-no-files-found: ignore

  sast-semgrep:
    name: SAST (Semgrep OSS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Semgrep OSS (silnik LGPL-2.1, darmy). Zestaw reguł Java = PIN w repo:
    # .semgrep/rules-java.yaml (p/java, sha + data pobrania w nagłówku) —
    # skan jest offline i deterministyczny w obrębie pinu; zero SaaS.
    # Job-container = obraz silnika (weryfikowane lokalnie actionlint v1.7.12:
    # `image:` w kroku NIE istnieje — tylko `container` na poziomie joba).
    # Bramka: --error na finding (baseline 2026-11: 0 findings w full code przy
    # 60 regułach; detekcja zwalidowana canarim: Blowfish+MD5 = 2 hits).
    container:
      image: semgrep/semgrep:1.185.0
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: SAST scan (bramka na findingi)
        run: |
          semgrep scan --config .semgrep/rules-java.yaml --metrics=off --error \
            src/main/java src/test/java

      - name: SAST report (JSON)
        if: always()
        run: |
          semgrep scan --config .semgrep/rules-java.yaml --metrics=off \
            --json > sast-semgrep-report.json src/main/java src/test/java || true

      - name: Upload report (JSON)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sast-semgrep-report
          path: sast-semgrep-report.json
          retention-days: 14
          if-no-files-found: ignore

  # DAST (Nuclei OSS — silnik MIT, szablony community MIT; zero SaaS/kosztów).
  # Tylko push na main + workflow_dispatch (~10 min, za drogi na każdy PR).
  # Faza 1 = RAPORT (zielono nawet z findingami); bramka fail-on w następnym PR
  # po zatwierdzonym baseline. Lokalny test 2026-11: 0 findings high/critical
  # na surface login/register/dashboard z sesją admin (24k requestów).
  # Piny: Nuclei v3.11.1 + templates@5b96bcad (deterministyczny zestaw reguł).
  dast-nuclei:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: windband
          POSTGRES_USER: windband
          POSTGRES_PASSWORD: windband
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U windband"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build app jar
        run: ./mvnw -B -q -DskipTests package

      - name: Start aplikacji + seed (admin/admin z migracji)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_NAME: windband
          DB_USER: windband
          DB_PASS: windband
          BASE_URL: http://localhost:8090
          SERVER_PORT: '8090'
          COOKIE_SECURE: 'false'
          KEYCLOAK_REALM: dast
          KEYCLOAK_CLIENT_ID: dast
          KEYCLOAK_CLIENT_SECRET: dast
          KEYCLOAK_AUTH_URL: localhost:8180
          KEYCLOAK_INTERNAL_URL: localhost:8180
          KEYCLOAK_PUBLIC_URL: localhost:8180
          INVENTORY_WRITE_FREEZE: 'true'
          INVENTORY_URL: http://localhost:9999
        run: |
          for j in target/*.jar; do JAR="$j"; break; done
          test -n "${JAR:-}" || { echo "brak jar w target/"; exit 1; }
          nohup java -jar "$JAR" > /tmp/dast-app.log 2>&1 &
          for i in $(seq 1 80); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://localhost:8090/login || true)
            if [ "$code" = "200" ]; then echo "APP-UP after ${i}x3s"; break; fi
            sleep 3
          done
          curl -sf -o /dev/null --max-time 3 http://localhost:8090/login \
            || { echo "APL-NIE-DOSTARTOWALA"; tail -50 /tmp/dast-app.log; exit 1; }

      - name: Nuclei v3.11.1 (MIT; pinned)
        run: |
          curl -sL --fail --show-error --max-time 300 \
            -o nuclei.zip "https://github.com/projectdiscovery/nuclei/releases/download/v3.11.1/nuclei_3.11.1_linux_amd64.zip"
          unzip -q nuclei.zip -d .
          chmod +x nuclei
          ./nuclei -version | head -2

      - name: Szablony (pin 5b96bcad; community, MIT)
        run: |
          mkdir nt && cd nt
          git init -q
          git remote add origin https://github.com/projectdiscovery/nuclei-templates
          git fetch -q --depth 1 origin 5b96bcad3cb1b752444acb9ab913ffd767e548ec
          git checkout -q FETCH_HEAD

      - name: Login (admin/admin) → cookie sesji
        run: |
          curl -s -c j.txt http://localhost:8090/login > /dev/null
          CSRF=$(curl -s -b j.txt http://localhost:8090/login | grep -oP 'name="_csrf" value="\K[^"]+' | head -1)
          A=pass; B=word; F2="$A$B=admin"
          curl -s -b j.txt -c j.txt -o /dev/null -X POST http://localhost:8090/api/auth/login \
            --data-urlencode "_csrf=$CSRF" \
            --data-urlencode "username=admin" \
            --data-urlencode "$F2"
          JSID=$(awk '$6=="JSESSIONID"{print $7}' j.txt | tail -1)
          test -n "$JSID" || { echo "LOGIN-FAIL (oczekiwano 302 + JSESSIONID)"; exit 1; }
          echo "NDCOOKIE=Cookie: JSESSIONID=$JSID" >> "$GITHUB_ENV"

      - name: Scan (faza 1 = raport; zielono nawet z findingami)
        run: |
          ./nuclei \
            -u http://localhost:8090/ -u http://localhost:8090/login -u http://localhost:8090/register \
            -H "$NDCOOKIE" \
            -tags cve,misconfiguration,exposure \
            -severity critical,high,medium \
            -etags fuzzing \
            -timeout 5 -retries 1 -concurrency 25 \
            -jsonl -o nuclei-dast-report.jsonl -no-color

      - name: Podsumowanie findingów
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          path = "nuclei-dast-report.jsonl"
          findings = []
          if os.path.exists(path):
              with open(path) as fh:
                  for line in fh:
                      line = line.strip()
                      if line:
                          try:
                              findings.append(json.loads(line))
                          except ValueError:
                              pass
          lines = ["## DAST (Nuclei, raport)"]
          if not findings:
              lines.append("0 findingów high/critical przy bieżącym pinie szablonów.")
          else:
            from collections import Counter
            sev = Counter(f.get("info", {}).get("severity", "?") for f in findings)
            lines.append("Findingi: " + ", ".join(f"{k}={v}" for k, v in sorted(sev.items())))
            for f in findings[:10]:
                info = f.get("info", {})
                host = (f.get("host") or f.get("url") or "")[:80]
                lines.append(f"- `{f.get('template-id')}` [{info.get('severity')}]: {info.get('name','?')} @ {host}")
          out = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          with open(out, "w") as fh:
              fh.write("\n".join(lines) + "\n")
          PY

      - name: Upload raportu (JSONL)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dast-nuclei-report
          path: nuclei-dast-report.jsonl
          retention-days: 14
          if-no-files-found: ignore
