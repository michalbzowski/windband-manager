<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Wydarzenia')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <main class="container" id="content">
        <div id="events-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <h2>🎪 Wydarzenia</h2>
                <button hx-get="/events/new" hx-target="#events-content"
                        hx-swap="innerHTML transition:true" class="primary">+ Dodaj wydarzenie</button>
            </div>

            <div th:if="${#lists.isEmpty(events)}">
                <article>
                    <p>Brak wydarzeń w systemie.</p>
                </article>
            </div>

            <div th:unless="${#lists.isEmpty(events)}">
                <table role="grid">
                    <thead>
                        <tr>
                            <th>Nazwa</th>
                            <th>Data</th>
                            <th>Miejsce</th>
                            <th>Typ</th>
                            <th>Potwierdzenia</th>
                            <th>Akcje</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="e : ${events}">
                            <td th:text="${e.name}">Koncert</td>
                            <td th:text="${e.date}">01.01.2025</td>
                            <td th:text="${e.location}">Rynek</td>
                            <td th:text="${e.eventType}">CONCERT</td>
                            <td>
                                <span th:text="${e.confirmedCount} + ' ✅ / ' + ${e.declinedCount} + ' ❌ / ' + ${e.noResponseCount} + ' ?'">5 ✅ / 2 ❌ / 8 ?</span>
                            </td>
                            <td>
                                <button class="outline small"
                                        th:hx-get="@{/events/{id}(id=${e.id})}"
                                        hx-target="#events-content"
                                        hx-swap="innerHTML transition:true">Szczegóły</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
