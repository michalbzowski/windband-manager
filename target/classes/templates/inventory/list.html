<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inwentaryzacja')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <main class="container" id="content">
        <div id="inventory-content">
            <h2>📦 Inwentaryzacja</h2>

            <div class="grid">
                <div>
                    <h3>🎖️ Stroje</h3>
                    <table role="grid">
                        <thead>
                            <tr>
                                <th>Element</th>
                                <th>Muzyk</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${uniformItems}">
                                <td th:text="${u.name}">Czapka</td>
                                <td th:text="${u.assignedMember != null ? u.assignedMember.firstName + ' ' + u.assignedMember.lastName : '-'}">Jan Kowalski</td>
                                <td>
                                    <span th:switch="${u.ownershipStatus.name()}">
                                        <span th:case="'OWNED'" th:text="'✅ Własny'">Własny</span>
                                        <span th:case="'BORROWED'" th:text="'🔄 Wypożyczony'">Wypożyczony</span>
                                        <span th:case="'MISSING'" th:text="'❌ Brak'">Brak</span>
                                    </span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div>
                    <h3>🎺 Instrumenty</h3>
                    <table role="grid">
                        <thead>
                            <tr>
                                <th>Instrument</th>
                                <th>Muzyk</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="i : ${instrumentItems}">
                                <td th:text="${i.name}">Trąbka</td>
                                <td th:text="${i.assignedMember != null ? i.assignedMember.firstName + ' ' + i.assignedMember.lastName : '-'}">Jan Kowalski</td>
                                <td>
                                    <span th:switch="${i.ownershipStatus.name()}">
                                        <span th:case="'OWNED'" th:text="'✅ Własny'">Własny</span>
                                        <span th:case="'BORROWED'" th:text="'🔄 Wypożyczony'">Wypożyczony</span>
                                        <span th:case="'MISSING'" th:text="'❌ Brak'">Brak</span>
                                    </span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
