<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Raporty')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <main class="container" id="content">
        <div id="reports-content">
            <h2>📊 Raporty</h2>

            <article>
                <header><strong>Raport miesięczny</strong></header>
                <p>Wygeneruj raport dla wybranego miesiąca. Raport zawiera liczbę prób, wydarzeń oraz statystyki członków.</p>

                <form hx-get="/reports/generate" hx-target="#reports-content"
                      hx-swap="innerHTML transition:true">
                    <div class="grid">
                        <label>
                            Rok
                            <input type="number" name="year" th:value="${currentMonth.year}" min="2020" max="2099" required>
                        </label>
                        <label>
                            Miesiąc
                            <select name="month" required>
                                <option th:each="m : ${#numbers.sequence(1,12)}"
                                        th:value="${m}"
                                        th:text="${m}"
                                        th:selected="${m == currentMonth.monthValue}">1</option>
                            </select>
                        </label>
                    </div>
                    <button type="submit" class="primary">Generuj raport</button>
                </form>
            </article>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
