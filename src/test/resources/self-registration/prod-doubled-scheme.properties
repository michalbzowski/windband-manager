# Env vars for the sliced context to resolve application.yml placeholders
# (same names/values as docker-compose.yml local dev).
KEYCLOAK_PUBLIC_URL=localhost:8180
KEYCLOAK_REALM=windband
KEYCLOAK_CLIENT_ID=windband-local
KEYCLOAK_CLIENT_SECRET=windband-local-secret
BASE_URL=http://localhost:8080

# Production-shaped registration URL as application.yml currently produces it
# (KEYCLOAK_PUBLIC_URL contains https:// + yml prepends another one).
# Values live here (instead of inline Java annotations) because the Checkstyle
# ANTLR parser mis-handles "//" inside long string literals during annotation parsing.
app.keycloak.registration-redirect-url=https://https://login.bandmanager.pl/realms/windband/protocol/openid-connect/registrations?client_id=windband-manager
