# Env vars for the sliced context to resolve application.yml placeholders
# (same names/values as docker-compose.yml local dev).
KEYCLOAK_PUBLIC_URL=localhost:8180
KEYCLOAK_REALM=windband
KEYCLOAK_CLIENT_ID=windband-local
KEYCLOAK_CLIENT_SECRET=windband-local-secret
BASE_URL=http://localhost:8080

# Local-stack shaped registration URL (plain HTTP, already clean).
# Guard: normalization must NOT touch an already-valid single-scheme URL.
app.keycloak.registration-redirect-url=http://localhost:8180/realms/windband/protocol/openid-connect/registrations?client_id=windband-local
