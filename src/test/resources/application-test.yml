# Disable Jackson XML parsing in JasperReports 7.x to avoid UnrecognizedPropertyException on "band" field
jasperreports:
  jackson:
    xml:
      enabled: false

spring:
  application:
    name: windband-manager

  datasource:
    url: jdbc:h2:mem:windband;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  flyway:
    enabled: false

  thymeleaf:
    cache: false

  mail:
    host: localhost
    port: 587
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: test-client
            client-secret: test-secret
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8080/login/oauth2/code/keycloak"
            provider: keycloak
        provider:
          keycloak:
            authorization-uri: http://localhost:8180/realms/windband/protocol/openid-connect/auth
            token-uri: http://localhost:8180/realms/windband/protocol/openid-connect/token
            user-info-uri: http://localhost:8180/realms/windband/protocol/openid-connect/userinfo
            jwk-set-uri: http://localhost:8180/realms/windband/protocol/openid-connect/certs
            user-name-attribute: preferred_username

server:
  port: 8080

app:
  base-url: http://localhost:8080
  keycloak:
    url: http://localhost:8180
    realm: windband
    client-id: test-client
    client-secret: test-secret

superset:
  base-url: http://localhost:8088
  username: admin
  password: admin
  guest-token-jwt-secret: WindbandGuestToken2026!ChangeMe#VeryLongSecretForSecurity

keycloak:
  url: http://localhost:8180
  realm: windband
  superset:
    client:
      id: superset
      secret: supersetsecret