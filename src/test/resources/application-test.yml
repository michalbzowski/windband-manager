spring:
  application:
    name: windband-manager

  datasource:
    url: jdbc:h2:mem:windband;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  flyway:
    enabled: false

  thymeleaf:
    cache: false

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: windband-manager
            client-secret: test-secret
            scope: openid,profile,email
            authorization-grant-type: authorization_code
        provider:
          keycloak:
            issuer-uri: http://localhost:8180/realms/windband
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/windband

server:
  port: 8080

app:
  base-url: http://localhost:8080
  keycloak:
    url: http://localhost:8180
    realm: windband
    client-id: windband-manager
    client-secret: test-secret