<!DOCTYPE html>
<!--
  fragments/icons.html — theme-aware icon library (single source of truth).

  Every icon is a <th:block th:fragment="NAME"> ... </th:block>. Reference with:
    <th:block th:insert="~{fragments/icons :: back}"></th:block>

  Icon policy (MUST hold for every entry — enforced by PageHeaderConsistencyUiTest):
  * <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width=…>.
  * currentColor resolves to the host's computed color → theme-aware by construction.
  * NO emoji glyphs, NO solid-fill paths (fill must be "none"), NO inline styles,
    NO hardcoded rgba/hex anywhere in this file.

  Naming: noun/verb matching what the icon DO…
-->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Back arrow (left-pointing). Used by every view with a backUrl. -->
<th:block th:fragment="back">
    <svg viewBox="0 0 24 24" width="22" height="22"
         fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
</th:block>

<!-- Pencil — edit. -->
<th:block th:fragment="edit">
    <svg viewBox="0 0 24 24" width="20" height="20"
         fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 20h9"/>
        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
    </svg>
</th:block>

<!-- Trash — delete (destructive). -->
<th:block th:fragment="trash">
    <svg viewBox="0 0 24 24" width="18" height="18"
         fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 6h18"/>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2-2v2"/>
    </svg>
</th:block>

<!-- Plus — create. -->
<th:block th:fragment="plus">
    <svg viewBox="0 0 24 24" width="18" height="18"
         fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14"/>
    </svg>
</th:block>

<!-- Horizontal ellipsis (⋮ vertical variant — three dots). -->
<th:block th:fragment="dots">
    <svg viewBox="0 0 24 24" width="22" height="22"
         fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="5"  r="1.6"/>
        <circle cx="12" cy="12" r="1.6"/>
        <circle cx="12" cy="19" r="1.6"/>
    </svg>
</th:block>

<!-- Close/cancel (X) — used by "Anuluj" / dismiss actions. -->
<th:block th:fragment="close">
    <svg viewBox="0 0 24 24" width="18" height="18"
         fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18"/>
    </svg>
</th:block>

<!-- Arrow right — used inside action links like "Dodaj →". -->
<th:block th:fragment="arrow-right">
    <svg viewBox="0 0 24 24" width="14" height="14"
         fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14M12 5l7 7-7 7"/>
    </svg>
</th:block>

<!-- Calendar — used by list-view title for events/rehearsals. -->
<th:block th:fragment="calendar">
    <svg viewBox="0 0 24 24" width="18" height="18"
         fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <path d="M16 2v4M8 2v4M3 10h18"/>
    </svg>
</th:block>

<!-- People/users. -->
<th:block th:fragment="people">
    <svg viewBox="0 0 24 24" width="18" height="18"
         fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/...[truncated]
</th:block>

<!-- Tag/label. -->
<th:block th:fragment="tag">
    <svg viewBox="0 0 24 24" width="18" height="18"
         fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.83z"/>
        <circle cx="7" cy="7" r="1.2"/>
    </svg>
</th:block>

<!-- Box/package — inventory / assets. -->
<th:block th:fragment="box">
    <svg viewBox="0 0 24 24" width="18" height="18"
         fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        <path d="M3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/>
    </svg>
</th:block>

<!-- Music note — instruments / music-related lists. -->
<th:block th:fragment="music">
    <svg viewBox="0 0 24 24" width="18" height="18"
         fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 18V5l12-2v13"/>
        <circle cx="6" cy="18" r="3"/>
        <circle cx="18" cy="16" r="3"/>
    </svg>
</th:block>

<!-- Clipboard — reports / orders. -->
<th:block th:fragment="clipboard">
    <svg viewBox="0 0 24 24" width="18" height="18"
         fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
        <rect x="8" y="2" width="8" height="4" rx="1"/>
        <path d="M9 12h6M9 16h4"/>
    </svg>
</th:block>

<!-- Gauge — dashboards. -->
<th:block th:fragment="gauge">
    <svg viewBox="0 0 24 24" width="18" height="18"
         fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 15l-3.5-3.5"/>
        <path d="M20.38 18.17A9 9 0 1 1 3.62 18.17"/>
    </svg>
</th:block>

<!-- Group/people-circle — group views. -->
<th:block th:fragment="group">
    <svg viewBox="0 0 24 24" width="18" height="18"
         fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="9" cy="7" r="4"/>
        <path d="M17 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
    </svg>
</th:block>


<!-- Warning triangle — attention alerts. -->
<th:block th:fragment="warn">
    <svg viewBox="0 0 24 24" width="20" height="20"
         fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9"  x2="12" y2="13"/>
        <circle cx="12" cy="17" r="1"/>
    </svg>
</th:block>

<!-- Key — authentication / SSO. -->
<th:block th:fragment="key">
    <svg viewBox="0 0 24 24" width="20" height="20"
         fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="7.5" cy="15.5" r="5.5"/>
        <path d="M13 10L20 3M16 6l3 3"/>
    </svg>
</th:block>

<!-- Check — success. -->
<th:block th:fragment="check">
    <svg viewBox="0 0 24 24" width="22" height="22"
         fill="none" stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <path d="M8 13l3 3 5-6"/>
    </svg>
</th:block>

<!-- Lightning bolt — brand mark. -->
<th:block th:fragment="bolt">
    <svg viewBox="0 0 24 24" width="18" height="18"
         fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
    </svg>
</th:block>

<!-- Medal/tr...[truncated]
</content>

<!-- Medal — awards / inventory (🎖️ replacement). -->
<th:block th:fragment="award">
    <svg viewBox="0 0 24 24" width="20" height="20"
         fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="7" r="5"/>
        <path d="M8 12L4 22h6l2-4 2 4h6l-4-10"/>
    </svg>
</th:block>

<!-- Tent — events (🎪 replacement). -->
<th:block th:fragment="event">
    <svg viewBox="0 0 24 24" width="18" height="18"
         fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3L2 20h20L12 3z"/>
        <path d="M12 12l-3 8h6l-3-8z"/>
    </svg>
</th:block>

</body>
</html>
