<!DOCTYPE html>
<!--
  fragments/page-header.html — single source of truth for EVERY view's header.

  Two fragment signatures (Thymeleaf params are positional and must match exact count):

  page-header(backUrl, title, editLabel, editUrl, editIcon, editId,
              deleteLabel, deleteUrl, deleteIcon, deleteId)         // PR A — detail pages
  page-header-b(backUrl, title, editLabel, editUrl, editIconName, editId,
                editHxTarget, deleteLabel, deleteUrl, deleteIcon, deleteId)   // PR B — list pages (htmx + named icon)

  Rendering rules (shared):
    • backUrl != null              → <a class="detail-back-link"> + icons::back
    • title                        → <h2 class="detail-title">
    • editLabel & editUrl set      → primary action (<a> or <button hx-get>)
                                     (icon: icons::${editIconName} or legacy inline pencil)
    • deleteLabel set              → ⋮ trigger + overflow menu with danger item

  • NO inline styles; geometry from app.css (.detail-actions-bar/.icon-btn/.detail-title/…)
  • ARIA: role=navigation, aria-label="Nagłówek widoku", aria-haspopup=menu on ⋮.
-->
<html xmlns:th="http://www.thymeleaf.org">
<head><title>page-header fragment</title></head>
<body>

<!-- ════════════════════════════════════════════════════
     PR A — detail variant (10 params, unchanged from PR A)
     ════════════════════════════════════════════════════ -->
<nav class="detail-actions-bar page-header"
     role="navigation"
     aria-label="Nagłówek widoku"
     th:fragment="page-header(backUrl, title, editLabel, editUrl, editIcon, editId, deleteLabel, deleteUrl, deleteIcon, deleteId)"
     data-page-header="v1"
     data-detail-bar="true">

    <!-- back -->
    <a class="detail-back-link"
       th:if="${backUrl != null}"
       th:href="${backUrl}"
       title="Powrót" aria-label="Powrót"
       data-detail-action="back">
        <th:block th:insert="~{fragments/icons :: back}"></th:block>
    </a>

    <!-- title -->
    <h2 class="detail-title" th:text="${title}" th:title="${title}">Tytuł</h2>

    <!-- inline primary action — legacy pencil icon (PR A behaviour) -->
    <a class="ph-primary-action"
       th:if="${editLabel != null and editUrl != null}"
       th:href="${editUrl}"
       th:id="${editId}">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        <span th:text="${editLabel}">Edytuj</span>
    </a>

    <!-- overflow ⋮ -->
    <th:block th:if="${deleteLabel != null}">
        <span class="overflow-wrap">
            <button type="button" class="icon-btn"
                    title="Więcej akcji" aria-label="Więcej akcji"
                    aria-haspopup="menu" aria-expanded="false"
                    data-detail-action="toggle-more">
                <th:block th:insert="~{fragments/icons :: dots}"></th:block>
            </button>
            <div class="overflow-menu" role="menu" aria-label="Więcej akcji…">
                <button type="button" class="overflow-item danger"
                        role="menuitem"
                        th:href="${deleteUrl}"
                        th:id="${deleteId}">
                    <th:block th:if="${deleteIcon == null or deleteIcon == 'trash'}" th:insert="~{fragments/icons :: trash}"></th:block>
                    <th:block th:if="${deleteIcon != null and deleteIcon == 'close'}" th:insert="~{fragments/icons :: close}"></th:block>
                    <span th:text="${deleteLabel}">Usuń</span>
                </button>
            </div>
        </span>
    </th:block>

</nav>

<!-- ════════════════════════════════════════════════════
     PR B — list variant (11 params, htmx + named icon)
     editIconName: "plus", "music", "people", … from fragments/icons.html
     editHxTarget: CSS selector string like '#events-content' or null for plain <a>
     ════════════════════════════════════════════════════ -->
<nav class="detail-actions-bar page-header"
     role="navigation"
     aria-label="Nagłówek widoku"
     th:fragment="page-header-b(backUrl, title, editLabel, editUrl, editIconName, editId, editHxTarget, deleteLabel, deleteUrl, deleteIcon, deleteId)"
     data-page-header="v1"
     data-detail-bar="true">

    <!-- back (same as PR A) -->
    <a class="detail-back-link"
       th:if="${backUrl != null}"
       th:href="${backUrl}"
       title="Powrót" aria-label="Powrót"
       data-detail-action="back">
        <th:block th:insert="~{fragments/icons :: back}"></th:block>
    </a>

    <!-- title (same as PR A) -->
    <h2 class="detail-title" th:text="${title}" th:title="${title}">Tytuł</h2>

    <!-- inline primary action — htmx button or plain link, with named icon from icons.html -->
    <th:block th:if="${editLabel != null and editUrl != null}">
        <!-- htmx button variant -->
        <button type="button" class="ph-primary-action htmx"
                th:if="${editHxTarget != null}"
                th:id="${editId}"
                th:hx-get="${editUrl}"
                th:hx-target="${editHxTarget}"
                th:hx-swap="'innerHTML transition:true'">
            <th:block th:insert="~{fragments/icons :: plus}"></th:block>
            <span th:text="${editLabel}">Dodaj</span>
        </button>
        <!-- plain link variant -->
        <a class="ph-primary-action"
           th:if="${editHxTarget == null}"
           th:href="${editUrl}"
           th:id="${editId}">
            <th:block th:insert="~{fragments/icons :: plus}"></th:block>
            <span th:text="${editLabel}">Dodaj</span>
        </a>
    </th:block>

    <!-- overflow ⋮ (same as PR A) -->
    <th:block th:if="${deleteLabel != null}">
        <span class="overflow-wrap">
            <button type="button" class="icon-btn"
                    title="Więcej akcji" aria-label="Więcej akcji"
                    aria-haspopup="menu" aria-expanded="false"
                    data-detail-action="toggle-more">
                <th:block th:insert="~{fragments/icons :: dots}"></th:block>
            </button>
            <div class="overflow-menu" role="menu" aria-label="Więcej akcji…">
                <button type="button" class="overflow-item danger"
                        role="menuitem"
                        th:href="${deleteUrl}"
                        th:id="${deleteId}">
                    <th:block th:if="${deleteIcon == null or deleteIcon == 'trash'}" th:insert="~{fragments/icons :: trash}"></th:block>
                    <th:block th:if="${deleteIcon != null and deleteIcon == 'close'}" th:insert="~{fragments/icons :: close}"></th:block>
                    <span th:text="${deleteLabel}">Usuń</span>
                </button>
            </div>
        </span>
    </th:block>

</nav>

</body>
</html>
