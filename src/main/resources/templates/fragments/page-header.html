<!DOCTYPE html>
<!--
  fragments/page-header.html — single source of truth for EVERY view's header.

  API (scalar params, all optional). Variants inferred from which params are set:
      page-header(backUrl, title,
                  editLabel?,  editUrl?,  editIcon?,  editId?    )   // inline primary action
                  deleteLabel?, deleteUrl?, deleteIcon?, deleteId?)  // overflow ⋮ danger entry

  PR B additions (list variant), all optional — existing PR A call sites unaffected:
      page-header(…,
                  action2Label?,  action2Url?,  action2Icon?,  action2Id?   )  // 2nd inline action
                  editHxTarget?, editHxSwap?)                              // primary as htmx button

  Param 4 (`editIcon`) in PR B: icon NAME from fragments/icons.html.
  "edit" (or null/"") keeps the PR A legacy inline pencil; any other name
  (e.g. "plus", "music") renders that named stroke-based fragment instead.

  Rendering:
    • backUrl != null              → <a class="detail-back-link"> + icons::back
    • title                        → <h2 class="detail-title">
    • editLabel & editUrl set      → <a class="ph-primary-action" th:id="${editId}"> + icon
                                     (icon defaults to icons::edit; pass editIcon to override)
    • deleteLabel set              → ⋮ trigger (.icon-btn) + .overflow-item.danger[th:id=${deleteId}]
                                     (icon defaults to icons::trash)

  Notes:
  • Scalar params, not a list-of-maps — Thymeleaf 3.1.2 cannot evaluate SpEL collection
    literals or @{}/#spring.url link-exprs inside a fragment *parameter* position reliably
    (PR A bug). Pass individual strings + booleans for bulletproof rendering. PRs B–D
    may still call the same API with more actions by either passing extra optional params
    (e.g., primaryAction2Label…/Url…) or, better, pre-building the list in a controller +
    model attr and using th:each inside the fragment — but that's out of scope for PR A.
  • NO inline styles; geometry from app.css (.detail-actions-bar/.icon-btn/.detail-title/…).
  • ARIA: role=navigation, aria-label="Nagłówek widoku", aria-haspopup=menu on ⋮.
-->
<html xmlns:th="http://www.w3.org/1999/xhtml">
<head><title>page-header fragment</title></head>
<body>
<nav class="detail-actions-bar page-header"
     role="navigation"
     aria-label="Nagłówek widoku"
     th:fragment="page-header(backUrl, title, editLabel, editUrl, editIcon, editId, deleteLabel, deleteUrl, deleteIcon, deleteId, action2Label, action2Url, action2Icon, action2Id, editHxTarget, editHxSwap)"
     data-page-header="v1"
     data-detail-bar="true">

    <!-- back -->
    <a class="detail-back-link"
       th:if="${backUrl != null}"
       th:href="${backUrl}"
       title="Powrót" aria-label="Powrót"
       data-detail-action="back">
        <th:block th:insert="~{fragments/icons :: back}"></th:block>
    </a>

    <!-- title -->
    <h2 class="detail-title" th:text="${title}" th:title="${title}">Tytuł</h2>

    <!-- inline primary action.
         Icon resolution (PR B): param 4 is an icon NAME from fragments/icons.html.
         "edit"/"" → legacy inline pencil (PR A behaviour, kept for compatibility);
         any other name → th:insert of the named stroke-based fragment ("plus" etc.). -->
    <a class="ph-primary-action"
       th:if="${editLabel != null and editUrl != null and editHxTarget == null}"
       th:href="${editUrl}"
       th:id="${editId}">
        <th:block th:if="${editIcon == null or editIcon == '' or editIcon == 'edit'}">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 20h9"/>
                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
            </svg>
        </th:block>
        <th:block th:if="${editIcon != null and editIcon != '' and editIcon != 'edit'}"
                  th:insert="${'fragments/icons :: ' + editIcon}"></th:block>
        <span th:text="${editLabel}">Edytuj</span>
    </a>

    <!-- optional second inline action (PR B, list views with a secondary primary-like
         affordance such as "Aktualizuj grupy dynamiczne"). Same rendering contract:
         stroke-based icon from fragments/icons.html, no inline styles. -->
    <a class="ph-secondary-action"
       th:if="${action2Label != null and action2Url != null}"
       th:href="${action2Url}"
       th:id="${action2Id}">
        <th:block th:if="${action2Icon == null or action2Icon == ''}"
                  th:insert="${'fragments/icons :: plus'}"></th:block>
        <th:block th:if="${action2Icon != null and action2Icon != ''}"
                  th:insert="${'fragments/icons :: ' + action2Icon}"></th:block>
        <span th:text="${action2Label}">Akcja</span>
    </a>

    <!-- HTMX variant of the primary action (list "+ Dodaj …" flows): htmx auto-upgrades
         <button hx-get=…> on DOMContentLoaded, so a plain button carries no inline JS.
         When both are set, this replaces the plain <a> primary and hosts pass
         editHxTarget (e.g. '#events-content'). -->
    <button type="button" class="ph-primary-action htmx"
            th:if="${editLabel != null and editUrl != null and editHxTarget != null}"
            th:id="${editId}"
            th:hx-get="${editUrl}"
            th:hx-target="${editHxTarget}"
            th:hx-swap="${editHxSwap != null ? editHxSwap : 'innerHTML transition:true'}">
        <th:block th:if="${editIcon == null or editIcon == '' or editIcon == 'edit'}">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 20h9"/>
                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
            </svg>
        </th:block>
        <th:block th:if="${editIcon != null and editIcon != '' and editIcon != 'edit'}"
                  th:insert="${'fragments/icons :: ' + editIcon}"></th:block>
        <span th:text="${editLabel}">Dodaj</span>
    </button>

    <!-- overflow ⋮ (delete / other danger actions) -->
    <th:block th:if="${deleteLabel != null}">
        <span class="overflow-wrap">
            <button type="button" class="icon-btn"
                    title="Więcej akcji" aria-label="Więcej akcji"
                    aria-haspopup="menu" aria-expanded="false"
                    data-detail-action="toggle-more">
                <th:block th:insert="~{fragments/icons :: dots}"></th:block>
            </button>
            <div class="overflow-menu" role="menu" aria-label="Więcej akcji…">
                <button type="button" class="overflow-item danger"
                        role="menuitem"
                        th:href="${deleteUrl}"
                        th:id="${deleteId}">
                    <th:block th:if="${deleteIcon == null or deleteIcon == 'trash'}" th:insert="~{fragments/icons :: trash}"></th:block>
                    <th:block th:if="${deleteIcon != null and deleteIcon == 'close'}" th:insert="~{fragments/icons :: close}"></th:block>
                    <span th:text="${deleteLabel}">Usuń</span>
                </button>
            </div>
        </span>
    </th:block>

</nav>
</body>
</html>
