<!-- Detail page actions bar fragment - used by events/detail and rehearsals/detail -->
<!-- Place this AFTER dashboard-header but BEFORE main content to create unified header appearance -->

<div th:fragment="detail-page-actions(backUrl, title)" 
     class="detail-page-actions-bar"
     style="display:flex; align-items:center; gap:0.75rem; padding:0.75rem 1rem; background-color:#ffffff; border-bottom:2px solid var(--pico-muted-border-color); margin:-1rem -1rem 1rem -1rem;"
     th:with="actionBarHeight=48">

    <!-- Back navigation button -->
    <a href="#" 
       class="detail-back-btn" 
       style="text-decoration:none; color:var(--pico-muted-color); font-weight:600; line-height:1.5rem;"
       th:href="${backUrl}">
        ←
    </a>

    <!-- Page title -->
    <h2 class="detail-page-title" 
        style="margin:0 0 0 auto; color:var(--pico-muted-color);"
        th:text="${title}">Szczegóły wydarzenia
    </h2>

    <!-- Action buttons container (right-aligned) -->
    <div class="detail-actions-right" style="display:flex; gap:0.5rem;">
        <slot></slot>
    </div>
</div>
