<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' — Wind Band Manager'">Wind Band Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="https://unpkg.com/htmx.org@2.0.2"></script>
    <script>
        // Ignore errors from browser extensions - they shouldn't break our code
        window.onerror = function(msg, url, line, col, error) {
            console.log('Ignored error:', msg);
            return true;
        };
        console.log('Page loaded, script starting...');

        // Add JWT token to all HTMX requests
        document.addEventListener('htmx:configRequest', function(evt) {
            const name = 'JWT=';
            const decodedCookie = decodeURIComponent(document.cookie);
            const ca = decodedCookie.split(';');
            let token = null;
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1);
                if (c.indexOf(name) === 0) {
                    token = c.substring(name.length, c.length);
                    break;
                }
            }
            if (token) {
                evt.detail.headers['Authorization'] = 'Bearer ' + token;
            }
        });

        // Check JWT expiry on page load and redirect to login if expired
        (function() {
            try {
                const name = 'JWT=';
                const decodedCookie = decodeURIComponent(document.cookie);
                const ca = decodedCookie.split(';');
                let token = null;
                for(let i = 0; i < ca.length; i++) {
                    let c = ca[i];
                    while (c.charAt(0) === ' ') c = c.substring(1);
                    if (c.indexOf(name) === 0) {
                        token = c.substring(name.length, c.length);
                        break;
                    }
                }
                if (token) {
                    // JWT format: header.payload.signature
                    const parts = token.split('.');
                    if (parts.length === 3) {
                        // Decode payload (second part)
                        const payload = JSON.parse(atob(parts[1]));
                        const exp = payload.exp;
                        if (exp) {
                            const now = Math.floor(Date.now() / 1000);
                            if (exp < now) {
                                // Token expired, redirect to login
                                window.location.href = '/login?expired=true';
                                return;
                            }
                        }
                    }
                }
            } catch (e) {
                // If any error, just continue (token might be invalid)
            }
        })();
    </script>
</head>
<body>
    <nav class="container-fluid" th:fragment="nav" sec:authorize="isAuthenticated()">
        <ul>
            <li><strong><a th:href="@{/}" style="text-decoration:none;color:inherit;">🎺 Wind Band Manager</a></strong></li>
        </ul>
        <ul>
            <li><a th:href="@{/members}" hx-target="#content" hx-swap="innerHTML transition:true">Muzycy</a></li>
            <li><a th:href="@{/groups}" hx-target="#content" hx-swap="innerHTML transition:true">Grupy</a></li>
            <li><a th:href="@{/rehearsals}" hx-target="#content" hx-swap="innerHTML transition:true">Próby</a></li>
            <li><a th:href="@{/events}" hx-target="#content" hx-swap="innerHTML transition:true">Wydarzenia</a></li>
            <li><a th:href="@{/inventory}" hx-target="#content" hx-swap="innerHTML transition:true">Inwentaryzacja</a></li>
            <li><a th:href="@{/instruments}" hx-target="#content" hx-swap="innerHTML transition:true">Instrumenty</a></li>
            <li><a th:href="@{/reports}" hx-target="#content" hx-swap="innerHTML transition:true">Raporty</a></li>
            <li><a th:href="@{/band/attributes(type='MEMBER')}" hx-target="#content" hx-swap="innerHTML transition:true">Atrybuty</a></li>
        </ul>
        <ul>
            <li class="nav-user-info">
                <span class="team-icon">👤</span>
                <span th:text="${#authentication.principal.wbUsername}">user</span>
                <span class="separator">|</span>
                <span class="team-icon">🎺</span>
                <!-- Active team: show select if multi-team, text if single -->
                <span id="nav-team-area">
                    <select id="nav-team-select" style="display:none; font-size:0.85rem; padding:0.2rem 0.5rem; border-radius:4px;" onchange="switchTeam(this.value)"></select>
                    <span id="nav-team-single">
                        <span class="team-name" th:text="${#authentication.principal.activeTeamSlug ?: 'brak zespołu'}">zespół</span>
                        <span class="team-role" th:if="${#authentication.principal.activeTeamRole}">(<span th:text="${#authentication.principal.activeTeamRole.toLowerCase()}">rola</span>)</span>
                    </span>
                </span>
            </li>
            <li><a href="/register" hx-target="#content" hx-swap="innerHTML transition:true" id="nav-new-team" sec:authorize="isAuthenticated()">➕ Nowy zespół</a></li>
            <li>
                <form th:action="@{/api/auth/logout}" method="POST" style="display:inline;">
                    <button type="submit" class="outline secondary small">Wyloguj</button>
                </form>
            </li>
        </ul>
    </nav>

    <main class="container" id="content">
        <!-- treść ładowana przez HTMX -->
    </main>

    <footer th:fragment="footer" class="container">
        <hr>
        <small>Wind Band Manager &copy; 2025 Michał Bzowski | <span id="build-version">...</span></small>
    </footer>

<script th:fragment="footer-scripts">
    // Pass teams data from server to JS for the team switcher
    var USER_TEAMS = /*[ [[${userTeams}]] ]*/ [];
    var ACTIVE_TEAM_ID = /*[ [[${#authentication.principal.activeTeamId}]] ]*/ null;

    if (USER_TEAMS && USER_TEAMS.length > 1) {
        // Multiple teams: show dropdown
        document.getElementById('nav-team-single').style.display = 'none';
        var select = document.getElementById('nav-team-select');
        select.style.display = 'inline-block';
        select.innerHTML = '';
        for (var i = 0; i < USER_TEAMS.length; i++) {
            var opt = document.createElement('option');
            opt.value = USER_TEAMS[i].id;
            opt.textContent = USER_TEAMS[i].name + ' (' + USER_TEAMS[i].role.toLowerCase() + ')';
            if (USER_TEAMS[i].id === ACTIVE_TEAM_ID) {
                opt.selected = true;
            }
            select.appendChild(opt);
        }
    }

    // Switch active team
    function switchTeam(teamId) {
        fetch('/api/auth/switch-team/' + teamId, { method: 'POST', credentials: 'same-origin' })
            .then(function(resp) { return resp.json(); })
            .then(function(data) {
                // Reload page content with new team context
                htmx.ajax('GET', '/', { target: '#content', swap: 'innerHTML' });
            })
            .catch(function(err) {
                console.error('Switch team error:', err);
            });
    }

    // Load build info
    (function() {
        console.log('Loading build info...');
        fetch('/api/auth/build-info', { credentials: 'same-origin' })
            .then(function(resp) { 
                console.log('build-info response:', resp.status);
                return resp.json(); 
            })
            .then(function(data) {
                console.log('build-info data:', data);
                var version = data.version || '?';
                var time = data.time ? data.time.replace('T', ' ').replace('Z', '') : '?';
                document.getElementById('build-version').textContent = 'v' + version + ' | ' + time;
            })
            .catch(function(err) {
                console.error('build-info error:', err);
                document.getElementById('build-version').textContent = 'v unknown';
            });
    })();

    function doLogout() {
        fetch('/api/auth/logout', {
            method: 'POST',
            credentials: 'same-origin'
        })
        .then(function(response) {
            window.location.href = '/login';
        })
        .catch(function(error) {
            console.error('Logout error:', error);
            window.location.href = '/login';
        });
    }
</script>
</body>
</html>
