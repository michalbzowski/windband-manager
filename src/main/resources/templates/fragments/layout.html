<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' — Wind Band Manager'">Wind Band Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="https://unpkg.com/htmx.org@2.0.2"></script>
    <script>
        // Add JWT token to all HTMX requests
        document.addEventListener('htmx:configRequest', function(evt) {
            const name = 'JWT=';
            const decodedCookie = decodeURIComponent(document.cookie);
            const ca = decodedCookie.split(';');
            let token = null;
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1);
                if (c.indexOf(name) === 0) {
                    token = c.substring(name.length, c.length);
                    break;
                }
            }
            if (token) {
                evt.detail.headers['Authorization'] = 'Bearer ' + token;
            }
        });
    </script>
</head>
<body>
    <nav class="container-fluid" th:fragment="nav" sec:authorize="isAuthenticated()">
        <ul>
            <li><strong><a th:href="@{/}" style="text-decoration:none;color:inherit;">🎺 Wind Band Manager</a></strong></li>
        </ul>
        <ul>
            <li><a th:href="@{/members}" hx-target="#content" hx-swap="innerHTML transition:true">Muzycy</a></li>
            <li><a th:href="@{/groups}" hx-target="#content" hx-swap="innerHTML transition:true">Grupy</a></li>
            <li><a th:href="@{/rehearsals}" hx-target="#content" hx-swap="innerHTML transition:true">Próby</a></li>
            <li><a th:href="@{/events}" hx-target="#content" hx-swap="innerHTML transition:true">Wydarzenia</a></li>
            <li><a th:href="@{/inventory}" hx-target="#content" hx-swap="innerHTML transition:true">Inwentaryzacja</a></li>
            <li><a th:href="@{/instruments}" hx-target="#content" hx-swap="innerHTML transition:true">Instrumenty</a></li>
            <li><a th:href="@{/reports}" hx-target="#content" hx-swap="innerHTML transition:true">Raporty</a></li>
            <li><a th:href="@{/band/attributes(type='MEMBER')}" hx-target="#content" hx-swap="innerHTML transition:true">Atrybuty</a></li>
        </ul>
        <ul>
            <!-- User info populated by JavaScript from /api/auth/me -->
            <li class="nav-user-info" id="nav-user-info" style="display:none;">
                <span class="team-icon">👤</span>
                <span id="nav-username"></span>
                <span class="separator">|</span>
                <span class="team-icon">🎺</span>
                <span class="team-name" id="nav-team"></span>
                <span class="team-role" id="nav-role"></span>
            </li>
            <li class="nav-user-info" id="nav-user-loading">
                <span style="color:var(--pico-muted-color); font-size:0.75rem;">Ładowanie...</span>
            </li>
            <li>
                <button class="outline secondary small" onclick="doLogout()">Wyloguj</button>
            </li>
        </ul>
    </nav>

    <main class="container" id="content">
        <!-- treść ładowana przez HTMX -->
    </main>

    <footer th:fragment="footer" class="container">
        <hr>
        <small>Wind Band Manager &copy; 2025 Michał Bzowski</small>
    </footer>

    <script>
        // Load user info on page load
        (function() {
            fetch('/api/auth/me', { credentials: 'same-origin' })
                .then(function(resp) {
                    if (!resp.ok) throw new Error('Not authenticated');
                    return resp.json();
                })
                .then(function(data) {
                    document.getElementById('nav-user-loading').style.display = 'none';
                    var info = document.getElementById('nav-user-info');
                    info.style.display = 'flex';
                    document.getElementById('nav-username').textContent = data.username || '?';
                    document.getElementById('nav-team').textContent = data.activeTeamSlug || 'brak zespołu';
                    document.getElementById('nav-role').textContent = data.activeTeamRole
                        ? '(' + data.activeTeamRole.toLowerCase() + ')' : '';
                })
                .catch(function() {
                    document.getElementById('nav-user-loading').style.display = 'none';
                });
        })();

        function doLogout() {
            fetch('/api/auth/logout', {
                method: 'POST',
                credentials: 'same-origin'
            }).then(function() {
                window.location.href = '/login';
            });
        }
    </script>
</body>
</html>
