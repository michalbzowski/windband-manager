<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' — Wind Band Manager'">Wind Band Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="https://unpkg.com/htmx.org@2.0.2"></script>
    <!-- Global utilities: Toast, fetchWithToast. Loaded on every page so that
         htmx-loaded fragments (forms) can use them. -->
    <script th:src="@{/js/windband-utils.js}"></script>
    <script>
        // Ignore errors from browser extensions - they shouldn't break our code
        window.onerror = function(msg, url, line, col, error) {
            console.log('Ignored error:', msg);
            return true;
        };
        console.log('Page loaded, script starting...');

        // Add JWT token to all HTMX requests
        document.addEventListener('htmx:configRequest', function(evt) {
            const name = 'JWT=';
            const decodedCookie = decodeURIComponent(document.cookie);
            const ca = decodedCookie.split(';');
            let token = null;
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1);
                if (c.indexOf(name) === 0) {
                    token = c.substring(name.length, c.length);
                    break;
                }
            }
            if (token) {
                evt.detail.headers['Authorization'] = 'Bearer ' + token;
            }
        });

        // Check JWT expiry on page load and redirect to login if expired
        (function() {
            try {
                const name = 'JWT=';
                const decodedCookie = decodeURIComponent(document.cookie);
                const ca = decodedCookie.split(';');
                let token = null;
                for(let i = 0; i < ca.length; i++) {
                    let c = ca[i];
                    while (c.charAt(0) === ' ') c = c.substring(1);
                    if (c.indexOf(name) === 0) {
                        token = c.substring(name.length, c.length);
                        break;
                    }
                }
                if (token) {
                    // JWT format: header.payload.signature
                    const parts = token.split('.');
                    if (parts.length === 3) {
                        // Decode payload (second part)
                        const payload = JSON.parse(atob(parts[1]));
                        const exp = payload.exp;
                        if (exp) {
                            const now = Math.floor(Date.now() / 1000);
                            if (exp < now) {
                                // Token expired, redirect to login
                                window.location.href = '/login?expired=true';
                                return;
                            }
                        }
                    }
                }
            } catch (e) {
                // If any error, just continue (token might be invalid)
            }
        })();
    </script>
</head>
<body>
<nav class="container-fluid" th:fragment="nav" sec:authorize="isAuthenticated()">
        <ul>
            <li><strong><a th:href="@{/}" style="text-decoration:none;color:inherit;">🎺 Wind Band Manager</a></strong></li>
            <li class="nav-user-info">
                <span class="separator">|</span>
                <span class="team-icon">👤</span>
                <span th:text="${#authentication.principal.wbUsername}" style="font-weight:600;">user</span>
            </li>
            <li class="nav-team-item">
                <span id="nav-team-area">
                    <select id="nav-team-select"
                            th:if="${#lists.size(userTeams) > 1}"
                            onchange="switchTeam(this.value)">
                        <option th:each="team : ${userTeams}"
                                th:value="${team.id}"
                                th:selected="${team.id == activeTeamId}"
                                th:text="${team.name}"></option>
                    </select>
                    <span id="nav-team-single" th:if="${#lists.size(userTeams) <= 1}">
                        <span class="team-name" th:text="${activeTeamSlug ?: 'brak zespołu'}">zespół</span>
                        <span class="team-role" th:if="${activeTeamRole}">(<span th:text="${#strings.toLowerCase(activeTeamRole)}">rola</span>)</span>
                    </span>
                </span>
            </li>
        </ul>
        <ul>
            <li><a th:href="@{/members}" hx-target="#content" hx-swap="innerHTML transition:true">Muzycy</a></li>
            <li><a th:href="@{/groups}" hx-target="#content" hx-swap="innerHTML transition:true">Grupy</a></li>
            <li><a th:href="@{/rehearsals}" hx-target="#content" hx-swap="innerHTML transition:true">Próby</a></li>
            <li><a th:href="@{/events}" hx-target="#content" hx-swap="innerHTML transition:true">Wydarzenia</a></li>
            <li>
                <details class="dropdown">
                    <summary role="button" class="secondary outline" style="padding:0.3rem 0.6rem; font-size:0.85rem;">Więcej ▾</summary>
                    <ul>
                        <li><a th:href="@{/inventory}" hx-target="#content" hx-swap="innerHTML transition:true">Inwentaryzacja</a></li>
                        <li><a th:href="@{/instruments}" hx-target="#content" hx-swap="innerHTML transition:true">Instrumenty</a></li>
                        <li><a th:href="@{/reports}" hx-target="#content" hx-swap="innerHTML transition:true">Raporty</a></li>
                        <li><a th:href="@{/band/inventory-attributes(type='MEMBER')}" hx-target="#content" hx-swap="innerHTML transition:true">Atrybuty</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a href="/register" hx-target="#content" hx-swap="innerHTML transition:true">➕ Nowy zespół</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/api/auth/logout}" method="POST" style="display:inline;">
                                <button type="submit" style="width:100%; text-align:left; background:none; border:none; color:var(--pico-color); padding:0.5rem 0.75rem; font-size:0.85rem; cursor:pointer;">🚪 Wyloguj</button>
                            </form>
                        </li>
                    </ul>
                </details>
            </li>
        </ul>
    </nav>

    <main class="container" id="content">
        <!-- treść ładowana przez HTMX -->
    </main>

    <!-- Toast container — must be included by every page that uses the layout -->
    <div th:fragment="toast-container" id="toast-container"></div>

    <footer th:fragment="footer" class="container">
        <hr>
        <small>Wind Band Manager &copy; 2025 Michał Bzowski | <span id="build-version">...</span></small>
    </footer>

<script th:fragment="footer-scripts">
    // Toast init + htmx:afterSwap toast integration.
    // Toast and fetchWithToast are now provided globally by /js/windband-utils.js
    // (loaded in <head>), so they're available in htmx-loaded form fragments too.

    // Initialize toast on page load
    document.addEventListener('DOMContentLoaded', function() {
        if (window.Toast) Toast.init();
    });

    // HTMX toast integration - show toasts after HTMX swaps
    document.addEventListener('htmx:afterSwap', function(evt) {
        // Check for response headers or data attributes for toast messages
        var target = evt.detail.target;
        if (target) {
            var toastData = target.querySelector('[data-toast]');
            if (toastData) {
                var message = toastData.getAttribute('data-toast');
                var type = toastData.getAttribute('data-toast-type') || 'success';
                if (window.Toast && Toast[type]) Toast[type](message);
            }
        }
    });

    // Switch active team and reload page to update nav
    function switchTeam(teamId) {
        fetchWithToast('/api/auth/switch-team/' + teamId, {
            method: 'POST',
            credentials: 'same-origin',
            toastMessage: 'Przełączono zespół'
        })
            .then(function(resp) { return resp.json(); })
            .then(function(data) {
                // Full page reload so the server-rendered nav reflects the new team
                window.location.href = '/';
            })
            .catch(function(err) {
                console.error('Switch team error:', err);
            });
    }

    // Load build info
    (function() {
        console.log('Loading build info...');
        fetchWithToast('/api/auth/build-info', { credentials: 'same-origin' })
            .then(function(resp) {
                console.log('build-info response:', resp.status);
                return resp.json();
            })
            .then(function(data) {
                console.log('build-info data:', data);
                var version = data.version || '?';
                var time = data.time ? data.time.replace('T', ' ').replace('Z', '') : '?';
                document.getElementById('build-version').textContent = 'v' + version + ' | ' + time;
            })
            .catch(function(err) {
                console.error('build-info error:', err);
                document.getElementById('build-version').textContent = 'v unknown';
            });
    })();

    function doLogout() {
        fetch('/api/auth/logout', {
            method: 'POST',
            credentials: 'same-origin'
        })
        .then(function(response) {
            window.location.href = '/login';
        })
        .catch(function(error) {
            console.error('Logout error:', error);
            window.location.href = '/login';
        });
    }
</script>
</body>
</html>
