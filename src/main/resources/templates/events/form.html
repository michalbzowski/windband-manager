<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Dodaj wydarzenie')}"></head>
<body class="dashboard-page">
<div th:replace="~{fragments/layout :: dialogs}"></div>

<main class="container" id="content">
    <section class="dashboard-upcoming">
        <header th:replace="~{fragments/layout :: dashboard-header}"></header>

    <div id="events-list-container">
        <nav th:replace="~{fragments/page-header :: page-header-c(@{/events}, 'Dodaj wydarzenie', null, null)}"></nav>

    <form id="event-form" onsubmit="return handleCreateFormSubmit(event)">

        <label>
            Nazwa wydarzenia *
            <input type="text" name="name" required placeholder="Koncert Noworoczny">
        </label>

        <div class="grid">
            <label>
                Data *
                <input type="date" name="date" th:value="${today}" required>
            </label>
            <label>
                Godzina
                <input type="time" name="startTime" value="18:00">
            </label>
        </div>

        <div class="grid">
            <label>
                Miejsce
                <input type="text" name="location" placeholder="Rynek, DK Psary...">
            </label>
            <!-- Issue #225: the type carries no value for the user yet, so the picker is
                 gone and every new event is a CONCERT. The field stays in the payload
                 because handleCreateFormSubmit() serialises FormData into the JSON body. -->
            <input type="hidden" name="eventType" value="CONCERT">
        </div>

        <label>
            Typ płatności
            <select name="paymentType" id="payment-type-select" onchange="togglePaymentAmount()">
                <option value="FREE">Granie bezpłatne</option>
                <option value="PAID_SPLIT">Płatne — podział między grających</option>
                <option value="PAID_TO_TEAM">Płatne — na konto zespołu</option>
            </select>
        </label>

        <label id="payment-amount-label" style="display:none;">
            Kwota (PLN)
            <input type="number" name="paymentAmount" id="payment-amount-input" step="0.01" min="0" placeholder="0.00">
        </label>

        <script th:inline="javascript">
        function togglePaymentAmount() {
            var select = document.getElementById('payment-type-select');
            var label = document.getElementById('payment-amount-label');
            var input = document.getElementById('payment-amount-input');
            if (select.value === 'PAID_SPLIT' || select.value === 'PAID_TO_TEAM') {
                label.style.display = '';
                input.required = true;
            } else {
                label.style.display = 'none';
                input.required = false;
                input.value = '';
            }
        }
        </script>

        <label>
            Notatki
            <textarea name="notes" rows="2" placeholder="Dodatkowe informacje..."></textarea>
        </label>

        <div style="display:flex; gap:0.5rem; margin-top:1rem;">
            <button type="submit" class="primary">Dodaj wydarzenie</button>
            <button type="submit" class="secondary" name="saveAndAddAnother" value="true">Zapisz i dodaj kolejny</button>
            <button type="button" class="secondary"
                    hx-get="/events/list" hx-target="#events-list-container"
                    hx-swap="innerHTML transition:true">Anuluj</button>
        </div>
    </form>
    <script th:inline="javascript">
        // Show/hide payment amount field based on payment type
        (function() {
        var paymentSelect = document.getElementById('payment-type-select');
        var amountLabel = document.getElementById('payment-amount-label');
        function toggleAmount() {
            var isPaid = paymentSelect.value === 'PAID_SPLIT' || paymentSelect.value === 'PAID_TEAM_ACCOUNT';
            amountLabel.style.display = isPaid ? '' : 'none';
            if (!isPaid) {
                document.getElementById('payment-amount-input').value = '';
            }
        }
        paymentSelect.addEventListener('change', toggleAmount);
        toggleAmount();
    })();

    // Guard: prevent duplicate event listeners when form is reloaded via htmx
    // Nagłówek CSRF (wzorzec z 65efec3b / PR #328): cookie XSRF-TOKEN (nie-HttpOnly)
    // jako X-XSRF-TOKEN. Bez niego CsrfFilter odrzuca POST z 403 — a ciało błędu to
    // JSON, więc .json() się "udaje" i strona cicho nawiguje do /events bez komunikatu
    // (rejestracja produkcyjna 2026-11: dodanie koncertu bezpłatnego ginęło bez śladu).
    function csrfTokenHeaders() {
        var headers = {'Content-Type': 'application/json'};
        if (typeof getCookie === 'function') {
            var token = null;
            try { token = getCookie('XSRF-TOKEN'); } catch (e) { token = null; }
            if (token) { headers['X-XSRF-TOKEN'] = decodeURIComponent(token); }
        }
        return headers;
    }

    function handleCreateFormSubmit(event) {
        event.preventDefault();
        var form = document.getElementById('event-form');
        var formData = new FormData(form);
        var data = {};
        formData.forEach(function(value, key) { data[key] = value; });
        var saveAndAddAnother = form.querySelector('button[name="saveAndAddAnother"]') &&
                                form.querySelector('button[name="saveAndAddAnother"]') === document.activeElement;

        fetch('/api/events', {
            method: 'POST',
            headers: csrfTokenHeaders(),
            body: JSON.stringify(data)
        }).then(function(response) {
            // Inaczej niż 2xx = porażka: pokaż powód (tekst lub JSON error/message).
            // POPRZEDEK: brak tej kontroli — 403 CSRF trafiało do gałęzi "sukcesu"
            // (json() zwracał obiekt błędu bez id) i strona cicho nawigowała do /events.
            if (!response.ok) {
                return response.text().then(function(bodyText) {
                    var reason = null;
                    try {
                        var parsed = JSON.parse(bodyText);
                        if (parsed && (parsed.error || parsed.message)) {
                            reason = String(parsed.error || parsed.message);
                        }
                    } catch (e) { /* ciało nie-JSON — zostaje ogólny komunikat */ }
                    Toast.error(reason ? reason + ' [' + response.status + ']'
                                      : 'Nie udało się utworzyć wydarzenia (' + response.status + ')');
                }).catch(function() {
                    Toast.error('Nie udało się utworzyć wydarzenia');
                });
            }
            return response.json();
        }).then(function(created) {
            // Gałąź błędu kończy się undefined — nie nawiguj.
            if (!created || !created.id) { return; }
            var newEventId = created.id;
            if (saveAndAddAnother) {
                htmx.ajax('GET', '/events/new', {target: '#events-list-container', swap: 'innerHTML transition:true'});
            } else {
                // Full navigation to the list with ?focus= so the shared
                // initFocusHighlight scrolls to and highlights the new row.
                window.location.href = '/events?focus=' + newEventId;
            }
        }).catch(function(err) {
            console.error('Create event error:', err);
            Toast.error('Nie udało się utworzyć wydarzenia');
        });
        return false;
    }
</script>
    </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:insert="~{fragments/layout :: toast-container}"></div>
<div th:insert="~{fragments/layout :: footer-scripts}"></div>

<div th:insert="~{fragments/layout :: dashboard-header-morph}"></div>
</body>
</html>
