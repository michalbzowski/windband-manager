<!-- Events form content fragment - goes inside #content container -->
<main class="container" id="content">
    <section class="dashboard-upcoming">
        <div id="events-list-container">
            <h2>🎪 Dodaj wydarzenie</h2>

            <form id="event-form" onsubmit="return handleCreateFormSubmit(event)">

                <label>
                    Nazwa wydarzenia *
                    <input type="text" name="name" required placeholder="Koncert Noworoczny">
                </label>

                <div class="grid">
                    <label>
                        Data *
                        <input type="date" name="date" required th:value="${today}">
                    </label>
                    <label>
                        Godzina rozpoczęcia
                        <input type="time" name="startTime">
                    </label>
                </div>

                <label>
                    Miejsce
                    <input type="text" name="location" placeholder="Sala koncertowa, Rynek, Kościół...">
                </label>

                <label>
                    Typ wydarzenia *
                    <select name="eventType" required>
                        <option value="CONCERT">Koncert</option>
                        <option value="REHEARSAL">Próba ogólna</option>
                        <option value="MEETING">Spotkanie organizacyjne</option>
                        <option value="OTHER">Inne</option>
                    </select>
                </label>

                <label>
                    Typ płatności *
                    <select name="paymentType" required id="payment-type-select">
                        <option value="FREE">Bezpłatne</option>
                        <option value="PAID_SPLIT">Płatne — podział między grających</option>
                        <option value="PAID_TO_TEAM">Płatne — na konto zespołu</option>
                    </select>
                </label>

                <div id="payment-amount-wrapper" style="display:none;">
                    <label>
                        Kwota (PLN) *
                        <input type="number" name="paymentAmount" step="0.01" min="0" placeholder="500.00">
                    </label>
                </div>

                <label>
                    Notatki
                    <textarea name="notes" rows="3" placeholder="Dodatkowe informacje..."></textarea>
                </label>

                <div style="display:flex; gap:0.5rem; margin-top:1rem;">
                    <button type="submit" class="primary">Utwórz wydarzenie</button>
                    <button type="button" class="secondary"
                            hx-get="/events/list" hx-target="#content"
                            hx-swap="outerHTML transition:true">Anuluj</button>
                </div>
            </form>
        </div>
    </section>
</main>

<script>
    // Handle payment type changes
    document.addEventListener('DOMContentLoaded', function() {
        var paymentTypeSelect = document.getElementById('payment-type-select');
        var paymentAmountWrapper = document.getElementById('payment-amount-wrapper');

        if (paymentTypeSelect && paymentAmountWrapper) {
            paymentTypeSelect.addEventListener('change', function() {
                paymentAmountWrapper.style.display = this.value === 'FREE' ? 'none' : 'block';
            });

            // Initial state
            paymentAmountWrapper.style.display = paymentTypeSelect.value === 'FREE' ? 'none' : 'block';
        }
    });

    // Form submit handler
    function handleCreateFormSubmit(event) {
        event.preventDefault();
        var form = event.target;
        var formData = new FormData(form);
        var data = {};
        formData.forEach(function(value, key) {
            data[key] = value;
        });

        // Convert paymentAmount to number if present
        if (data.paymentAmount !== '') {
            data.paymentAmount = parseFloat(data.paymentAmount);
        } else {
            delete data.paymentAmount;
        }

        fetchWithToast('/api/events', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
            toastMessage: 'Wydarzenie utworzone'
        }).then(function(resp) {
            if (resp.ok) {
                resp.json().then(function(event) {
                    // Navigate to event detail
                    window.location.href = '/events/' + event.id;
                });
            }
        });
        return false;
    }
</script>
