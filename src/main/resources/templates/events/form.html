<div id="events-content">
    <h2>🎪 Dodaj wydarzenie</h2>

    <form id="event-form"
          hx-target="#events-content"
          hx-swap="innerHTML transition:true">

        <label>
            Nazwa wydarzenia *
            <input type="text" name="name" required placeholder="Koncert Noworoczny">
        </label>

        <div class="grid">
            <label>
                Data *
                <input type="date" name="date" th:value="${today}" required>
            </label>
            <label>
                Godzina
                <input type="time" name="startTime" value="18:00">
            </label>
        </div>

        <div class="grid">
            <label>
                Miejsce
                <input type="text" name="location" placeholder="Rynek, DK Psary...">
            </label>
            <label>
                Typ wydarzenia
                <select name="eventType" required>
                    <option value="CONCERT">Koncert</option>
                    <option value="CEREMONY">Uroczystość</option>
                    <option value="PARADE">Parada</option>
                    <option value="COMPETITION">Konkurs</option>
                    <option value="FESTIVAL">Festiwal</option>
                    <option value="OTHER">Inne</option>
                </select>
            </label>
        </div>

        <label>
            Opłata za wydarzenie
            <select name="paymentType" id="payment-type-select" required>
                <option value="FREE">Granie bezpłatne</option>
                <option value="PAID_SPLIT">Granie płatne – pieniądze do podziału między grających</option>
                <option value="PAID_TEAM_ACCOUNT">Granie płatne – pieniądze na konto zespołu</option>
            </select>
        </label>

        <label id="payment-amount-label" style="display:none;">
            Kwota (PLN)
            <input type="number" name="paymentAmount" id="payment-amount-input"
                   step="0.01" min="0" placeholder="0.00">
        </label>

        <label>
            Notatki
            <textarea name="notes" rows="2" placeholder="Dodatkowe informacje..."></textarea>
        </label>

        <div style="display:flex; gap:0.5rem; margin-top:1rem;">
            <button type="submit" class="primary">Dodaj wydarzenie</button>
            <button type="button" class="secondary"
                    hx-get="/events/list" hx-target="#events-content"
                    hx-swap="innerHTML transition:true">Anuluj</button>
        </div>
    </form>
</div>

<script th:inline="javascript">
    // Show/hide payment amount field based on payment type
    (function() {
        var paymentSelect = document.getElementById('payment-type-select');
        var amountLabel = document.getElementById('payment-amount-label');
        function toggleAmount() {
            var isPaid = paymentSelect.value === 'PAID_SPLIT' || paymentSelect.value === 'PAID_TEAM_ACCOUNT';
            amountLabel.style.display = isPaid ? '' : 'none';
            if (!isPaid) {
                document.getElementById('payment-amount-input').value = '';
            }
        }
        paymentSelect.addEventListener('change', toggleAmount);
        toggleAmount();
    })();

    // Guard: prevent duplicate event listeners when form is reloaded via htmx
    if (!window._eventFormHandlerAttached) {
        window._eventFormHandlerAttached = true;
        document.body.addEventListener('submit', function(e) {
            if (e.target.id === 'event-form') {
                e.preventDefault();
                var form = e.target;
                var formData = new FormData(form);
                var data = {};
                formData.forEach(function(value, key) { data[key] = value; });

                fetch('/api/events', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                }).then(function() {
                    htmx.ajax('GET', '/events/list', {target: '#events-content', swap: 'innerHTML transition:true'});
                });
            }
        });
    }
</script>
