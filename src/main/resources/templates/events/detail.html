<div id="events-content">
    <h2>🎪 Szczegóły wydarzenia</h2>

    <article>
        <header>
            <strong th:text="${event.name}">Koncert</strong>
            <span th:text="${event.date}">01.01.2025</span>
        </header>
        <p th:if="${event.location}" th:text="'Miejsce: ' + ${event.location}">Miejsce: Rynek</p>
        <p th:if="${event.startTime}" th:text="'Godzina: ' + ${event.startTime}">Godzina: 18:00</p>
        <p th:text="'Typ: ' + ${event.eventType}">Typ: CONCERT</p>
        <p th:text="${event.paymentType == 'FREE' ? '💰 Granie bezpłatne' : (event.paymentType == 'PAID_SPLIT' ? '💰 Płatne — podział między grających' : '💰 Płatne — na konto zespołu')}">
            💰 Granie bezpłatne
        </p>
        <p th:if="${event.paymentAmount != null and event.paymentType != 'FREE'}"
           th:text="'Kwota: ' + ${#numbers.formatDecimal(event.paymentAmount, 1, 2)} + ' PLN'">
            Kwota: 500.00 PLN
        </p>
        <p th:if="${event.payoutPerMember != null and event.paymentType == 'PAID_SPLIT'}"
           th:text="'Wypłata/osoba: ' + ${#numbers.formatDecimal(event.payoutPerMember, 1, 2)} + ' PLN'">
            Wypłata/osoba: 100.00 PLN
        </p>
        <p th:if="${event.notes}" th:text="${event.notes}">Notatki</p>
    </article>

    <h3>Zaproś na wydarzenie</h3>

    <div style="display:flex; gap:0.5rem; margin-bottom:0.5rem; align-items:flex-end;">
        <div>
            <label for="invite-group-select">Zaproś grupę</label>
            <select id="invite-group-select">
                <option value="">Wybierz grupę...</option>
                <option th:each="g : ${event.allGroups}" th:value="${g.id}"
                        th:text="${g.name} + ' (' + ${g.memberCount} + ' muzyków)'">
                    Sekcja dęta (5 muzyków)
                </option>
            </select>
        </div>
        <button class="outline" id="invite-group-btn">Zaproś grupę</button>
    </div>

    <div style="display:flex; gap:0.5rem; margin-bottom:1rem; align-items:flex-end;">
        <div>
            <label for="invite-member-select">Zaproś pojedynczego muzyka</label>
            <select id="invite-member-select">
                <option value="">Wybierz muzyka...</option>
                <option th:each="m : ${members}" th:value="${m.id}"
                        th:text="${m.firstName} + ' ' + ${m.lastName}">Jan Kowalski</option>
            </select>
        </div>
        <button class="outline" id="invite-btn">Zaproś</button>
    </div>

    <h3>Uczestnicy</h3>
    <table role="grid" id="participants-table">
        <thead>
            <tr>
                <th>Muzyk</th>
                <th>Instrument</th>
                <th>Odpowiedź</th>
                <th th:if="${event.paymentType == 'PAID_SPLIT'}">Wypłata</th>
                <th th:if="${event.paymentType == 'PAID_SPLIT'}">Status wypłaty</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${event.participations}" th:data-response="${p.response}">
                <td th:text="${p.memberName}">Jan Kowalski</td>
                <td>
                    <select class="instrument-select"
                            th:data-event-id="${event.id}"
                            th:data-member-id="${p.memberId}">
                        <option value="">Wybierz instrument...</option>
                        <option th:each="inst : ${instruments}" th:value="${inst.id}"
                                th:selected="${inst.name == p.instrumentName}"
                                th:text="${inst.name}">Trąbka</option>
                    </select>
                </td>
                <td>
                    <select class="response-select"
                            th:data-event-id="${event.id}"
                            th:data-member-id="${p.memberId}">
                        <option value="CONFIRMED" th:selected="${p.response == 'CONFIRMED'}">✅ Będę</option>
                        <option value="DECLINED" th:selected="${p.response == 'DECLINED'}">❌ Nie będę</option>
                        <option value="LATER" th:selected="${p.response == 'LATER'}">⏳ Dam znać później</option>
                        <option value="NO_RESPONSE" th:selected="${p.response == 'NO_RESPONSE'}">❓ Brak odpowiedzi</option>
                    </select>
                </td>
                <td th:if="${event.paymentType == 'PAID_SPLIT'}"
                    class="payout-amount"
                    th:text="${event.payoutPerMember != null ? #numbers.formatDecimal(event.payoutPerMember, 1, 2) : '-'}">
                    100.00
                </td>
                <td th:if="${event.paymentType == 'PAID_SPLIT'}">
                    <select class="payment-status-select"
                            th:if="${p.response == 'CONFIRMED'}"
                            th:data-event-id="${event.id}"
                            th:data-member-id="${p.memberId}">
                        <option value="PAID" th:selected="${p.paymentStatus == 'PAID'}">✅ Zapłacono</option>
                        <option value="PENDING" th:selected="${p.paymentStatus == 'PENDING'}">⏳ Nie zapłacono</option>
                    </select>
                    <span th:if="${p.response != 'CONFIRMED'}" class="text-muted">nie dotyczy</span>
                </td>
            </tr>
        </tbody>
    </table>

    <div style="margin-top:1rem; display:flex; gap:0.5rem;">
        <button type="button" class="secondary"
                hx-get="/events/list" hx-target="#events-content"
                hx-swap="innerHTML transition:true">Powrót</button>
        <button type="button" class="outline"
                th:attr="hx-get='/events/' + ${event.id} + '/edit'"
                hx-target="#events-content"
                hx-swap="innerHTML transition:true">✏️ Edytuj</button>
        <button type="button" class="outline danger" id="delete-event-btn">🗑️ Usuń wydarzenie</button>
    </div>
</div>

<script th:inline="javascript">
    var invitedMemberIds = new Set(
        [[${event.participations}]].map(function(p) { return p.memberId; })
    );

    // Invite single member
    document.getElementById('invite-btn').addEventListener('click', function() {
        var select = document.getElementById('invite-member-select');
        var memberId = parseInt(select.value);
        var eventId = [[${event.id}]];
        if (memberId) {
            fetch('/api/events/' + eventId + '/invite', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({eventId: eventId, memberId: memberId})
            }).then(function() {
                htmx.ajax('GET', '/events/' + eventId, {target: '#events-content', swap: 'innerHTML transition:true'});
            });
        }
    });

    // Invite entire group
    document.getElementById('invite-group-btn').addEventListener('click', function() {
        var select = document.getElementById('invite-group-select');
        var groupId = select.value;
        var eventId = [[${event.id}]];
        if (groupId) {
            fetch('/api/events/' + eventId + '/invite-group', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({eventId: eventId, groupId: parseInt(groupId)})
            }).then(function() {
                htmx.ajax('GET', '/events/' + eventId, {target: '#events-content', swap: 'innerHTML transition:true'});
            });
        }
    });

    // Record response
    document.querySelectorAll('.response-select').forEach(function(select) {
        select.addEventListener('change', function() {
            var eventId = this.dataset.eventId;
            var memberId = this.dataset.memberId;
            var response = this.value;
            var row = this.closest('tr');
            var payoutCell = row.querySelector('.payout-amount');
            var paymentStatusCell = row.querySelector('.payment-status-select')?.closest('td');
            
            fetch('/api/events/' + eventId + '/response', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({eventId: parseInt(eventId), memberId: parseInt(memberId), response: response})
            }).then(function(res) {
                if (!res.ok) {
                    console.error('Failed to update response');
                    return;
                }
                // Reload event details to update payment columns dynamically
                htmx.ajax('GET', '/events/' + eventId, {target: '#events-content', swap: 'innerHTML transition:true'});
            });
        });
    });

    // Change instrument
    document.querySelectorAll('.instrument-select').forEach(function(select) {
        select.addEventListener('change', function() {
            var memberId = this.dataset.memberId;
            var instrumentId = this.value;
            if (instrumentId) {
                fetch('/api/members/' + memberId + '/instrument', {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({memberId: parseInt(memberId), instrumentId: parseInt(instrumentId)})
                }).then(function(res) {
                    if (!res.ok) console.error('Failed to update instrument');
                });
            }
        });
    });

    // Payment status change
    document.querySelectorAll('.payment-status-select').forEach(function(select) {
        select.addEventListener('change', function() {
            var eventId = this.dataset.eventId;
            var memberId = this.dataset.memberId;
            var status = this.value;
            fetch('/api/events/' + eventId + '/payment-status', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({eventId: parseInt(eventId), memberId: parseInt(memberId), status: status})
            }).then(function(res) {
                if (!res.ok) console.error('Failed to update payment status');
            });
        });
    });

    // Delete event
    document.getElementById('delete-event-btn').addEventListener('click', function() {
        var eventId = [[${event.id}]];
        if (confirm('Czy na pewno chcesz usunąć to wydarzenie?')) {
            fetch('/api/events/' + eventId, {
                method: 'DELETE'
            }).then(function(res) {
                if (res.ok) {
                    htmx.ajax('GET', '/events/list', {target: '#events-content', swap: 'innerHTML transition:true'});
                } else {
                    alert('Nie udało się usunąć wydarzenia');
                }
            });
        }
    });
</script>
