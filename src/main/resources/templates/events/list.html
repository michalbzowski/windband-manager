<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Wydarzenia')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

    <main class="container" id="content">
        <div id="events-list-container" th:attr="data-focus-id=${focusEventId},data-focus-prefix='event'">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <h2>🎪 Wydarzenia</h2>
                <button hx-get="/events/new" hx-target="#events-list-container"
                        hx-swap="innerHTML transition:true" class="primary">+ Dodaj wydarzenie</button>
            </div>

            <div th:if="${#lists.isEmpty(upcomingEvents) and #lists.isEmpty(pastEvents)}">
                <article>
                    <p>Brak wydarzeń w systemie.</p>
                </article>
            </div>

            <!-- ===================== UPCOMING ===================== -->
            <div th:if="${not #lists.isEmpty(upcomingEvents)}">
                <h3 class="section-heading" th:unless="${#lists.isEmpty(pastEvents)}">Nadchodzące</h3>
                <table role="grid">
                    <thead>
                        <tr>
                            <th>Nazwa</th>
                            <th>Data</th>
                            <th>Miejsce</th>
                            <th>Typ</th>
                            <th>Potwierdzenia</th>
                            <th>Akcje</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="e : ${upcomingEvents}" th:id="'event-' + ${e.id}">
                            <td data-label="Nazwa" th:text="${e.name}">Koncert</td>
                            <td data-label="Data" th:text="${e.date}">01.01.2025</td>
                            <td data-label="Miejsce" th:text="${e.location}">Rynek</td>
                            <td data-label="Typ" th:text="${e.eventType}">CONCERT</td>
                            <td data-label="Potwierdzenia">
                                <span th:text="${e.confirmedCount} + ' ✅ / ' + ${e.declinedCount} + ' ❌ / ' + ${e.noResponseCount} + ' ?'">5 ✅ / 2 ❌ / 8 ?</span>
                            </td>
                            <td data-label="Akcje">
                                <button class="outline small"
                                        th:hx-get="@{/events/{id}(id=${e.id})}"
                                        hx-target="#events-list-container"
                                        hx-swap="innerHTML transition:true">Szczegóły</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- ===================== PAST ===================== -->
            <div th:if="${not #lists.isEmpty(pastEvents)}">
                <h3 class="section-heading">📅 Przeszłe wydarzenia</h3>
                <table role="grid">
                    <thead>
                        <tr>
                            <th>Nazwa</th>
                            <th>Data</th>
                            <th>Miejsce</th>
                            <th>Typ</th>
                            <th>Potwierdzenia</th>
                            <th>Akcje</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="e : ${pastEvents}" class="past-item" th:id="'event-' + ${e.id}">
                            <td data-label="Nazwa" th:text="${e.name}">Koncert</td>
                            <td data-label="Data">
                                <span th:text="${e.date}">01.01.2025</span>
                                <span class="past-badge">Odbyło się</span>
                            </td>
                            <td data-label="Miejsce" th:text="${e.location}">Rynek</td>
                            <td data-label="Typ" th:text="${e.eventType}">CONCERT</td>
                            <td data-label="Potwierdzenia">
                                <span th:text="${e.confirmedCount} + ' ✅ / ' + ${e.declinedCount} + ' ❌ / ' + ${e.noResponseCount} + ' ?'">5 ✅ / 2 ❌ / 8 ?</span>
                            </td>
                            <td data-label="Akcje">
                                <button class="outline small"
                                        th:hx-get="@{/events/{id}(id=${e.id})}"
                                        hx-target="#events-list-container"
                                        hx-swap="innerHTML transition:true">Szczegóły</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:insert="~{fragments/layout :: toast-container}"></div>
<div th:insert="~{fragments/layout :: footer-scripts}"></div>
</body>
</html>
