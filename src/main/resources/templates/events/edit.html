<!-- Events edit content fragment - goes inside #content container -->
<main class="container" id="content">
    <section class="dashboard-upcoming">
        <div id="events-list-container">
            <h2>✏️ Edytuj wydarzenie</h2>

            <form id="event-edit-form" th:attr="data-event-id=${event.id}" onsubmit="return handleEditFormSubmit(event)">

                <label>
                    Nazwa wydarzenia *
                    <input type="text" name="name" required th:value="${event.name}">
                </label>

                <div class="grid">
                    <label>
                        Data *
                        <input type="date" name="date" required th:value="${event.date}">
                    </label>
                    <label>
                        Godzina rozpoczęcia
                        <input type="time" name="startTime" th:value="${event.startTime}">
                    </label>
                </div>

                <label>
                    Miejsce
                    <input type="text" name="location" placeholder="Sala koncertowa, Rynek, Kościół..." th:value="${event.location}">
                </label>

                <label>
                    Typ wydarzenia *
                    <select name="eventType" required>
                        <option value="CONCERT" th:selected="${event.eventType == 'CONCERT'}">Koncert</option>
                        <option value="REHEARSAL" th:selected="${event.eventType == 'REHEARSAL'}">Próba ogólna</option>
                        <option value="MEETING" th:selected="${event.eventType == 'MEETING'}">Spotkanie organizacyjne</option>
                        <option value="OTHER" th:selected="${event.eventType == 'OTHER'}">Inne</option>
                    </select>
                </label>

                <label>
                    Typ płatności *
                    <select name="paymentType" required id="payment-type-select">
                        <option value="FREE" th:selected="${event.paymentType == 'FREE'}">Bezpłatne</option>
                        <option value="PAID_SPLIT" th:selected="${event.paymentType == 'PAID_SPLIT'}">Płatne — podział między grających</option>
                        <option value="PAID_TO_TEAM" th:selected="${event.paymentType == 'PAID_TO_TEAM'}">Płatne — na konto zespołu</option>
                    </select>
                </label>

                <div id="payment-amount-wrapper" style="display:none;">
                    <label>
                        Kwota (PLN) *
                        <input type="number" name="paymentAmount" step="0.01" min="0" placeholder="500.00" th:value="${event.paymentAmount}">
                    </label>
                </div>

                <label>
                    Notatki
                    <textarea name="notes" rows="3" placeholder="Dodatkowe informacje..." th:text="${event.notes}"></textarea>
                </label>

                <div style="display:flex; gap:0.5rem; margin-top:1rem;">
                    <button type="submit" class="primary">Zapisz zmiany</button>
                    <button type="button" class="secondary"
                            th:hx-get="@{/events/{id}(id=${event.id})}"
                            hx-target="#content"
                            hx-swap="outerHTML transition:true">Anuluj</button>
                </div>
            </form>
        </div>
    </section>
</main>

<script>
    // Handle payment type changes
    document.addEventListener('DOMContentLoaded', function() {
        var paymentTypeSelect = document.getElementById('payment-type-select');
        var paymentAmountWrapper = document.getElementById('payment-amount-wrapper');

        if (paymentTypeSelect && paymentAmountWrapper) {
            paymentTypeSelect.addEventListener('change', function() {
                paymentAmountWrapper.style.display = this.value === 'FREE' ? 'none' : 'block';
            });

            // Initial state
            paymentAmountWrapper.style.display = paymentTypeSelect.value === 'FREE' ? 'none' : 'block';
        }
    });

    // Form submit handler
    function handleEditFormSubmit(event) {
        event.preventDefault();
        var form = event.target;
        var eventId = form.getAttribute('data-event-id');
        var formData = new FormData(form);
        var data = {};
        formData.forEach(function(value, key) {
            data[key] = value;
        });

        // Convert paymentAmount to number if present
        if (data.paymentAmount !== '') {
            data.paymentAmount = parseFloat(data.paymentAmount);
        } else {
            delete data.paymentAmount;
        }

        fetchWithToast('/api/events/' + eventId, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
            toastMessage: 'Wydarzenie zaktualizowane'
        }).then(function(resp) {
            if (resp.ok) {
                // Reload detail view
                htmx.ajax('GET', '/events/' + eventId, {target: '#content', swap: 'outerHTML transition:true'});
            }
        });
        return false;
    }
</script>
