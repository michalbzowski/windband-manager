<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Edytuj wydarzenie')}"></head>
<body class="dashboard-page">
<div th:replace="~{fragments/layout :: dialogs}"></div>

<main class="container" id="content">
    <section class="dashboard-upcoming">
        <header th:replace="~{fragments/layout :: dashboard-header}"></header>

    <div id="events-list-container">
        <nav th:replace="~{fragments/page-header :: page-header-c(${editBackUrl}, 'Edytuj wydarzenie', null, null)}"></nav>

    <form id="event-edit-form" onsubmit="return handleEditFormSubmit(event)">

         <input type="hidden" name="id" th:value="${event.id}">

        <label>
            Nazwa wydarzenia *
            <input type="text" name="name" th:value="${event.name}" required>
        </label>

        <div class="grid">
            <label>
                Data *
                <input type="date" name="date" th:value="${event.date}" required>
            </label>
            <label>
                Godzina
                <input type="time" name="startTime" th:value="${event.startTime}">
            </label>
        </div>

        <div class="grid">
            <label>
                Miejsce
                <input type="text" name="location" th:value="${event.location}">
            </label>
            <label>
                Typ wydarzenia
                <select name="eventType" required>
                    <option value="CONCERT" th:selected="${event.eventType == 'CONCERT'}">Koncert</option>
                    <option value="CEREMONY" th:selected="${event.eventType == 'CEREMONY'}">Uroczystość</option>
                    <option value="PARADE" th:selected="${event.eventType == 'PARADE'}">Parada</option>
                    <option value="COMPETITION" th:selected="${event.eventType == 'COMPETITION'}">Konkurs</option>
                    <option value="FESTIVAL" th:selected="${event.eventType == 'FESTIVAL'}">Festiwal</option>
                    <option value="OTHER" th:selected="${event.eventType == 'OTHER'}">Inne</option>
                </select>
            </label>
        </div>

        <label>
            Typ płatności
            <select name="paymentType" id="payment-type-select" onchange="togglePaymentAmount()">
                <option value="FREE" th:selected="${event.paymentType == 'FREE'}">Granie bezpłatne</option>
                <option value="PAID_SPLIT" th:selected="${event.paymentType == 'PAID_SPLIT'}">Płatne — podział między grających</option>
                <option value="PAID_TO_TEAM" th:selected="${event.paymentType == 'PAID_TO_TEAM'}">Płatne — na konto zespołu</option>
            </select>
        </label>

        <label id="payment-amount-label" th:style="${event.paymentType != 'FREE'} ? 'display:block' : 'display:none'">
            Kwota (PLN)
            <input type="number" name="paymentAmount" id="payment-amount-input" step="0.01" min="0"
                   th:value="${event.paymentAmount}">
        </label>

        <script th:inline="javascript">
        function togglePaymentAmount() {
            var select = document.getElementById('payment-type-select');
            var label = document.getElementById('payment-amount-label');
            var input = document.getElementById('payment-amount-input');
            if (select.value === 'PAID_SPLIT' || select.value === 'PAID_TO_TEAM') {
                label.style.display = '';
                input.required = true;
            } else {
                label.style.display = 'none';
                input.required = false;
                input.value = '';
            }
        }
        </script>

        <label>
            Notatki
            <textarea name="notes" rows="2" th:text="${event.notes}"></textarea>
        </label>

        <div style="display:flex; gap:0.5rem; margin-top:1rem;">
            <button type="submit" class="primary">Zapisz zmiany</button>
        <button type="button" class="secondary"
                th:attr="hx-get='/events/' + ${event.id}"
                hx-target="#events-list-container"
                hx-swap="innerHTML transition:true">Anuluj</button>
        </div>
    </form>
    <script th:inline="javascript">
    function handleEditFormSubmit(event) {
        console.log('[EDIT FORM] onsubmit fired');
        event.preventDefault();
        var form = document.getElementById('event-edit-form');
        var formData = new FormData(form);
        var data = {};
        formData.forEach(function(value, key) { data[key] = value; });
        console.log('[EDIT FORM] Form data:', JSON.stringify(data));

        data.id = parseInt(data.id);
        if (data.paymentAmount) {
            data.paymentAmount = parseFloat(data.paymentAmount);
        } else {
            data.paymentAmount = null;
        }
        console.log('[EDIT FORM] Sending PUT:', JSON.stringify(data));

        fetch('/api/events/' + data.id, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        }).then(function(res) {
            console.log('[EDIT FORM] PUT status:', res.status);
            if (res.ok) {
                htmx.ajax('GET', '/events/' + data.id, {target: '#events-list-container', swap: 'innerHTML transition:true'});
            } else {
                return res.text().then(function(t) {
                    console.error('[EDIT FORM] PUT error body:', t);
                    alert('Nie udało się zapisać zmian: ' + res.status);
                });
            }
        }).catch(function(err) {
            console.error('[EDIT FORM] Fetch error:', err);
            alert('Błąd sieci: ' + err.message);
        });
        return false;
    }
    </script>
    </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:insert="~{fragments/layout :: toast-container}"></div>
<div th:insert="~{fragments/layout :: footer-scripts}"></div>

<div th:insert="~{fragments/layout :: dashboard-header-morph}"></div>
</body>
</html>
