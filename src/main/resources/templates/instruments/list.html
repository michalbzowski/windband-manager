<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Instrumenty')}"></head>
<body class="dashboard-page">
<div th:replace="~{fragments/layout :: dialogs}"></div>

<main class="container" id="content">
    <section class="dashboard-upcoming">
        <header th:replace="~{fragments/layout :: dashboard-header}"></header>

    <div id="instruments-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
            <h2>🎼 Instrumenty</h2>
            <button hx-get="/instruments/new" hx-target="#instruments-content" hx-swap="innerHTML transition:true"
                    class="primary">+ Dodaj instrument</button>
        </div>

            <div th:if="${#lists.isEmpty(instruments)}">
                <article>
                    <p>Brak instrumentów w systemu. Dodaj pierwszy!</p>
                </article>
            </div>

            <div th:unless="${#lists.isEmpty(instruments)}">
                <table role="grid">
                    <thead>
                        <tr>
                            <th>Kolejność</th>
                            <th>Nazwa</th>
                            <th>Opis</th>
                            <th>Akcje</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="inst : ${instruments}">
                            <td th:text="${inst.getSortPriority()}">0</td>
                            <td th:text="${inst.getName()}">Trąbka</td>
                            <td th:text="${inst.getDescription()}">Instrument dęty blaszany</td>
                            <td>
                                <button class="outline small"
                                        th:hx-get="@{/instruments/{id}/edit(id=${inst.getId()})}"
                                        hx-target="#instruments-content" hx-swap="innerHTML transition:true">Edytuj</button>
                                <button class="outline small secondary"
                                        th:hx-delete="@{/api/instruments/{id}(id=${inst.getId()})}"
                                        hx-confirm="Czy na pewno chcesz usunąć ten instrument?"
                                        hx-on::after-request="htmx.ajax('GET', '/instruments/list', {target: '#instruments-content', swap: 'innerHTML transition:true'})">Usuń</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:insert="~{fragments/layout :: toast-container}"></div>
<div th:insert="~{fragments/layout :: footer-scripts}"></div>

<div th:insert="~{fragments/layout :: dashboard-header-morph}"></div>
</body>
</html>
