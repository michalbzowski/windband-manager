<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<style>
    .dashboard-fullscreen {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 120px);
        min-height: 400px;
        position: relative;
    }
    .dashboard-fullscreen #dashboard-embed-container {
        flex: 1;
        min-height: 0;
        position: relative;
    }
    .dashboard-fullscreen #superset-embedded {
        width: 100%;
        height: 100% !important;
        position: absolute;
        top: 0;
        left: 0;
    }
    .dashboard-fullscreen iframe {
        width: 100% !important;
        height: 100% !important;
        border: none !important;
        display: block;
        position: absolute;
        top: 0;
        left: 0;
    }
</style>

<main class="container" id="content" style="max-width: 100%; padding: 0 1rem;">
    <div id="dashboard-view-content">
        <div th:if="${error}">
            <h2>📊 Dashboard</h2>
            <div class="toast-error" th:text="${error}">Błąd</div>
            <a th:href="@{/dashboards}" role="button" class="secondary">← Powrót do listy</a>
        </div>

        <div th:unless="${error}" class="dashboard-fullscreen">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                <h2 style="margin: 0;">
                    <i th:class="'fa ' + ${dashboard.icon}" style="margin-right:0.5rem;"></i>
                    <span th:text="${dashboard.title}">Dashboard</span>
                </h2>
                <a th:href="@{/dashboards}" role="button" class="secondary" style="padding: 0.25rem 0.75rem; font-size: 0.85rem;">← Powrót</a>
            </div>

            <!-- Loading state -->
            <div id="dashboard-loading" class="toast-info">
                ⏳ Ładowanie dashboardu...
            </div>

            <!-- Error state (hidden by default) -->
            <div id="dashboard-error" class="toast-error" style="display: none;">
                Nie udało się załadować dashboardu. Spróbuj ponownie później.
            </div>

            <!-- Superset embedded dashboard container -->
            <div id="dashboard-embed-container" style="display: none; border: 1px solid var(--pico-muted-border-color); border-radius: 8px; overflow: hidden;">
                <div id="superset-embedded" style="width: 100%; height: 100%;"></div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:insert="~{fragments/layout :: toast-container}"></div>
<div th:insert="~{fragments/layout :: footer-scripts}"></div>

<!-- Superset Embedded SDK (local copy to avoid CDN blocking) -->
<script src="/js/superset-embedded-sdk.js"></script>

<script th:inline="javascript">
    (function() {
        var dashboardId = /*[[${dashboard.id}]]*/ 0;
        var dashboardUuid = /*[[${dashboard.embeddedUuid}]]*/ '';
        var supersetUrl = /*[[${supersetUrl}]]*/ 'https://superset.michalbzowski.pl';
        var loadingEl = document.getElementById('dashboard-loading');
        var errorEl = document.getElementById('dashboard-error');
        var containerEl = document.getElementById('dashboard-embed-container');

        function initDashboard() {
            if (!window.supersetEmbeddedSdk) {
                console.error('Superset Embedded SDK not available');
                return;
            }

            if (!dashboardUuid) {
                console.error('Dashboard has no embedded UUID — sync with Superset first');
                loadingEl.style.display = 'none';
                errorEl.style.display = 'block';
                errorEl.textContent = 'Dashboard nie jest jeszcze gotowy. Zsynchronizuj go z Superset.';
                return;
            }

            var mountPoint = document.getElementById('superset-embedded');
            if (!mountPoint) {
                console.error('Mount point #superset-embedded not found');
                loadingEl.style.display = 'none';
                errorEl.style.display = 'block';
                errorEl.textContent = 'Błąd inicjalizacji dashboardu. Odśwież stronę.';
                return;
            }

            // Fetch guest token from our backend
            fetch('/api/dashboards/' + dashboardId + '/guest-token')
                .then(function(response) {
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.json();
                })
                .then(function(data) {
                    if (!data.token) throw new Error('No token in response');

                    window.supersetEmbeddedSdk.embedDashboard({
                        id: dashboardUuid,
                        supersetDomain: supersetUrl,
                        mountPoint: mountPoint,
                        fetchGuestToken: function() {
                            return Promise.resolve(data.token);
                        },
                        dashboardUiConfig: {
                            hideTitle: true,
                            hideTab: true,
                            hideChartControls: false,
                            filters: { expanded: false }
                        }
                    });
                    loadingEl.style.display = 'none';
                    containerEl.style.display = 'block';
                })
                .catch(function(err) {
                    console.error('Dashboard load error:', err);
                    loadingEl.style.display = 'none';
                    errorEl.style.display = 'block';
                });
        }

        // Try immediately
        if (window.supersetEmbeddedSdk) {
            initDashboard();
        } else {
            // Wait for SDK to load
            var checkInterval = setInterval(function() {
                if (window.supersetEmbeddedSdk) {
                    clearInterval(checkInterval);
                    initDashboard();
                }
            }, 100);
            // Timeout after 10s
            setTimeout(function() {
                clearInterval(checkInterval);
                if (!window.supersetEmbeddedSdk) {
                    loadingEl.style.display = 'none';
                    errorEl.style.display = 'block';
                    errorEl.textContent = 'Nie udało się załadować SDK Superset. Sprawdź połączenie z internetem.';
                }
            }, 10000);
        }
    })();
</script>
</body>
</html>
