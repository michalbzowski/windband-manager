<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Błąd — Zaproszenie</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        main {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>
    <main>
        <article>
            <header>
                <h2>❌ Błąd</h2>
            </header>
            <p th:text="${error}">Nieprawidłowy link.</p>
            <p>Link zaproszenia jest nieprawidłowy lub wygasł. Skontaktuj się z osobą zarządzającą zespołem, aby otrzymać nowe zaproszenie.</p>
        </article>
    </main>
</body>
</html>
