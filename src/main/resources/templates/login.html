<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Logowanie')}"></head>
<body>
    <main class="container" style="max-width: 400px; margin-top: 4rem;">
        <hgroup>
            <h1>🎺 Wind Band Manager</h1>
            <h2>Zaloguj się</h2>
        </hgroup>

        <div id="login-error" style="display:none; background:#ffe0e0; border:1px solid #ff8080; border-radius:8px; padding:1rem; margin-bottom:1rem;" role="alert">
            <p style="margin:0;">Nieprawidłowa nazwa użytkownika lub hasło.</p>
        </div>

        <div th:if="${param.error}" style="background:#ffe0e0; border:1px solid #ff8080; border-radius:8px; padding:1rem; margin-bottom:1rem;" role="alert">
            <p style="margin:0;">Nieprawidłowa nazwa użytkownika lub hasło.</p>
        </div>

        <div th:if="${param.logout}" style="background:#d4edda; border:1px solid #c3e6cb; border-radius:8px; padding:1rem; margin-bottom:1rem;" role="alert">
            <p style="margin:0;">Zostałeś wylogowany.</p>
        </div>

        <form method="post" action="/login">
            <label for="username">Nazwa użytkownika</label>
            <input type="text" id="username" name="username" required autofocus>

            <label for="password">Hasło</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Zaloguj</button>
        </form>

        <p style="margin-top:1rem; color:var(--pico-muted-color);">
            Nie masz konta? <a href="/register">Zarejestruj zespół</a>
        </p>
    </main>
<div th:insert="~{fragments/layout :: toast-container}"></div>
</body>
</html>
