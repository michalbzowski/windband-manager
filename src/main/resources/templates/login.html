<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Logowanie')}"></head>
<body>
    <main class="container" style="max-width: 400px; margin-top: 4rem;">
        <hgroup>
            <h1>🎺 Wind Band Manager</h1>
            <h2>Zaloguj się</h2>
        </hgroup>

        <div id="login-error" class="error-message" style="display:none;" role="alert">
            <p>Nieprawidłowa nazwa użytkownika lub hasło.</p>
        </div>

        <form id="login-form" hx-ext="json-enc" hx-post="/api/auth/login"
              hx-on::after-request="handleLogin(event)">
            <label for="username">Nazwa użytkownika</label>
            <input type="text" id="username" name="username" required autofocus>

            <label for="password">Hasło</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Zaloguj</button>
        </form>
    </main>

    <script src="https://unpkg.com/htmx.org@2.0.2"></script>
    <script src="https://unpkg.com/htmx-ext-json-enc@2.0.0/json-enc.js"></script>
    <script>
        function handleLogin(event) {
            if (event.detail.successful) {
                window.location.href = '/';
            } else {
                const err = document.getElementById('login-error');
                if (err) err.style.display = 'block';
            }
        }
    </script>
</body>
</html>
