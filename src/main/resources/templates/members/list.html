<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Członkowie')}"></head>
<body class="dashboard-page">
<div th:replace="~{fragments/layout :: dialogs}"></div>

<main class="container" id="content">
    <section class="dashboard-upcoming">
        <header th:replace="~{fragments/layout :: dashboard-header}"></header>

    <div id="members-content" th:attr="data-focus-id=${focusMemberId},data-focus-prefix='member'">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
            <h2>👥 Członkowie</h2>
            <button hx-get="/members/new" 
                    th:hx-push-uri="@{/members/new}" 
                    hx-target="#members-content" 
                    class="primary">+ Dodaj członka</button>
        </div>

            <div th:if="${#lists.isEmpty(members)}">
                <article>
                    <p>Brak członeków w systemie. Dodaj pierwszego!</p>
                </article>
            </div>

            <div th:unless="${#lists.isEmpty(members)}">
                <table role="grid" id="members-table">
                    <thead>
                        <tr>
                            <th>Imię i nazwisko</th>
                            <th>Wiek</th>
                            <th>Instrument</th>
                            <th>Kontakt</th>
                            <th>Dołączył</th>
                            <th>Rezygnacja</th>
                            <th>Akcje</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="m : ${members}" th:attr="data-member-id=${m.id},id=${'member-' + m.id}">
                            <td data-label="Imię i nazwisko">
                                <a th:href="@{/members/{id}/detail(id=${m.id})}"
                                   hx-target="#content" hx-swap="innerHTML transition:true"
                                   style="text-decoration:none; color:inherit; font-weight:600;"
                                   th:text="${m.firstName} + ' ' + ${m.lastName}">Jan Kowalski</a>
                            </td>
                            <td data-label="Wiek" th:text="${m.age}">35</td>
                            <td data-label="Instrument">
                                <span th:if="${m.primaryInstrument}" th:text="${m.primaryInstrument}" class="instrument-badge">Trąbka</span>
                                <span th:if="${m.allInstruments != null && m.allInstruments.size() > 1}">
                                    <small th:text="' +' + ${m.allInstruments.size() - 1}">+2</small>
                                </span>
                            </td>
                            <td data-label="Kontakt">
                                <small th:if="${m.email}" th:text="${m.email}">jan@email.pl</small>
                                <br th:if="${m.email != null && m.phone != null}">
                                <small th:if="${m.phone}" th:text="${m.phone}">123456789</small>
                            </td>
                            <td data-label="Dołączył">
                                <small th:if="${m.joinedDate}" th:text="${#temporals.format(m.joinedDate, 'dd-MM-yyyy')}">01-01-2024</small>
                            </td>
                            <td data-label="Rezygnacja">
                                <small th:if="${m.resignedDate}" th:text="${#temporals.format(m.resignedDate, 'dd-MM-yyyy')}">01-01-2025</small>
                            </td>
                            <td data-label="Akcje">
                                <button class="outline small"
                                        th:hx-get="@{/members/{id}/detail(id=${m.id})}"
                                        hx-target="#content" hx-swap="innerHTML transition:true">Szczegóły</button>
                                <button class="outline small"
                                        th:hx-get="@{/members/{id}/edit(id=${m.id})}"
                                        hx-target="#members-content" 
                                        th:hx-push-uri="@{/members/{id}/edit(id=${m.id})}">Edytuj</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:insert="~{fragments/layout :: toast-container}"></div>
<div th:insert="~{fragments/layout :: footer-scripts}"></div>

<script th:replace="~{fragments/layout :: dashboard-header-morph}"></script>
</body>
</html>
