<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Muzycy')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <main class="container" id="content">
        <div id="members-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <h2>👥 Muzycy</h2>
                <button hx-get="/members/new" hx-target="#members-content" hx-swap="innerHTML transition:true"
                        class="primary">+ Dodaj muzyka</button>
            </div>

            <div th:if="${#lists.isEmpty(members)}">
                <article>
                    <p>Brak muzyków w systemie. Dodaj pierwszego!</p>
                </article>
            </div>

            <div th:unless="${#lists.isEmpty(members)}">
                <table role="grid">
                    <thead>
                        <tr>
                            <th>Imię i nazwisko</th>
                            <th>Wiek</th>
                            <th>Instrument</th>
                            <th>Kontakt</th>
                            <th>Rola</th>
                            <th>OSP</th>
                            <th>Akcje</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="m : ${members}">
                            <td>
                                <strong th:text="${m.firstName} + ' ' + ${m.lastName}">Jan Kowalski</strong>
                            </td>
                            <td th:text="${m.age}">35</td>
                            <td>
                                <span th:if="${m.primaryInstrument}" th:text="${m.primaryInstrument}" class="instrument-badge">Trąbka</span>
                                <span th:if="${m.allInstruments != null && m.allInstruments.size() > 1}">
                                    <small th:text="' +' + ${m.allInstruments.size() - 1}">+2</small>
                                </span>
                            </td>
                            <td>
                                <small th:if="${m.email}" th:text="${m.email}">jan@email.pl</small>
                                <br th:if="${m.email != null && m.phone != null}">
                                <small th:if="${m.phone}" th:text="${m.phone}">123456789</small>
                            </td>
                            <td>
                                <span th:text="${m.role == 'GUEST' ? 'Gość' : 'Członek'}"
                                      th:class="${m.role == 'GUEST' ? 'badge guest' : 'badge member'}">Członek</span>
                            </td>
                            <td>
                                <span th:text="${m.ospMember ? '✅' : '❌'}">✅</span>
                            </td>
                            <td>
                                <button class="outline small"
                                        th:hx-get="@{/members/{id}/edit(id=${m.id})}"
                                        hx-target="#members-content" hx-swap="innerHTML transition:true">Edytuj</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
