<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Zasoby')}"></head>
<body class="dashboard-page">
<div th:replace="~{fragments/layout :: dialogs}"></div>

<main class="container" id="content">
<section class="dashboard-upcoming">
    <header th:replace="~{fragments/layout :: dashboard-header}"></header>

    <nav th:replace="~{fragments/page-header :: page-header-b(
                        null, 'Zasoby',
                        null, null, null, null, null,
                        null, null, null, null)}"></nav>

        <div th:replace="~{fragments/inventory-frozen :: frozen-banner}"></div>

    <!-- ============================================================
         Unified inventory (F2 S2): one item list, type filter chips,
         attribute filters, mobile-first cards (tap targets >= 44px).
         Data: model.bandItems + model.filterableDefs (InventoryPageController);
         actions go through fetchWithToast() -> /api/inventory/items/*.
         ============================================================ -->
    <div id="inventory-content">

        <!-- Attribute definitions (JSON) driving the two-step create form and attribute filter.
             th:utext (NOT th:text): this is a <script type="application/json"> tag; Thymeleaf's
             HTML escaping (th:text) turns quotes into &quot;, so JSON.parse would fail at runtime. -->
        <script id="inv-defs-json" type="application/json" th:utext="${attributeDefsJson}"></script>

        <!-- Toolbar: add button, filters, search -->
        <div class="inv-toolbar">
            <button type="button" class="inv-add-btn" id="inv-add-open" onclick="inv.toggleForm(true)">
                <th:block th:insert="~{fragments/icons :: plus}"></th:block>
                <span>Dodaj rzecz</span>
            </button>

            <div class="inv-filters">
                <select class="inv-filter" id="inv-type-filter" onchange="inv.render()">
                    <option value="" selected>Wszystkie typy</option>
                    <option value="UNIFORM">Strój</option>
                    <option value="INSTRUMENT">Instrument</option>
                </select>

                <select class="inv-filter" id="inv-attr-filter" onchange="inv.render()">
                    <option value="">Filtruj po atrybucie…</option>
                </select>

                <input type="search" class="inv-search" id="inv-search" placeholder="Szukaj (nazwa, numer seryjny)…" oninput="inv.render()" />
            </div>
        </div>

        <!-- Two-step create form -->
        <article class="inv-card inv-form" id="inv-form" hidden>
            <header><h4>Dodaj rzecz do zasobów</h4></header>

            <div class="inv-field">
                <label for="inv-f-type">Typ <span class="inv-req">*</span></label>
                <select id="inv-f-type" onchange="inv.onTypeChange()">
                    <option value="">— wybierz typ —</option>
                    <option value="UNIFORM">Strój</option>
                    <option value="INSTRUMENT">Instrument</option>
                </select>
            </div>

            <div class="inv-field">
                <label for="inv-f-name">Nazwa <span class="inv-req">*</span></label>
                <input type="text" id="inv-f-name" placeholder="np. Bluza, Trąbka B…" />
            </div>

            <div class="inv-grid2">
                <div class="inv-field">
                    <label for="inv-f-condition">Stan</label>
                    <select id="inv-f-condition">
                        <option value="NEW">Nowy</option>
                        <option value="GOOD" selected>Dobry</option>
                        <option value="FAIR">Przeciętny</option>
                        <option value="POOR">Słaby</option>
                        <option value="DAMAGED">Uszkodzony</option>
                    </select>
                </div>
                <div class="inv-field">
                    <label for="inv-f-serial">Numer seryjny</label>
                    <input type="text" id="inv-f-serial" placeholder="SN…" />
                </div>
            </div>

            <div class="inv-grid2">
                <div class="inv-field">
                    <label for="inv-f-manufacturer">Producent</label>
                    <input type="text" id="inv-f-manufacturer" placeholder="np. Yamaha" />
                </div>
                <div class="inv-field">
                    <label for="inv-f-model">Model</label>
                    <input type="text" id="inv-f-model" placeholder="np. YTR-2335" />
                </div>
            </div>

            <div class="inv-field">
                <label for="inv-f-description">Opis</label>
                <textarea id="inv-f-description" rows="2" placeholder="Dowolny opis…"></textarea>
            </div>

            <!-- Step 2: attribute definitions rendered in displayOrder, input type by AttributeDataType -->
            <div id="inv-attr-step">
                <p class="inv-hint">Najpierw wybierz typ — pokażemy wymagane atrybuty.</p>
            </div>

            <div class="inv-actions">
                <button type="button" class="primary" id="inv-f-submit" onclick="inv.submitCreate()" disabled>Zapisz rzecz</button>
                <button type="button" class="secondary" onclick="inv.toggleForm(false)">Anuluj</button>
            </div>
        </article>

        <!-- Items cards (server-rendered, stable ids for tests) -->
        <div id="inv-list">
            <article class="inv-card" th:each="c : ${cards}" th:with="it=${c.item}"
                     th:id="|inv-item-${it.id}|"
                     th:attr="data-type=${it.type.name()}, data-band=${it.band.id}, data-search=${#strings.toLowerCase((it.name ?: '') + ' ' + (it.serialNumber ?: ''))}">

                <header class="inv-card-head">
                    <h3 th:text="${it.name}">Rzecz</h3>
                    <span class="inv-badge inv-badge-type" th:classappend="'inv-type-' + ${it.type.name()}" th:text="${it.type.displayName}">Strój</span>
                </header>

                <p class="inv-meta" th:if="${it.description != null and !#strings.isEmpty(it.description)}" th:text="${it.description}"></p>
                <p class="inv-meta" th:if="${it.serialNumber != null and !#strings.isEmpty(it.serialNumber)}">Nr seryjny: <strong th:text="${it.serialNumber}"></strong></p>

                <div class="inv-attr-list">
                    <span class="inv-attr" th:each="chip : ${c.chips}"
                          th:attr="data-def-id=${chip.id}, data-def-name=${chip.name}, data-def-value=${chip.value}">
                        <span class="inv-attr-name" th:text="${chip.name}"></span>
                        <span class="inv-attr-value" th:text="${chip.value}"></span>
                    </span>
                </div>

                <footer class="inv-card-foot">
                    <!-- Assignment state: member name when assigned, stock badge otherwise. -->
                    <span th:if="${it.assignedMember != null}" class="inv-assigned"
                          th:with="m=${it.assignedMember}">Przydzielone: <strong th:text="${m.firstName + ' ' + m.lastName}"></strong></span>
                    <span th:if="${it.assignedMember == null}" class="inv-stock">W magazynie</span>

                    <div class="inv-actions">
                        <button th:if="${it.assignedMember != null}" type="button" class="outline inv-tap"
                                data-action="return" th:attr="data-item-id=${it.id}">Zwrot</button>
                        <button th:if="${it.isAvailable() and it.assignedMember == null}" type="button" class="outline inv-tap"
                                data-action="assign" th:attr="data-item-id=${it.id}">Przydziel</button>
                    </div>
                </footer>
            </article>

            <p id="inv-empty" class="inv-hint" th:hidden="${!#lists.isEmpty(cards)}">Brak rzeczy w zasobach. Dodaj pierwszą przyciskiem „Dodaj rzecz”.</p>
        </div>

        <!-- Pagination (client-side over the filtered set — see fragments/list-js).
             #inv-pager buttons are built by JS; bar/nav are hidden until they carry content. -->
        <div class="inv-pagination" id="inv-pagination" hidden>
            <p class="inv-page-info" id="inv-page-info" role="status"></p>
            <label class="inv-page-size" id="inv-page-size-wrap">Na stronę
                <select id="inv-page-size">
                    <option value="12" selected>12</option>
                    <option value="24">24</option>
                    <option value="48">48</option>
                </select>
            </label>
        </div>
        <nav id="inv-pager" class="inv-pager" aria-label="Stronicowanie listy rzeczy" hidden></nav>

        <!-- Assign/return modal (single shared form, JS-filled; one code path) -->
        <article class="inv-card inv-modal" id="inv-assign-modal" hidden>
            <header><h4 id="inv-a-title">Przydziel do członka</h4></header>
            <div class="inv-field">
                <label for="inv-a-member" id="inv-a-member-label">Członek <span class="inv-req">*</span></label>
                <select id="inv-a-member">
                    <option value="">— wybierz członka —</option>
                    <option th:each="m : ${members}" th:value="${m.id}" th:text="${m.firstName + ' ' + m.lastName}"></option>
                </select>
            </div>
            <div class="inv-field">
                <label for="inv-a-condition">Stan w momencie przydziału</label>
                <select id="inv-a-condition">
                    <option value="">bez zmiany</option>
                    <option value="NEW">Nowy</option>
                    <option value="GOOD">Dobry</option>
                    <option value="FAIR">Przeciętny</option>
                    <option value="POOR">Słaby</option>
                    <option value="DAMAGED">Uszkodzony</option>
                </select>
            </div>
            <div class="inv-field" id="inv-a-notes-wrap">
                <label for="inv-a-notes">Notatka</label>
                <input type="text" id="inv-a-notes" placeholder="opcjonalna notatka…" />
            </div>
            <div class="inv-actions">
                <button type="button" class="primary" id="inv-a-submit">Potwierdź</button>
                <button type="button" class="secondary" id="inv-a-close">Anuluj</button>
            </div>
        </article>

    </div>
</section>
</main>
<script th:replace="~{inventory/fragments/list-js :: script}"></script>
</body>
</html>
