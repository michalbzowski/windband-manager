<div id="rehearsals-content">
    <h2>📅 Zaplanuj próbę</h2>

    <form id="rehearsal-form">

        <div class="grid">
            <label>
                Data *
                <input type="date" name="date" th:value="${today}" required>
            </label>
            <label>
                Godzina rozpoczęcia *
                <input type="time" name="startTime" value="18:00" required>
            </label>
        </div>

        <div class="grid">
            <label>
                Godzina zakończenia
                <input type="time" name="endTime" value="20:00">
            </label>
            <label>
                Miejsce
                <input type="text" name="location" placeholder="Sala prób, DK Psary...">
            </label>
        </div>

        <label>
            Notatki
            <textarea name="notes" rows="2" placeholder="Dodatkowe informacje..."></textarea>
        </label>

        <div style="display:flex; gap:0.5rem; margin-top:1rem;">
            <button type="submit" class="primary">Zaplanuj</button>
            <button type="submit" class="secondary" name="saveAndAddAnother" value="true">Zapisz i dodaj kolejny</button>
            <button type="button" class="secondary"
                    hx-get="/rehearsals/list" hx-target="#rehearsals-content"
                    hx-swap="innerHTML transition:true">Anuluj</button>
        </div>
    </form>
    <div id="toast-container"></div>
</div>

<script th:inline="javascript">
    // Guard: prevent duplicate event listeners when form is reloaded via htmx
    var formEl = document.getElementById('rehearsal-form');
    if (formEl) {
        formEl.addEventListener('submit', function(e) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            var form = e.target;
            var formData = new FormData(form);
            var data = {};
            formData.forEach(function(value, key) { data[key] = value; });
            console.log('[REHEARSAL] submit captured, data:', JSON.stringify(data));
            // Check if "Zapisz i dodaj kolejny" button was clicked
            var saveAndAddAnother = form.querySelector('button[name="saveAndAddAnother"]') &&
                                    form.querySelector('button[name="saveAndAddAnother"]') === document.activeElement;

            fetchWithToast('/api/rehearsals', {
                toastMessage: 'Zapisano próbę',
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            }).then(function(response) {
                console.log('[REHEARSAL] response status:', response.status);
                // Reload the rehearsals list content
                var target = saveAndAddAnother ? '/rehearsals/new' : '/rehearsals';
                if (typeof htmx !== 'undefined') {
                    htmx.ajax('GET', target, {target: '#rehearsals-content', swap: 'innerHTML transition:true'});
                } else {
                    // Fallback when htmx is not loaded (e.g. offline CI)
                    // Fetch full page and extract #rehearsals-content
                    fetch(target)
                        .then(function(r) { return r.text(); })
                        .then(function(html) {
                            var parser = new DOMParser();
                            var doc = parser.parseFromString(html, 'text/html');
                            var content = doc.getElementById('rehearsals-content');
                            if (content) {
                                document.getElementById('rehearsals-content').innerHTML = content.innerHTML;
                            }
                        });
                }
            }).catch(function(err) {
                console.log('[REHEARSAL] fetch error:', err);
            });
        }, true); // capture phase — runs BEFORE htmx
    }
</script>
