<div id="rehearsals-content">
    <h2>📅 Zaplanuj spotkanie</h2>

    <form id="rehearsal-form">

        <div class="grid">
            <label>
                Data *
                <input type="date" name="date" th:value="${today}" required>
            </label>
            <label>
                Godzina rozpoczęcia *
                <input type="time" name="startTime" value="18:00" required>
            </label>
        </div>

        <div class="grid">
            <label>
                Godzina zakończenia
                <input type="time" name="endTime" value="20:00">
            </label>
            <label>
                Miejsce
                <input type="text" name="location" placeholder="Miejsce spotkania, DK Psary...">
            </label>
        </div>

        <label>
            Notatki
            <textarea name="notes" rows="2" placeholder="Dodatkowe informacje..."></textarea>
        </label>

        <div style="display:flex; gap:0.5rem; margin-top:1rem;">
            <button type="submit" class="primary">Zaplanuj</button>
            <button type="submit" class="secondary" name="saveAndAddAnother" value="true">Zapisz i dodaj kolejny</button>
            <button type="button" class="secondary"
                    hx-get="/rehearsals/list" hx-target="#rehearsals-content"
                    hx-swap="innerHTML transition:true">Anuluj</button>
        </div>
    </form>
    <div id="toast-container"></div>

    <script th:inline="javascript">
        // Guard: prevent duplicate event listeners when form is reloaded via htmx
        var formEl = document.getElementById('rehearsal-form');
        if (formEl) {
            formEl.addEventListener('submit', function(e) {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                var form = e.target;
                var formData = new FormData(form);
                var data = {};
                formData.forEach(function(value, key) { data[key] = value; });
                console.log('[REHEARSAL] submit captured, data:', JSON.stringify(data));
                // Check if "Zapisz i dodaj kolejny" button was clicked
                var saveAndAddAnother = form.querySelector('button[name="saveAndAddAnother"]') &&
                                        form.querySelector('button[name="saveAndAddAnother"]') === document.activeElement;

                fetchWithToast('/api/rehearsals', {
                    toastMessage: 'Zapisano spotkanie',
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                }).then(function(response) {
                    console.log('[REHEARSAL] response status:', response.status);
                    return response.json();
                }).then(function(rehearsal) {
                    if (saveAndAddAnother) {
                        // Clear the form and keep the user on the page
                        form.reset();
                        // Set default date to today again (local timezone, not UTC)
                        var now = new Date();
                        var today = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
                        var dateInput = form.querySelector("input[name='date']");
                        if (dateInput) dateInput.value = today;
                        var startTimeInput = form.querySelector("input[name='startTime']");
                        if (startTimeInput) startTimeInput.value = '18:00';
                        var endTimeInput = form.querySelector("input[name='endTime']");
                        if (endTimeInput) endTimeInput.value = '20:00';
                    } else {
                        // Navigate straight to the new rehearsal's detail page so the
                        // user can immediately click "Zaproś uczestników" /
                        // "Zaproś grupę" — same flow as event creation (no more
                        // auto-inviting all active members, so the detail page is
                        // the natural next step).
                        if (rehearsal && rehearsal.id) {
                            window.location.href = '/rehearsals/' + rehearsal.id;
                        } else {
                            window.location.href = '/rehearsals';
                        }
                    }
                }).catch(function(err) {
                    console.log('[REHEARSAL] fetch error:', err);
                });
            }, true); // capture phase — runs BEFORE htmx
        }
    </script>
</div>
