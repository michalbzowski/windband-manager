<div id="rehearsals-content">
    <h2>📅 Zaplanuj próbę</h2>

    <form id="rehearsal-form"
          hx-target="#rehearsals-content"
          hx-swap="innerHTML transition:true">

        <div class="grid">
            <label>
                Data *
                <input type="date" name="date" th:value="${today}" required>
            </label>
            <label>
                Godzina rozpoczęcia *
                <input type="time" name="startTime" value="18:00" required>
            </label>
        </div>

        <div class="grid">
            <label>
                Godzina zakończenia
                <input type="time" name="endTime" value="20:00">
            </label>
            <label>
                Miejsce
                <input type="text" name="location" placeholder="Sala prób, DK Psary...">
            </label>
        </div>

        <label>
            Notatki
            <textarea name="notes" rows="2" placeholder="Dodatkowe informacje..."></textarea>
        </label>

        <div style="display:flex; gap:0.5rem; margin-top:1rem;">
            <button type="submit" class="primary">Zaplanuj</button>
            <button type="button" class="secondary"
                    hx-get="/rehearsals/list" hx-target="#rehearsals-content"
                    hx-swap="innerHTML transition:true">Anuluj</button>
        </div>
    </form>
</div>

<script th:inline="javascript">
    // Guard: prevent duplicate event listeners when form is reloaded via htmx
    if (!window._rehearsalFormHandlerAttached) {
        window._rehearsalFormHandlerAttached = true;
        document.body.addEventListener('submit', function(e) {
            if (e.target.id === 'rehearsal-form') {
                e.preventDefault();
                var form = e.target;
                var formData = new FormData(form);
                var data = {};
                formData.forEach(function(value, key) { data[key] = value; });

                fetch('/api/rehearsals', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                }).then(function() {
                    htmx.ajax('GET', '/rehearsals/list', {target: '#rehearsals-content', swap: 'innerHTML transition:true'});
                });
            }
        });
    }
</script>
