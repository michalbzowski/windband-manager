<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Powiadomienia e-mail')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container" id="content">
    <div id="notifications-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
            <h2>📧 Powiadomienia e-mail</h2>
            <button class="outline small"
                    hx-get="/rehearsals" hx-target="#content"
                    hx-swap="innerHTML transition:true">Powrót do prób</button>
        </div>

        <article style="margin-bottom:1rem;">
            <header>
                <strong th:text="${rehearsal.date}">01.01.2025</strong>
                <span th:text="${rehearsal.startTime} + ' - ' + ${rehearsal.endTime}">18:00 - 20:00</span>
            </header>
            <p th:if="${rehearsal.location}" th:text="'Miejsce: ' + ${rehearsal.location}">Miejsce: Sala prób</p>
        </article>

        <div style="display:flex; gap:1rem; margin-bottom:1.5rem; flex-wrap:wrap;">
            <article style="flex:1; min-width:120px; text-align:center;">
                <div style="font-size:2rem; font-weight:bold;" id="stat-total">-</div>
                <div>Aktywnych</div>
            </article>
            <article style="flex:1; min-width:120px; text-align:center;">
                <div style="font-size:2rem; font-weight:bold; color:green;" id="stat-success">-</div>
                <div>Wysłane</div>
            </article>
            <article style="flex:1; min-width:120px; text-align:center;">
                <div style="font-size:2rem; font-weight:bold; color:red;" id="stat-failed">-</div>
                <div>Błędy</div>
            </article>
        </div>

        <h3>Szczegóły wysyłki</h3>

        <div id="member-email-list">
            <p>Ładowanie danych...</p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:insert="~{fragments/layout :: toast-container}"></div>
<div th:insert="~{fragments/layout :: footer-scripts}"></div>

<script th:inline="javascript">
    var rehearsalId = [[${rehearsal.id}]];

    function loadEmailStats() {
        fetch('/api/rehearsals/' + rehearsalId + '/email-stats')
            .then(function(res) {
                if (!res.ok) {
                    document.getElementById('member-email-list').innerHTML =
                        '<p>Brak danych o wysyłce. Powiadomienie mogło jeszcze nie zostać wysłane (wysyłka jest asynchroniczna).</p>';
                    return null;
                }
                return res.json();
            })
            .then(function(stats) {
                if (!stats) return;
                document.getElementById('stat-total').textContent = stats.totalMembers;
                document.getElementById('stat-success').textContent = stats.successCount;
                document.getElementById('stat-failed').textContent = stats.failedCount;

                var html = '';
                if (stats.memberResults.length === 0) {
                    html = '<p>Brak członków z zdefiniowanym adresem e-mail.</p>';
                } else {
                    html = '<table role="grid"><thead><tr><th>Muzyk</th><th>Email</th><th>Status</th></tr></thead><tbody>';
                    stats.memberResults.forEach(function(r) {
                        var statusIcon = r.success ? '✅' : '❌';
                        var statusColor = r.success ? 'green' : 'red';
                        html += '<tr>';
                        html += '<td th:text="' + r.firstName + ' ' + r.lastName + '">' + r.firstName + ' ' + r.lastName + '</td>';
                        html += '<td style="font-family:monospace; font-size:0.85rem;">' + r.email + '</td>';
                        html += '<td style="color:' + statusColor + '; font-weight:bold;">' + statusIcon + ' ' + (r.success ? 'Wysłany' : 'Błąd') + '</td>';
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                }
                document.getElementById('member-email-list').innerHTML = html;
            })
            .catch(function(err) {
                document.getElementById('member-email-list').innerHTML =
                    '<p style="color:red;">Błąd ładowania danych: ' + err.message + '</p>';
            });
    }

    document.addEventListener('DOMContentLoaded', loadEmailStats);
</script>
</body>
</html>
