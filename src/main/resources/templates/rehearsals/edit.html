<div id="rehearsals-content">
    <h2>✏️ Edytuj spotkanie</h2>

    <form id="rehearsal-edit-form"
          hx-target="#rehearsals-content"
          hx-swap="innerHTML transition:true">

        <div class="grid">
            <label>
                Data *
                <input type="date" name="date" th:value="${rehearsal.date}" required>
            </label>
            <label>
                Godzina rozpoczęcia *
                <input type="time" name="startTime" th:value="${rehearsal.startTime}" required>
            </label>
        </div>

        <div class="grid">
            <label>
                Godzina zakończenia
                <input type="time" name="endTime" th:value="${rehearsal.endTime}">
            </label>
            <label>
                Miejsce
                <input type="text" name="location" placeholder="Miejsce spotkania, DK Psary..." th:value="${rehearsal.location}">
            </label>
        </div>

        <label>
            Notatki
            <textarea name="notes" rows="2" placeholder="Dodatkowe informacje..." th:text="${rehearsal.notes}"></textarea>
        </label>

        <div style="display:flex; gap:0.5rem; margin-top:1rem;">
            <button type="submit" class="primary">Zapisz zmiany</button>
            <button type="button" class="secondary"
                    th:hx-get="@{/rehearsals/{id}(id=${rehearsal.id})}"
                    hx-target="#rehearsals-content"
                    hx-swap="innerHTML transition:true">Anuluj</button>
        </div>
    </form>
</div>

<script th:inline="javascript">
    // Guard: prevent duplicate event listeners when form is reloaded via htmx
    if (!window._rehearsalEditFormHandlerAttached) {
        window._rehearsalEditFormHandlerAttached = true;
        document.body.addEventListener('submit', function(e) {
            if (e.target.id === 'rehearsal-edit-form') {
                e.preventDefault();
                var form = e.target;
                var formData = new FormData(form);
                var data = {};
                formData.forEach(function(value, key) { data[key] = value; });

                var rehearsalId = [[${rehearsal.id}]];

                fetchWithToast('/api/rehearsals/' + rehearsalId,{ toastMessage: 'Zapisano spotkanie', {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                }).then(function(response) {
                    if (response.ok) {
                        htmx.ajax('GET', '/rehearsals/' + rehearsalId, {target: '#rehearsals-content', swap: 'innerHTML transition:true'});
                    } else {
                        console.error('Failed to update rehearsal:', response.statusText);
                    }
                }).catch(function(error) {
                    console.error('Error updating rehearsal:', error);
                });
            }
        });
    }
</script>
