<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Edytuj spotkanie')}"></head>
<body class="dashboard-page">
<div th:replace="~{fragments/layout :: dialogs}"></div>

<main class="container" id="content">
    <section class="dashboard-upcoming">
        <header th:replace="~{fragments/layout :: dashboard-header}"></header>

    <div id="rehearsals-content">
        <nav th:replace="~{fragments/page-header :: page-header-c(${editBackUrl}, 'Edytuj spotkanie', null, null)}"></nav>


        <!-- Celowo bez hx-put: endpoint zapisu przyjmuje JSON (@RequestBody), a HTMX domyślnie
             wysyła application/x-www-form-urlencoded → 400. Zapis wykonuje handler JS poniżej
             (PUT JSON + nagłówek X-XSRF-TOKEN; bez niego CsrfFilter odrzuca żądanie z 403). -->
        <form id="rehearsal-edit-form">
            <div class="grid">
                <label>
                    Data *
                    <input type="date" name="date" th:value="${rehearsal.date}" required>
                </label>
                <label>
                    Godzina rozpoczęcia *
                    <input type="time" name="startTime" th:value="${rehearsal.startTime}" required>
                </label>
            </div>

            <div class="grid">
                <label>
                    Godzina zakończenia
                    <input type="time" name="endTime" th:value="${rehearsal.endTime}">
                </label>
                <label>
                    Miejsce
                    <input type="text" name="location" placeholder="Miejsce spotkania, DK Psary..." th:value="${rehearsal.location}">
                </label>
            </div>

            <label>
                Notatki
                <textarea name="notes" rows="2" placeholder="Dodatkowe informacje..." th:text="${rehearsal.notes}"></textarea>
            </label>

            <div style="display:flex; gap:0.5rem; margin-top:1rem;">
                <button type="submit" class="primary">Zapisz zmiany</button>
                <button type="button" class="secondary"
                        th:hx-get="@{/rehearsals/{id}(id=${rehearsal.id})}"
                        hx-target="#rehearsals-content"
                        hx-swap="innerHTML transition:true">Anuluj</button>
            </div>
        </form>

        <!-- Inline script must live INSIDE the #rehearsals-content fragment.
             When the user navigates via HTMX (detail page -> "Edytuj" button),
             the controller returns `rehearsals/edit :: #rehearsals-content` and
             HTMX swaps only the fragment content. Any <script> tag placed
             OUTSIDE this div is stripped from the swapped result, so the
             submit handler is never registered and the form falls back to a
             native HTML GET submit (which posts the form fields into the
             current URL's query string and silently drops the data — exactly
             the bug Owner reported: "Klikam zapisz zmiany. Nic się nie
             zapisało a zostałem przeniesiony na listę spotkań."). Keeping
             the script inside the fragment ensures it is re-executed every
             time the edit form is rendered, regardless of how it got there. -->
        <script th:inline="javascript">
            if (!window._rehearsalEditHtmxBound) {
                window._rehearsalEditHtmxBound = true;
                document.addEventListener('submit', function(event) {
                    const form = event.target;
                    if (!(form instanceof HTMLFormElement)) return;
                    if (form.id !== 'rehearsal-edit-form') return;
                    event.preventDefault();
                    const rehearsalId = /*[[${rehearsal.id}]]*/ 0;
                    const payload = {
                        date: form.date.value,
                        startTime: form.startTime.value,
                        endTime: form.endTime.value || null,
                        location: form.location.value || null,
                        notes: form.notes.value || null
                    };
                    // CSRF — ten sam kontrakt co compositions/newFromPdf.html (PR #328):
                    // cookie XSRF-TOKEN → nagłówek X-XSRF-TOKEN. Bez niego CsrfFilter odrzuca PUT z 403;
                    // suity Selenium tego nie widzą (hook CDP w UiTestBase podkłada token we wszystkich żądaniach).
                    function csrfHeaders() {
                        var headers = {'Content-Type': 'application/json'};
                        if (window.getCookie) {
                            var token = window.getCookie('XSRF-TOKEN');
                            if (token) { headers['X-XSRF-TOKEN'] = decodeURIComponent(token); }
                        }
                        return headers;
                    }
                    fetch('/api/rehearsals/' + rehearsalId, {
                        method: 'PUT',
                        headers: csrfHeaders(),
                        body: JSON.stringify(payload)
                    }).then(function(response) {
                            if (!response.ok) {
                                return response.text().then(function (text) {
                                    var reason = null;
                                    try {
                                        var parsed = JSON.parse(text);
                                        reason = parsed.error || parsed.message;
                                    } catch (ignored) { /* nie-JSON, np. strona błędu HTML */ }
                                    throw new Error(reason ? String(reason) : 'Zapis nie powiódł się (HTTP ' + response.status + ')');
                                });
                            }
                    window.location.href = '/rehearsals/' + rehearsalId;
                    }) .catch(function(error) {
                        console.error('Failed to update rehearsal:', error);
                        if (window.Toast && window.Toast.error) {
                            window.Toast.error('Zapis zmian nie powiódł się: ' + (error.message || String(error)));
                        } else {
                            alert('Zapis zmian nie powiódł się: ' + (error.message || String(error)));
                        }
                    });
                    });
            }
        </script>
    </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:insert="~{fragments/layout :: toast-container}"></div>
<div th:insert="~{fragments/layout :: footer-scripts}"></div>

<div th:insert="~{fragments/layout :: dashboard-header-morph}"></div>
</body>
</html>
