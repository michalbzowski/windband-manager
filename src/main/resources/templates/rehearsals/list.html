<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Spotkania')}"></head>
<body class="dashboard-page">
<div th:replace="~{fragments/layout :: dialogs}"></div>

<main class="container" id="content">
    <section class="dashboard-upcoming">
        <header th:replace="~{fragments/layout :: dashboard-header}"></header>

    <div id="rehearsals-content" th:attr="data-focus-id=${focusRehearsalId},data-focus-prefix='rehearsal'">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
            <h2>🎵 Spotkania</h2>
            <button hx-get="/rehearsals/new" hx-target="#rehearsals-content"
                    hx-swap="innerHTML transition:true" class="primary">+ Zaplanuj spotkanie</button>
        </div>

            <div th:if="${#lists.isEmpty(upcomingRehearsals) and #lists.isEmpty(pastRehearsals)}">
                <article>
                    <p>Brak zaplanowanych prób.</p>
                </article>
            </div>

            <!-- ===================== UPCOMING ===================== -->
            <div th:if="${not #lists.isEmpty(upcomingRehearsals)}">
                <h3 class="section-heading" th:unless="${#lists.isEmpty(pastRehearsals)}">Nadchodzące</h3>
                <table role="grid">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Godzina</th>
                            <th>Miejsce</th>
                            <th>Obecność</th>
                            <th>Akcje</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${upcomingRehearsals}" th:id="'rehearsal-' + ${r.id}">
                            <td data-label="Data" th:text="${r.date}">01.01.2025</td>
                            <td data-label="Godzina" th:text="${r.startTime}">18:00</td>
                            <td data-label="Miejsce" th:text="${r.location}">Miejsce spotkania</td>
                            <td data-label="Obecność">
                                <span th:text="${r.presentCount} + ' / ' + ${r.attendances.size()}">12 / 15</span>
                            </td>
                            <td data-label="Akcje">
                                <button class="outline small"
                                        th:hx-get="@{/rehearsals/{id}(id=${r.id})}"
                                        hx-target="#content"
                                        hx-swap="innerHTML transition:true">Szczegóły</button>
                                <button class="outline small secondary"
                                        th:attr="data-id=${r.id}"
                                        onclick="deleteRehearsal(this.getAttribute('data-id'))"
                                        style="margin-left:0.25rem;">Usuń</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- ===================== PAST ===================== -->
            <div th:if="${not #lists.isEmpty(pastRehearsals)}">
                <h3 class="section-heading">📅 Przeszłe spotkania</h3>
                <table role="grid">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Godzina</th>
                            <th>Miejsce</th>
                            <th>Obecność</th>
                            <th>Akcje</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${pastRehearsals}" class="past-item" th:id="'rehearsal-' + ${r.id}">
                            <td data-label="Data">
                                <span th:text="${r.date}">01.01.2025</span>
                                <span class="past-badge">Odbyło się</span>
                            </td>
                            <td data-label="Godzina" th:text="${r.startTime}">18:00</td>
                            <td data-label="Miejsce" th:text="${r.location}">Miejsce spotkania</td>
                            <td data-label="Obecność">
                                <span th:text="${r.presentCount} + ' / ' + ${r.attendances.size()}">12 / 15</span>
                            </td>
                            <td data-label="Akcje">
                                <button class="outline small"
                                th:hx-get="@{/rehearsals/{id}(id=${r.id})}"
                                hx-target="#content"
                                hx-swap="innerHTML transition:true">Szczegóły</button>
                                <button class="outline small secondary"
                                        th:attr="data-id=${r.id}"
                                        onclick="if(confirm('Czy na pewno chcesz usunąć tę spotkanie?')) deleteRehearsal(this.getAttribute('data-id'))"
                                        style="margin-left:0.25rem;">Usuń</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:insert="~{fragments/layout :: toast-container}"></div>
<div th:insert="~{fragments/layout :: footer-scripts}"></div>

<script th:replace="~{fragments/layout :: dashboard-header-morph}"></script>

<script>
    function deleteRehearsal(id) {
        fetchWithToast('/api/rehearsals/' + id, { method: 'DELETE', toastMessage: 'Spotkanie zostało usunięte' })
            .then(function(response) {
                if (response.ok) {
                    window.location.href = '/rehearsals';
                }
            });
    }
</script>
</body>
</html>
