<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Próby')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

    <main class="container" id="content">
        <div id="rehearsals-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <h2>🎵 Próby</h2>
                <button hx-get="/rehearsals/new" hx-target="#rehearsals-content"
                        hx-swap="innerHTML transition:true" class="primary">+ Zaplanuj próbę</button>
            </div>

            <div th:if="${#lists.isEmpty(rehearsals)}">
                <article>
                    <p>Brak zaplanowanych prób.</p>
                </article>
            </div>

            <div th:unless="${#lists.isEmpty(rehearsals)}">
                <table role="grid">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Godzina</th>
                            <th>Miejsce</th>
                            <th>Obecność</th>
                            <th>Akcje</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${rehearsals}">
                            <td data-label="Data" th:text="${r.date}">01.01.2025</td>
                            <td data-label="Godzina" th:text="${r.startTime}">18:00</td>
                            <td data-label="Miejsce" th:text="${r.location}">Sala prób</td>
                            <td data-label="Obecność">
                                <span th:text="${r.presentCount} + ' / ' + ${r.attendances.size()}">12 / 15</span>
                            </td>
                            <td data-label="Akcje">
                                <button class="outline small"
                                        th:hx-get="@{/rehearsals/{id}(id=${r.id})}"
                                        hx-target="#rehearsals-content"
                                        hx-swap="innerHTML transition:true">Szczegóły</button>
                                <button class="outline small secondary"
                                        th:attr="data-id=${r.id}"
                                        onclick="if(confirm('Czy na pewno chcesz usunąć tę próbę?')) deleteRehearsal(this.getAttribute('data-id'))"
                                        style="margin-left:0.25rem;">Usuń</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:insert="~{fragments/layout :: toast-container}"></div>
<div th:insert="~{fragments/layout :: footer-scripts}"></div>

    <script>
        function deleteRehearsal(id) {
            fetchWithToast('/api/rehearsals/' + id, { method: 'DELETE', toastMessage: 'Próba została usunięta' })
                .then(function(response) {
                    if (response.ok) {
                        htmx.ajax('GET', '/rehearsals/list', {target: '#rehearsals-content', swap: 'innerHTML transition:true'});
                    }
                });
        }
    </script>
</body>
</html>
