<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Szczegóły spotkania')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container" id="content">
    <div id="rehearsals-content">
        <h2>🎵 Szczegóły spotkania</h2>

        <article>
            <header>
                <strong th:text="${rehearsal.date}">01.01.2025</strong>
                <span th:text="${rehearsal.startTime} + ' - ' + ${rehearsal.endTime}">18:00 - 20:00</span>
                <span style="margin-left:0.5rem;">
                    <button class="outline small"
                            hx-get="@{/rehearsals/{id}/notifications(id=${rehearsal.id})}"
                            hx-target="#content"
                            hx-swap="innerHTML transition:true"
                            title="Zobacz szczegóły wysyłki powiadomień e-mail">📧 <span id="email-badge" th:text="'...'">...</span></button>
                </span>
            </header>
            <p th:if="${rehearsal.location}" th:text="'Miejsce: ' + ${rehearsal.location}">Miejsce: Miejsce spotkania</p>
            <p th:if="${rehearsal.notes}" th:text="${rehearsal.notes}">Notatki</p>
        </article>

        <h3>Lista obecności</h3>

        <table role="grid">
            <thead>
                <tr>
                    <th>Członek</th>
                    <th>Instrument</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="m : ${members}">
                    <td th:text="${m.firstName + ' ' + m.lastName}">Jan Kowalski</td>
                    <td th:text="${m.primaryInstrument}">Trąbka</td>
                    <td>
                        <select class="status-select" data-member-id="${m.id}" th:name="'status_' + ${m.id}" th:id="'status_' + ${m.id}">
                            <option value="PRESENT" th:selected="${attendanceMap[m.id]?.name() == 'PRESENT'}">Present</option>
                            <option value="EXCUSED" th:selected="${attendanceMap[m.id]?.name() == 'EXCUSED'}">Excused</option>
                            <option value="UNEXCUSED" th:selected="${attendanceMap[m.id]?.name() == 'UNEXCUSED'}">Unexcused</option>
                            <option value="NO_RESPONSE" th:selected="${attendanceMap[m.id]?.name() == 'NO_RESPONSE'}">No response</option>
                        </select>
                    </td>
                </tr>
            </tbody>
        </table>

        <div style="display:flex; gap:0.5rem; margin-top:1rem;">
            <button type="button" class="primary" id="save-attendance-btn">Zapisz obecność</button>
            <button type="button" class="secondary"
                    th:hx-get="@{/rehearsals/{id}/edit(id=${rehearsal.id})}"
                    hx-target="#rehearsals-content"
                    hx-swap="innerHTML transition:true">Edytuj</button>
            <button type="button" class="secondary"
                    hx-get="/rehearsals/list" hx-target="#rehearsals-content"
                    hx-swap="innerHTML transition:true">Powrót</button>
        </div>
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const statusSelects = document.querySelectorAll('.status-select');
        const rehearsalId = [[${rehearsal.id}]];

        statusSelects.forEach(select => {
            select.addEventListener('change', function(event) {
                const memberId = event.target.dataset.memberId;
                const selectedStatus = event.target.value;

                fetchWithToast('/api/rehearsals/' + rehearsalId + '/attendance', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        rehearsalId: rehearsalId,
                        memberId: parseInt(memberId),
                        status: selectedStatus
                    }),
                })
                .then(response => {
                    if (!response.ok) {
                        console.error('Failed to update status:', response.statusText);
                    } else {
                        console.log('Status updated successfully');
                        htmx.ajax('GET', '/rehearsals/' + rehearsalId, {target: '#rehearsals-content', swap: 'innerHTML'});
                    }
                })
                .catch(error => {
                    console.error('Error updating status:', error);
                });
            });
        });
    });
</script>
<script th:inline="javascript">
    document.getElementById('save-attendance-btn').addEventListener('click', function() {
        var rehearsalId = [[${rehearsal.id}]];
        var selects = document.querySelectorAll('select[id^="status_"]');
        var promises = [];
        selects.forEach(function(select) {
            var memberId = select.id.replace('status_', '');
            var status = select.value;
            if (status !== 'NO_RESPONSE') {
                promises.push(fetchWithToast('/api/rehearsals/' + rehearsalId + '/attendance', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({rehearsalId: rehearsalId, memberId: parseInt(memberId), status: status})
                }));
            }
        });
        Promise.all(promises).then(function() {
            htmx.ajax('GET', '/rehearsals/' + rehearsalId, {target: '#rehearsals-content', swap: 'innerHTML transition:true'});
        });
    });

    // Load email notification badge
    (function() {
        var rehearsalId = [[${rehearsal.id}]];
        var badge = document.getElementById('email-badge');
        if (!badge) return;
        fetch('/api/rehearsals/' + rehearsalId + '/email-stats')
            .then(function(res) { if (!res.ok) return null; return res.json(); })
            .then(function(stats) {
                if (!stats) {
                    badge.textContent = '—';
                    return;
                }
                badge.textContent = stats.successCount + '/' + stats.totalMembers;
            })
            .catch(function() { badge.textContent = '—'; });
    })();
</script>
</body>
</html>
