<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Tagi')}"></head>
<body class="dashboard-page">
<div th:replace="~{fragments/layout :: dialogs}"></div>

<main class="container" id="content">
    <section class="dashboard-upcoming">
        <header th:replace="~{fragments/layout :: dashboard-header}"></header>

    <div id="tags-content">
        <nav th:replace="~{fragments/page-header :: page-header-b(
                            null, 'Tagi', 'Dodaj tag', @{/tags/new},
                            'plus', 'add-tag-btn', '#tags-content',
                            null, null, null, null)}"></nav>

        <div th:if="${#lists.isEmpty(instruments)}">
            <article>
                <p>Brak tagów w systemu. Dodaj pierwszy!</p>
            </article>
        </div>

        <div th:unless="${#lists.isEmpty(instruments)}">
            <table role="grid">
                <thead>
                    <tr>
                        <th>Kolejność</th>
                        <th>Nazwa</th>
                        <th>Opis</th>
                        <th>Akcje</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="inst : ${instruments}">
                        <td th:text="${inst.getSortPriority()}">0</td>
                        <td th:text="${inst.getName()}">Trąbka</td>
                        <td th:text="${inst.getDescription()}">Instrument dęty blaszany</td>
                        <td>
                            <button class="outline small"
                                    th:hx-get="@{/tags/{id}/edit(id=${inst.getId()})}"
                                    hx-target="#tags-content" hx-swap="innerHTML transition:true">Edytuj</button>
                            <button class="outline small secondary"
                                    th:hx-delete="@{/api/tags/{id}(id=${inst.getId()})}"
                                    hx-confirm="Czy na pewno chcesz usunąć ten tag?"
                                    hx-on::after-request="if (event.detail.successful) { htmx.ajax('GET', '/tags/list', {target: '#tags-content', swap: 'innerHTML transition:true'}); } else if (event.detail.xhr && event.detail.xhr.status === 409) { showTagDeleteBlockedDialog(event.detail.xhr); }">Usuń</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <dialog id="tag-delete-blocked-modal" class="app-modal">
        <div class="app-modal-content">
            <header class="app-modal-header">
                <div class="app-modal-header-text">
                    <strong>Nie można usunąć tagu</strong>
                    <small id="tag-delete-blocked-subtitle">Tag jest przypisany do członków zespołu</small>
                </div>
                <button type="button" class="app-modal-close" aria-label="Zamknij" data-close>×</button>
            </header>
            <div class="app-modal-body">
                <p id="tag-delete-blocked-message"></p>
                <div id="tag-delete-blocked-members-wrap" style="display:none; margin-top:0.75rem;">
                    <p><strong>Przypisany do:</strong></p>
                    <ul id="tag-delete-blocked-members"></ul>
                </div>
                <div style="margin-top:1rem; display:flex; justify-content:flex-end;">
                    <button type="button" class="primary" data-close>OK</button>
                </div>
            </div>
        </div>
    </dialog>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:insert="~{fragments/layout :: toast-container}"></div>
<div th:insert="~{fragments/layout :: footer-scripts}"></div>

<div th:insert="~{fragments/layout :: dashboard-header-morph}"></div>

<script>
    function showTagDeleteBlockedDialog(xhr) {
        var payload = {};
        try {
            payload = JSON.parse(xhr.responseText || '{}');
        } catch (e) {
            payload = {};
        }

        var modal = document.getElementById('tag-delete-blocked-modal');
        var message = document.getElementById('tag-delete-blocked-message');
        var membersWrap = document.getElementById('tag-delete-blocked-members-wrap');
        var membersList = document.getElementById('tag-delete-blocked-members');

        var instrumentName = payload.instrumentName || 'ten tag';
        var memberNames = Array.isArray(payload.memberNames) ? payload.memberNames : [];

        message.textContent = memberNames.length > 0
            ? 'Tag "' + instrumentName + '" jest przypisany do następujących osób:'
            : 'Tag "' + instrumentName + '" jest przypisany do członka zespołu.';

        membersList.innerHTML = '';
        if (memberNames.length > 0) {
            memberNames.forEach(function(name) {
                var li = document.createElement('li');
                li.textContent = name;
                membersList.appendChild(li);
            });
            membersWrap.style.display = 'block';
        } else {
            membersWrap.style.display = 'none';
        }

        if (modal && typeof modal.showModal === 'function') {
            modal.showModal();
        } else if (modal) {
            modal.setAttribute('open', '');
        }
    }
</script>
</body>
</html>
