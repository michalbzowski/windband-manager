<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Administratorzy systemu')}"></head>
<body class="dashboard-page">
    <div th:replace="~{fragments/layout :: dialogs}"></div>

<main class="container" id="content">
    <section class="dashboard-upcoming">
        <header th:replace="~{fragments/layout :: dashboard-header}"></header>

        <nav th:replace="~{fragments/page-header :: page-header-b(null, 'Administratorzy systemu', null, null, null, null, null, null, null, null, null)}"></nav>
        <p class="text-muted">Zarządzaj rolami SYSTEM_ADMIN. Tylko administratorzy systemu mają dostęp do tej strony.</p>

        <div th:if="${#lists.isEmpty(users)}" class="alert alert-info">
            Brak zarejestrowanych użytkowników.
        </div>

        <table th:if="${not #lists.isEmpty(users)}" class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Display Name</th>
                    <th>Status</th>
                    <th>SYSTEM_ADMIN</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.username}"></td>
                    <td th:text="${user.email}"></td>
                    <td th:text="${user.displayName}"></td>
                    <td>
                        <span th:if="${user.active}" class="badge bg-success">Aktywny</span>
                        <span th:unless="${user.active}" class="badge bg-secondary">Nieaktywny</span>
                    </td>
                    <td>
                        <span th:if="${user.systemAdmin}" class="badge bg-danger">SYSTEM_ADMIN</span>
                        <span th:unless="${user.systemAdmin}" class="text-muted">—</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:insert="~{fragments/layout :: toast-container}"></div>
<div th:insert="~{fragments/layout :: footer-scripts}"></div>

<div th:insert="~{fragments/layout :: dashboard-header-morph}"></div>
</body>
</html>
