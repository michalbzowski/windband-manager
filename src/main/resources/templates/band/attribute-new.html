<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nowy atrybut')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <main class="container" id="content">
        <div style="margin-bottom:1rem;">
            <a href="/band/attributes" style="font-size:0.9rem;">← Powrót do listy atrybutów</a>
        </div>

        <h4>➕ Nowy atrybut</h4>
        <div style="margin-bottom:1rem; padding:1rem; border:1px solid var(--pico-muted-border-color); border-radius:8px;">
            <form th:hx-post="@{/band/attributes}"
                  hx-target="body"
                  hx-swap="none"
                  hx-include="this">
                <div class="grid">
                    <label>
                        Nazwa *
                        <input type="text" name="name" required>
                    </label>
                    <label>
                        Typ
                        <select name="type" id="attr-type-new" onchange="toggleOptionsField()">
                            <option value="BOOLEAN">Tak/Nie</option>
                            <option value="TEXT">Tekst</option>
                            <option value="NUMBER">Liczba</option>
                            <option value="SELECT">Wybór (jedna opcja)</option>
                            <option value="MULTI_SELECT">Wybór (wiele opcji)</option>
                            <option value="DATE">Data</option>
                        </select>
                    </label>
                </div>
                <div class="grid">
                    <label>
                        Kolejność
                        <input type="number" name="displayOrder" value="0" min="0">
                    </label>
                    <label>
                        <input type="checkbox" name="required">
                        Wymagany
                    </label>
                </div>
                <div id="options-field-new" style="display:none; margin-top:0.5rem;">
                    <label>
                        Opcje (oddzielone przecinkiem)
                        <textarea name="options" rows="3" style="font-family:monospace; font-size:0.85rem;"
                                  placeholder="Puzon, Trąbka, Waltornia, Flet"></textarea>
                    </label>
                </div>
                <div style="display:flex; gap:0.5rem; margin-top:0.5rem;">
                    <button type="submit" class="primary small">Dodaj atrybut</button>
                    <a href="/band/attributes" class="secondary small" style="padding:0.4rem 0.8rem; text-decoration:none; border-radius:4px; border:1px solid var(--pico-muted-color);">Anuluj</a>
                </div>
            </form>
        </div>
    </main>

    <script>
        function toggleOptionsField() {
            var typeSelect = document.getElementById('attr-type-new');
            var optionsField = document.getElementById('options-field-new');
            var type = typeSelect.value;
            if (type === 'SELECT' || type === 'MULTI_SELECT') {
                optionsField.style.display = '';
            } else {
                optionsField.style.display = 'none';
            }
        }
    </script>
</body>
</html>
