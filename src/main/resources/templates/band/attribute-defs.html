<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Atrybuty')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <main class="container" id="content">
        <div id="attribute-defs-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <h2>🏷️ Atrybuty muzyków</h2>
                <button class="primary"
                        th:hx-get="@{/band/attributes/new}"
                        hx-target="#attribute-form-container"
                        hx-swap="innerHTML">+ Dodaj atrybut</button>
            </div>

            <!-- Form container: new/edit forms loaded here via HTMX -->
            <div id="attribute-form-container"></div>

            <!-- Attribute list rendered directly -->
            <div th:if="${attributeDefs == null or #lists.isEmpty(attributeDefs)}">
                <p>Brak atrybutów w systemie. Dodaj pierwszy!</p>
            </div>
            <table th:if="${attributeDefs != null and !#lists.isEmpty(attributeDefs)}"
                   style="width:100%; border-collapse:collapse;">
                <thead>
                    <tr style="border-bottom:2px solid var(--pico-muted-border-color);">
                        <th style="text-align:left; padding:0.5rem;">Nazwa</th>
                        <th style="text-align:left; padding:0.5rem;">Typ</th>
                        <th style="text-align:center; padding:0.5rem;">Wymagany</th>
                        <th style="text-align:center; padding:0.5rem;">Kolejność</th>
                        <th style="text-align:left; padding:0.5rem;">Opcje</th>
                        <th style="text-align:left; padding:0.5rem;">Akcje</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="attrDef : ${attributeDefs}" style="border-bottom:1px solid var(--pico-muted-border-color);">
                        <td style="padding:0.5rem;" th:text="${attrDef.name}">Nazwa</td>
                        <td style="padding:0.5rem;" th:text="${attrDef.type == 'BOOLEAN'} ? 'Tak/Nie' : (${attrDef.type == 'NUMBER'} ? 'Liczba' : (${attrDef.type == 'SELECT'} ? 'Wybór' : (${attrDef.type == 'MULTI_SELECT'} ? 'Wybór wielokrotny' : (${attrDef.type == 'DATE'} ? 'Data' : 'Tekst'))))">Typ</td>
                        <td style="padding:0.5rem; text-align:center;" th:text="${attrDef.required} ? '✅' : '❌'">Wymagany</td>
                        <td style="padding:0.5rem; text-align:center;" th:text="${attrDef.displayOrder}">0</td>
                        <td style="padding:0.5rem; font-size:0.8rem; color:var(--pico-muted-color);"
                            th:text="${attrDef.options != null and !attrDef.options.isEmpty()} ? ${#strings.abbreviate(attrDef.options, 40)} : '-'">Opcje</td>
                        <td style="padding:0.5rem;">
                            <button class="outline small"
                                    th:hx-get="@{/band/attributes/{id}/edit(id=${attrDef.id})}"
                                    hx-target="#attribute-form-container"
                                    hx-swap="innerHTML">Edytuj</button>
                            <button class="outline small secondary"
                                    th:hx-delete="@{/band/attributes/{id}(id=${attrDef.id})}"
                                    hx-confirm="Czy na pewno chcesz usunąć ten atrybut?"
                                    hx-target="#content"
                                    hx-swap="innerHTML">Usuń</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
    // Re-process HTMX elements after any swap (fixes forms loaded via innerHTML)
    document.body.addEventListener('htmx:afterSettle', function(evt) {
        htmx.process(evt.detail.target);
    });
    </script>
</body>
</html>
