<div id="new-attr-form"
     style="margin-bottom:1rem; padding:1rem; border:1px solid var(--pico-muted-border-color); border-radius:8px;"
     th:with="isEdit=${attributeDefId != null}">
    <h4 th:text="${isEdit} ? 'Edytuj atrybut' : 'Nowy atrybut'">Nowy atrybut</h4>

    <!-- New attribute form -->
    <form th:unless="${isEdit}"
          hx-post="@{/band/attributes}"
          hx-target="#attribute-defs-content"
          hx-swap="innerHTML">
        <div class="grid">
            <label>
                Nazwa *
                <input type="text" name="name" required>
            </label>
            <label>
                Typ
                <select name="type" id="attr-type-new" onchange="toggleOptionsField('new')">
                    <option value="BOOLEAN">Tak/Nie</option>
                    <option value="TEXT">Tekst</option>
                    <option value="NUMBER">Liczba</option>
                    <option value="SELECT">Wybór (jedna opcja)</option>
                    <option value="MULTI_SELECT">Wybór (wiele opcji)</option>
                    <option value="DATE">Data</option>
                </select>
            </label>
        </div>
        <div class="grid">
            <label>
                Kolejność
                <input type="number" name="displayOrder" value="0" min="0">
            </label>
            <label>
                <input type="checkbox" name="required">
                Wymagany
            </label>
        </div>
        <!-- Options field: shown only for SELECT/MULTI_SELECT -->
        <div id="options-field-new" style="display:none; margin-top:0.5rem;">
            <label>
                Opcje (każda w nowej linii)
                <textarea name="options" rows="4" style="font-family:monospace; font-size:0.85rem;"
                          placeholder="Wzrost&#10;Rozmiar kołnierzyka&#10;Inna opcja"></textarea>
            </label>
        </div>
        <div style="display:flex; gap:0.5rem; margin-top:0.5rem;">
            <button type="submit" class="primary small">Dodaj atrybut</button>
            <button type="button" class="secondary small"
                    onclick="document.getElementById('attribute-form-container').innerHTML=''">Anuluj</button>
        </div>
    </form>

    <!-- Edit attribute form -->
    <form th:if="${isEdit}"
          th:hx-put="@{/band/attributes/{id}(id=${attributeDefId})}"
          hx-target="#attribute-defs-content"
          hx-swap="innerHTML">
        <div class="grid">
            <label>
                Nazwa *
                <input type="text" name="name" th:value="${attributeDef?.name}" required>
            </label>
            <label>
                Typ
                <select name="type" id="attr-type-edit" onchange="toggleOptionsField('edit')">
                    <option value="BOOLEAN" th:selected="${attributeDef?.type == 'BOOLEAN'}">Tak/Nie</option>
                    <option value="TEXT" th:selected="${attributeDef?.type == 'TEXT'}">Tekst</option>
                    <option value="NUMBER" th:selected="${attributeDef?.type == 'NUMBER'}">Liczba</option>
                    <option value="SELECT" th:selected="${attributeDef?.type == 'SELECT'}">Wybór (jedna opcja)</option>
                    <option value="MULTI_SELECT" th:selected="${attributeDef?.type == 'MULTI_SELECT'}">Wybór (wiele opcji)</option>
                    <option value="DATE" th:selected="${attributeDef?.type == 'DATE'}">Data</option>
                </select>
            </label>
        </div>
        <div class="grid">
            <label>
                Kolejność
                <input type="number" name="displayOrder" th:value="${attributeDef?.displayOrder}" min="0">
            </label>
            <label>
                <input type="checkbox" name="required" th:checked="${attributeDef?.required}">
                Wymagany
            </label>
        </div>
        <!-- Options field: shown only for SELECT/MULTI_SELECT -->
        <div id="options-field-edit" th:style="${attributeDef?.type == 'SELECT' or attributeDef?.type == 'MULTI_SELECT'} ? '' : 'display:none;'">
            <label>
                Opcje (każda w nowej linii)
                <textarea name="options" rows="4" style="font-family:monospace; font-size:0.85rem;"
                          th:text="${attributeDef?.options}"
                          placeholder="Wzrost&#10;Rozmiar kołnierzyka&#10;Inna opcja"></textarea>
            </label>
        </div>
        <div style="display:flex; gap:0.5rem; margin-top:0.5rem;">
            <button type="submit" class="primary small">Zapisz zmiany</button>
            <button type="button" class="secondary small"
                    onclick="document.getElementById('attribute-form-container').innerHTML=''">Anuluj</button>
        </div>
    </form>

    <script>
        function toggleOptionsField(prefix) {
            var typeSelect = document.getElementById('attr-type-' + prefix);
            var optionsField = document.getElementById('options-field-' + prefix);
            var type = typeSelect.value;
            if (type === 'SELECT' || type === 'MULTI_SELECT') {
                optionsField.style.display = '';
            } else {
                optionsField.style.display = 'none';
            }
        }
    </script>
</div>
