<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Atrybuty inwentarza')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <main class="container" id="content">
        <h2>🏷️ Atrybuty</h2>

        <!-- Type tabs -->
        <div style="display:flex; gap:0.5rem; margin-bottom:1rem;">
            <a th:href="@{/band/attributes(type='UNIFORM')}"
               th:class="${type == 'UNIFORM'} ? 'primary' : 'secondary'"
               style="padding:0.4rem 0.8rem; text-decoration:none; border-radius:4px;">Umundurowanie</a>
            <a th:href="@{/band/attributes(type='INSTRUMENT')}"
               th:class="${type == 'INSTRUMENT'} ? 'primary' : 'secondary'"
               style="padding:0.4rem 0.8rem; text-decoration:none; border-radius:4px;">Instrumenty</a>
            <a th:href="@{/band/attributes(type='ORDER')}"
               th:class="${type == 'ORDER'} ? 'primary' : 'secondary'"
               style="padding:0.4rem 0.8rem; text-decoration:none; border-radius:4px;">Zamówienia</a>
            <a th:href="@{/band/attributes(type='MEMBER')}"
               th:class="${type == 'MEMBER'} ? 'primary' : 'secondary'"
               style="padding:0.4rem 0.8rem; text-decoration:none; border-radius:4px;">Członkowie</a>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
            <span>Typ: <span th:switch="${type}"><span th:case="'UNIFORM'">Umundurowanie</span><span th:case="'INSTRUMENT'">Instrumenty</span><span th:case="'ORDER'">Zamówienia</span><span th:case="'MEMBER'">Członkowie</span></span></span>
            <button class="primary"
                    th:hx-get="@{/band/attributes/new(type=${type})}"
                    hx-target="body"
                    hx-swap="innerHTML">+ Dodaj atrybut</button>
        </div>

        <div th:if="${attributeDefs == null or #lists.isEmpty(attributeDefs)}">
            <p>Brak atrybutów dla tego typu. Dodaj pierwszy!</p>
        </div>
        <table th:if="${attributeDefs != null and !#lists.isEmpty(attributeDefs)}"
               style="width:100%; border-collapse:collapse;">
            <thead>
                <tr style="border-bottom:2px solid var(--pico-muted-border-color);">
                    <th style="text-align:left; padding:0.5rem;">Nazwa</th>
                    <th style="text-align:left; padding:0.5rem;">Typ</th>
                    <th style="text-align:center; padding:0.5rem;">Wymagany</th>
                    <th style="text-align:center; padding:0.5rem;">Kolejność</th>
                    <th style="text-align:left; padding:0.5rem;">Opcje</th>
                    <th style="text-align:left; padding:0.5rem;">Akcje</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="attrDef : ${attributeDefs}" style="border-bottom:1px solid var(--pico-muted-border-color);">
                    <td style="padding:0.5rem;" th:text="${attrDef.name()}">Nazwa</td>
                    <td style="padding:0.5rem;">
                        <span th:switch="${attrDef.type()}">
                            <span th:case="'BOOLEAN'">Tak/Nie</span>
                            <span th:case="'NUMBER'">Liczba</span>
                            <span th:case="'SELECT'">Wybór</span>
                            <span th:case="'MULTI_SELECT'">Wybór wielokrotny</span>
                            <span th:case="'DATE'">Data</span>
                            <span th:case="*">Tekst</span>
                        </span>
                    </td>
                    <td style="padding:0.5rem; text-align:center;" th:text="${attrDef.required()} ? '✅' : '❌'">Wymagany</td>
                    <td style="padding:0.5rem; text-align:center;" th:text="${attrDef.displayOrder()}">0</td>
                    <td style="padding:0.5rem; font-size:0.8rem; color:var(--pico-muted-color);" th:text="${attrDef.options() != null and !attrDef.options().isEmpty()} ? ${#strings.abbreviate(attrDef.options(), 40)} : '-'">Opcje</td>
                    <td style="padding:0.5rem;">
                        <button class="outline small"
                                th:hx-get="@{/band/attributes/{id}/edit(id=${attrDef.id()},type=${type})}"
                                hx-target="body"
                                hx-swap="innerHTML">Edytuj</button>
                        <button class="outline small secondary"
                                th:hx-delete="@{/band/attributes/{id}(id=${attrDef.id()},type=${type})}"
                                hx-confirm="Czy na pewno chcesz usunąć ten atrybut?"
                                hx-target="body"
                                hx-swap="innerHTML">Usuń</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
