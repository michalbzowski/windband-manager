<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${composition.title})}"></head>
<body class="dashboard-page">

<div th:replace="~{fragments/layout :: dialogs}"></div>

<main class="container" id="content">
    <section class="dashboard-upcoming">
        <header th:replace="~{fragments/layout :: dashboard-header}"></header>

        <div id="compositions-content">
            <h2>Szczegóły utworu</h2>

            <article id="composition-detail">
                <header>
                    <strong th:text="${composition.title}">Tytuł utworu</strong>
                    <span th:replace="~{compositions/fragments/status-badge :: status(${composition.status})}"></span>
                </header>

                <dl>
                    <dt>Kompozytor</dt>
                    <dd th:text="${composition.composer != null and !composition.composer.isBlank() ? composition.composer : '—'}">—</dd>
                    <dt>Aranżer</dt>
                    <dd th:text="${composition.arranger != null and !composition.arranger.isBlank() ? composition.arranger : '—'}">—</dd>
                    <dt>Opis</dt>
                    <dd class="composition-description"
                        th:text="${composition.description != null and !composition.description.isBlank() ? composition.description : 'Brak opisu'}">Brak opisu</dd>
                </dl>

<!-- US-3.5 lifecycle actions: archive / restore. Delete is exposed via page-header overflow below. -->
<div class="composition-status-actions">
    <button type="button" id="archive-composition-btn" class="secondary"
            th:if="${composition.status.name() != 'ARCHIVED'}"
            onclick="openLifecycleDialog('archive')">📦 Archiwizuj</button>
    <button type="button" id="restore-composition-btn" class="primary"
            th:if="${composition.status.name() == 'ARCHIVED'}"
            onclick="openLifecycleDialog('restore')">↩️ Przywróć</button>

    <button type="button" id="delete-composition-btn" class="secondary danger"
            onclick="openLifecycleDialog('delete')">🗑 Usuń bezpowrotnie</button>
</div>



</article>
</div>
    </section>
</main>

<dialog id="lifecycle-dialog" class="app-modal">
    <div class="app-modal-content">
        <header class="app-modal-header">
            <div class="app-modal-header-text">
                <strong id="lifecycle-title" aria-live="polite">Potwierdź</strong>
                <small>Zmiana ma wpływ na widoczność utworu w bibliotece.</small>
            </div>
            <button type="button" class="app-modal-close" aria-label="Zamknij" data-close>×</button>
        </header>
        <div class="app-modal-body">
            <p id="lifecycle-message" role="alert"></p>
            <form id="lifecycle-form" method="post">
                <button type="submit" id="lifecycle-confirm-btn" class="primary">Potwierdź</button>
                <button type="button" class="secondary" data-close>Anuluj</button>
            </form>
        </div>
    </div>
</dialog>

<script th:inline="javascript">
(function () {
    var bandId = /*[[${bandId}]]*/ 0;
    var compId = /*[[${composition.id}]]*/ 0;
    var compositionTitle = /*[[${composition.title}]]*/ 'Utwór';

    window.openLifecycleDialog = function (action) {
        var title      = document.getElementById('lifecycle-title');
        var message    = document.getElementById('lifecycle-message');
        var confirmBtn = document.getElementById('lifecycle-confirm-btn');
        var form       = document.getElementById('lifecycle-form');

        var plans = {
            archive: {title: 'Archiwizować utwór?',
                body: '„' + compositionTitle + '” trafi do archiwum i zniknie z listy. Możesz go w każdej chwili przywrócić.',
                confirm: '📦 Archiwizuj', url: '/bands/' + bandId + '/compositions/' + compId + '/archive'},
            restore: {title: 'Przywrócić utwór?',
                body: '„' + compositionTitle + '” wróci do statusu Szkic. Parts i opisy pozostają bez zmian.',
                confirm: '↩️ Przywróć', url: '/bands/' + bandId + '/compositions/' + compId + '/restore'},
            delete:  {title: 'Usuń utwór bezpowrotnie?',
                body: '„' + compositionTitle + '” wraz z powiązanymi plikami i parts zostanie usunięty. Tej operacji nie można cofnąć.',
                confirm: '🗑 Usuń bezpowrotnie', url: '/bands/' + bandId + '/compositions/' + compId + '/delete'}
        };
        var plan = plans[action];
        if (!plan) { return; }
        title.textContent      = plan.title;
        message.textContent    = plan.body;
        confirmBtn.textContent = plan.confirm;
        form.action            = plan.url;

        var dlg = document.getElementById('lifecycle-dialog');
        if (typeof openAppModal === 'function') { openAppModal('lifecycle-dialog'); }
        else if (dlg.showModal) { dlg.showModal(); }
        else { dlg.setAttribute('open', ''); }
    };
})();
</script>

</body>
</html>
