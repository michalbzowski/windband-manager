<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Konfiguracja raportu')}"></head>
<body>
<nav th:replace="~{fragments/layout::nav}"></nav>

<main class="container" id="reports-content">
    <div style="max-width: 600px; margin: 2rem auto;">
        <header style="margin-bottom: 2rem;">
            <h1 th:text="${report.displayName}">Konfiguracja raportu</h1>
            <p th:if="${report.description != null and !report.description.isEmpty()}"
               th:text="${report.description}"
               style="color: var(--pico-muted-color);"></p>
        </header>

        <!-- Formularz parametrów: zwykły submit -> przeglądarka pobiera plik PDF.
             band_id i band_name są przekazywane jako ukryte pola z kontekstu zespołu
             (parametry forPrompting=false); użytkownik ich nie widzi ani nie edytuje. -->
        <form id="configure-form"
              class="app-form-card"
              th:action="@{'/reports/configure/' + ${report.key} + '/download'}"
              method="post">

            <fieldset class="app-form" th:if="${report.parameters != null and !report.parameters.isEmpty()}">
                <legend style="font-weight: bold; margin-bottom: 0.75rem;">Parametry raportu</legend>

                <div th:each="rp : ${report.parameters}">

                    <!-- Ukryte parametry z kontekstu zespołu (forPrompting=false) -->
                    <input type="hidden"
                           th:if="${!rp.forPrompting and 'band_id'.equals(rp.name)}"
                           th:name="${rp.name}"
                           th:value="${activeBandId}"/>

                    <input type="hidden"
                           th:if="${!rp.forPrompting and 'band_name'.equals(rp.name)}"
                           th:name="${rp.name}"
                           th:value="${activeBandName}"/>

                    <!-- Pozostałe ukryte parametry (forPrompting=false), bez specjalnego mapowania -->
                    <input type="hidden"
                           th:if="${!rp.forPrompting and !('band_id'.equals(rp.name)) and !('band_name'.equals(rp.name))}"
                           th:name="${rp.name}"
                           value=""/>

                    <!-- Widoczne parametry (forPrompting=true) -->
                    <div th:if="${rp.forPrompting}" style="margin-bottom: 1rem;">
                        <label th:for="'param-' + ${rp.name}"
                               style="display: block; margin-bottom: 0.25rem; font-weight: 500;"
                               th:text="${rp.name}">Parametr</label>

                        <input th:if="${'date'.equals(rp.inputType)}"
                               type="date"
                               required
                               th:id="'param-' + ${rp.name}"
                               th:name="${rp.name}"/>

                        <input th:if="${'datetime-local'.equals(rp.inputType)}"
                               type="datetime-local"
                               th:id="'param-' + ${rp.name}"
                               th:name="${rp.name}"/>

                        <input th:if="${'number'.equals(rp.inputType)}"
                               type="number"
                               step="any"
                               th:id="'param-' + ${rp.name}"
                               th:name="${rp.name}"/>

                        <input th:if="${'checkbox'.equals(rp.inputType)}"
                               type="checkbox"
                               th:id="'param-' + ${rp.name}"
                               th:name="${rp.name}"
                               th:value="true"/>

                        <input th:if="${'text'.equals(rp.inputType)}"
                               type="text"
                               th:id="'param-' + ${rp.name}"
                               th:name="${rp.name}"/>
                    </div>
                </div>
            </fieldset>

            <footer style="margin-top: 2rem; display: flex; gap: 1rem; align-items: center;">
                <button type="submit" class="app-form-submit">Generuj raport (PDF)</button>
                <a th:href="@{/reports/jasper}" style="margin-left: auto; text-decoration: none;">← Powrót do listy</a>
            </footer>
        </form>
    </div>
</main>

<div th:insert="~{fragments/layout::toast-container}"></div>
<th:block th:replace="~{fragments/layout :: footer-scripts}"></th:block>
</body>
</html>
