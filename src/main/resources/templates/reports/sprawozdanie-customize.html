<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Konfiguruj Sprawozdanie')}"></head>
<body class="dashboard-page">
<div th:replace="~{fragments/layout :: dialogs}"></div>

<main class="container" id="content">
    <section class="dashboard-upcoming">
        <header th:replace="~{fragments/layout :: dashboard-header}"></header>

    <div id="reports-content">
        <header class="reports-header">
            <h2>⚙️ Skonfiguruj Sprawozdanie Zespołu</h2>
            <p class="reports-subtitle">Wypełnij parametry i pobierz gotowy PDF</p>
        </header>

        <article class="report-config-card">
            <form id="sprawozdanie-form" class="config-form">
                <!-- Hidden field for report path -->
                <input type="hidden" name="reportPath" value="/bands/test/sprawozdanie.jrxml">
                
                <div class="form-section">
                    <h3>📋 Informacje podstawowe</h3>
                    <div class="form-grid">
                        <label class="form-field">
                            <span class="field-label">Nazwa zespołu <span class="required">*</span></span>
                            <input type="text" name="bandName" value="" required placeholder="Wpisz nazwę zespołu">
                        </label>
                        
                        <label class="form-field">
                            <span class="field-label">Instruktor</span>
                            <input type="text" name="instructorName" value="" placeholder="Nazwisko instruktora">
                        </label>
                    </div>
                </div>

                <div class="form-section">
                    <h3>📅 Okres sprawozdawczy</h3>
                    <p class="section-description">Wybierz miesiąc i rok dla którego chcesz wygenerować raport (domyślnie: obecny okres)</p>
                    <div class="form-grid">
                        <label class="form-field">
                            <span class="field-label">Rok</span>
                            <select name="periodYear" id="periodYearSelect" required></select>
                        </label>
                        
                        <label class="form-field">
                            <span class="field-label">Miesiąc</span>
                            <select name="periodMonth" id="periodMonthSelect" required>
                                <option value="1">Styczeń</option>
                                <option value="2">Luty</option>
                                <option value="3">Marzec</option>
                                <option value="4">Kwiecień</option>
                                <option value="5">Maj</option>
                                <option value="6">Czerwiec</option>
                                <option value="7">Lipiec</option>
                                <option value="8">Sierpień</option>
                                <option value="9">Wrzesień</option>
                                <option value="10">Październik</option>
                                <option value="11">Listopad</option>
                                <option value="12">Grudzień</option>
                            </select>
                        </label>
                    </div>
                </div>

                <div class="form-actions">
                    <a th:href="@{/reports}" class="btn-secondary">← Powrót do listy raportów</a>
                    <button type="submit" class="btn-primary">📊 Generuj PDF</button>
                </div>
            </form>

            <!-- Error message display -->
            <div id="error-message" class="alert alert-error" style="display: none;"></div>
        </article>
    </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:insert="~{fragments/layout :: toast-container}"></div>
<div th:insert="~{fragments/layout :: footer-scripts}"></div>

<script th:replace="~{fragments/layout :: dashboard-header-morph}"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Populate year select with recent years (2024-2030)
    const yearSelect = document.getElementById('periodYearSelect');
    const currentYear = new Date().getFullYear();
    
    for (let year = currentYear - 1; year <= currentYear + 5; year++) {
        const option = document.createElement('option');
        option.value = year;
        option.textContent = year;
        if (year === currentYear) {
            option.selected = true;
        }
        yearSelect.appendChild(option);
    }

    // Set default month to current month
    const monthSelect = document.getElementById('periodMonthSelect');
    const currentMonth = new Date().getMonth() + 1; // January is 0 in JavaScript
    for (let i = 0; i < monthSelect.options.length; i++) {
        if (parseInt(monthSelect.options[i].value) === currentMonth) {
            monthSelect.selectedIndex = i;
            break;
        }
    }

    // Handle form submission via fetch POST to /api/reports/sprawozdanie/generate
    const form = document.getElementById('sprawozdanie-form');
    
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const submitBtn = form.querySelector('button[type="submit"]');
        const errorMessage = document.getElementById('error-message');
        
        // Disable button during request
        submitBtn.disabled = true;
        submitBtn.textContent = '⏳ Generowanie...';
        
        try {
            const formData = new FormData(form);
            
            // Build JSON body for POST request
            const requestBody = {
                bandName: formData.get('bandName'),
                instructorName: formData.get('instructorName') || undefined,
                periodYear: parseInt(formData.get('periodYear')),
                periodMonth: parseInt(formData.get('periodMonth')),
                format: 'PDF'
            };
            
            const response = await fetch('/api/reports/sprawozdanie/generate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestBody)
            });
            
            if (!response.ok) {
                if (response.status === 503) {
                    throw new Error('Usługa generowania raportów jest chwilowo niedostępna. Spróbuj ponownie za chwilę.');
                } else if (response.status === 400 || response.status === 422) {
                    // Validation error - show field errors
                    const errorText = await response.text();
                    throw new Error('Nieprawidłowe dane formularza. Sprawdź czy wszystkie pola są wypełnione poprawnie.');
                } else {
                    throw new Error(`Błąd serwera podczas generowania raportu: ${response.statusText}`);
                }
            }
            
            // Download the PDF file
            const blob = await response.blob();
            const dispositionHeader = response.headers.get('Content-Disposition');
            
            let filename = 'sprawozdanie.pdf';
            if (dispositionHeader && dispositionHeader.indexOf('attachment') !== -1) {
                const filenameMatch = /filename[^;=\n]*=((['\"]).*?\2|[^;\n]*)/.exec(dispositionHeader);
                if (filenameMatch && filenameMatch[1]) {
                    filename = filenameMatch[1].replace(/['"]/g, '');
                }
            }
            
            // Create download link and trigger it
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            
            // Cleanup
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
            
        } catch (error) {
            errorMessage.textContent = error.message || 'Wystąpił błąd podczas generowania raportu.';
            errorMessage.style.display = 'block';
            
            // Optional: show toast notification
            if (window.showAppErrorToast) {
                window.showAppErrorToast('❌ Błąd:', error.message || 'Nie udało się wygenerować PDF.');
            }
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = '📊 Generuj PDF';
        }
    });
});
</script>
</section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:insert="~{fragments/layout :: toast-container}"></div>
<div th:insert="~{fragments/layout :: footer-scripts}"></div>

<script th:replace="~{fragments/layout :: dashboard-header-morph}"></script>
</body>
</html>

<style>
.reports-header {
    margin-bottom: 2rem;
    text-align: center;
}

.reports-header h2 {
    margin: 0 0 0.5rem;
    font-size: clamp(1.5rem, 3vw, 2rem);
}

.reports-subtitle {
    color: var(--pico-muted-color);
    margin: 0;
}

.report-config-card {
    background: var(--pico-card-background-color);
    border: 1px solid var(--pico-card-border-color);
    border-radius: 16px;
    padding: 2rem;
    max-width: 700px;
    margin: 0 auto;
    box-shadow: var(--pico-card-box-shadow, none);
}

.form-section {
    background: var(--pico-card-sectioning-background-color);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
}

.form-section h3 {
    margin: 0 0 1rem;
    font-size: 1.1rem;
    color: var(--pico-primary);
}

.section-description {
    margin: 0 0 1rem;
    color: var(--pico-muted-color);
    font-size: 0.9rem;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 1rem;
}

.form-field {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.field-label {
    font-weight: 600;
    color: var(--pico-color);
    font-size: 0.9rem;
}

.required {
    color: #e74c3c;
}

.form-field input,
.form-field select {
    padding: 0.75rem;
    border: 1px solid var(--pico-form-element-border-color);
    border-radius: var(--pico-border-radius);
    background: var(--pico-form-element-background-color);
    color: var(--pico-form-element-text-color);
    font-size: 0.95rem;
}

.form-field input:focus,
.form-field select:focus {
    outline: none;
    border-color: var(--pico-primary-focus-border);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--pico-primary) 15%, transparent);
}

.form-actions {
    display: flex;
    gap: 1rem;
    justify-content: space-between;
    align-items: center;
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--pico-muted-border-color);
}

.btn-primary,
.btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.75rem 1.25rem;
    border-radius: var(--pico-border-radius);
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
    transition: all 0.15s ease;
    border: none;
    cursor: pointer;
}

.btn-primary {
    background: var(--pico-primary);
    color: var(--pico-primary-inverse);
}

.btn-primary:hover:not(:disabled) {
    filter: brightness(1.1);
    transform: translateY(-1px);
}

.btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.btn-secondary {
    background: var(--pico-card-sectioning-background-color);
    color: var(--pico-color);
    border: 1px solid var(--pico-muted-border-color);
}

.btn-secondary:hover {
    background: var(--pico-muted-background-color);
    border-color: var(--pico-primary);
    color: var(--pico-primary);
}

.alert-error {
    background: color-mix(in srgb, #e74c3c 10%, transparent);
    border: 1px solid #e74c3c;
    color: #c0392b;
    padding: 1rem;
    border-radius: var(--pico-border-radius);
    margin-top: 1.5rem;
    font-size: 0.95rem;
}

@media (max-width: 640px) {
    .report-config-card {
        padding: 1.5rem;
    }
    
    .form-grid {
        grid-template-columns: 1fr;
    }
    
    .form-actions {
        flex-direction: column-reverse;
    }
    
    .btn-primary,
    .btn-secondary {
        width: 100%;
        justify-content: center;
    }
}
</style>
