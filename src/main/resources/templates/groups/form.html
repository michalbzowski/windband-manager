<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nowa grupa')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <main class="container" id="content">
        <div id="groups-content">
            <h2>🎼 Nowa grupa</h2>

            <form method="post" action="/groups">
                <label for="name">Nazwa</label>
                <input type="text" id="name" name="name" required placeholder="np. Sekcja dęta">

                <label for="description">Opis</label>
                <textarea id="description" name="description" rows="2" placeholder="np. Trąbki, skrzydłówki"></textarea>

                <div style="display:flex; gap:0.5rem; margin-top:1rem;">
                    <button type="submit" class="primary">Utwórz grupę</button>
                    <button type="button" class="secondary"
                            hx-get="/groups/list" hx-target="#groups-content"
                            hx-swap="innerHTML transition:true">Anuluj</button>
                </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
