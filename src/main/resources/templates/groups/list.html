<!-- Groups list content fragment - goes inside #content container -->
<main class="container" id="content">
    <section class="dashboard-upcoming">
        <div id="groups-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <h2>🎼 Grupy</h2>
                <div style="display:flex; gap:0.5rem; align-items:center;">
                    <form th:action="@{/admin/groups/backfill}" method="post" style="margin:0;">
                        <button type="submit" class="outline" title="Utwórz/zsynchronizuj grupy dynamiczne (np. Aktywni) dla wszystkich zespołów">🔄 Aktualizuj grupy dynamiczne</button>
                    </form>
                    <button hx-get="/groups/new" hx-target="#groups-content"
                            hx-swap="innerHTML transition:true" class="primary">+ Dodaj grupę</button>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(groups)}">
                <article>
                    <p>Brak grup w systemie.</p>
                </article>
            </div>

            <div th:unless="${#lists.isEmpty(groups)}">
                <table role="grid">
                    <thead>
                        <tr>
                            <th>Nazwa</th>
                            <th>Opis</th>
                            <th>Liczba członków</th>
                            <th>Akcje</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="g : ${groups}">
                            <td>
                                <strong th:text="${g.name}">Sekcja dęta</strong>
                                <span th:if="${g.dynamic}" class="dynamic-badge" title="Grupa zarządzana automatycznie na podstawie atrybutu">🔄 dynamiczna</span>
                            </td>
                            <td th:text="${g.description}">Trąbki, skrzydlówki</td>
                            <td th:text="${g.memberCount}">5</td>
                            <td>
                                <button class="outline small"
                                        th:hx-get="@{/groups/{id}(id=${g.id})}"
                                        hx-target="#groups-content"
                                        hx-swap="innerHTML transition:true">Szczegóły</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>
