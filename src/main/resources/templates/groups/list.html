<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Grupy')}"></head>
<body class="dashboard-page">
<div th:replace="~{fragments/layout :: dialogs}"></div>

<main class="container" id="content">
    <section class="dashboard-upcoming">
        <header th:replace="~{fragments/layout :: dashboard-header}"></header>

    <div id="groups-content">
        <!-- PR B: header uses the unified page-header fragment. The primary "+ Dodaj grupę"
             is an htmx GET (target #groups-content). "Aktualizuj grupy dynamiczne" is a
             POST — the scalar fragment API only carries GET-ish link/hx actions, so it stays
             in place as a neutral secondary button under the bar. -->
        <nav th:replace="~{fragments/page-header :: page-header-b(
                            null, 'Grupy', 'Dodaj grupę', @{/groups/new},
                            'plus', 'add-group-btn', '#groups-content',
                            null, null, null, null)}"></nav>
        <button type="button" class="ph-secondary-action" form="groups-backfill-form"
                th:title="Utwórz/zsynchronizuj grupy dynamiczne (np. Aktywni) dla wszystkich zespołów">
            <th:block th:insert="~{fragments/icons :: group}"></th:block>
            Aktualizuj grupy dynamiczne
        </button>
        <form th:action="@{/admin/groups/backfill}" method="post" id="groups-backfill-form" style="display:none;"></form>

            <div th:if="${#lists.isEmpty(groups)}">
                <article>
                    <p>Brak grup w systemie.</p>
                </article>
            </div>

            <div th:unless="${#lists.isEmpty(groups)}">
                <table role="grid">
                    <thead>
                        <tr>
                            <th>Nazwa</th>
                            <th>Opis</th>
                            <th>Liczba członeków</th>
                            <th>Akcje</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="g : ${groups}">
                            <td>
                                <strong th:text="${g.name}">Sekcja dęta</strong>
                                <span th:if="${g.dynamic}" class="dynamic-badge" title="Grupa zarządzana automatycznie na podstawie atrybutu">🔄 dynamiczna</span>
                            </td>
                            <td th:text="${g.description}">Trąbki, skrzydlówki</td>
                            <td th:text="${g.memberCount}">5</td>
                            <td>
                                <button class="outline small"
                                        th:hx-get="@{/groups/{id}(id=${g.id})}"
                                        hx-target="#groups-content"
                                        hx-swap="innerHTML transition:true">Szczegóły</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:insert="~{fragments/layout :: toast-container}"></div>
<div th:insert="~{fragments/layout :: footer-scripts}"></div>

<div th:insert="~{fragments/layout :: dashboard-header-morph}"></div>
</body>
</html>
