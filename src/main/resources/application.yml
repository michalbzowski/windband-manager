spring:
  application:
    name: team-manager

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 250MB

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Production DB was baselined before V13_5/V18_5/V28_5/V29_5 (all CREATE-TABLE-IF-NOT-EXISTS)
    # were added to the migration chain. Flyway OSS doesn't support version-specific ignore patterns,
    # so these are applied manually via flyway repair/baseline on new environments and simply don't
    # conflict on production (which already has the tables). Do NOT re-add ignore-migration-patterns
    # with <version> entries: that is a Redgate Commercial feature and crashes OSS deployments.

  thymeleaf:
    cache: false

  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            provider: keycloak
        provider:
          keycloak:
            authorization-uri: https://${KEYCLOAK_AUTH_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/auth
            token-uri: http://${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token
            user-info-uri: http://${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/userinfo
            jwk-set-uri: http://${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
            user-name-attribute: preferred_username



server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native

logging:
  level:
    org.springframework.security.oauth2: TRACE
    org.springframework.security.web: DEBUG
    org.springframework.web.client.RestTemplate: DEBUG
    org.springframework.boot.autoconfigure.security: DEBUG
    org.springframework.security.oauth2.client: DEBUG

app:
  base-url: ${BASE_URL}
  mail-from: ${MAIL_FROM:windband@localhost}
  keycloak:
    url: https://${KEYCLOAK_PUBLIC_URL}
    realm: ${KEYCLOAK_REALM}
    client-id: ${KEYCLOAK_CLIENT_ID}
    client-secret: ${KEYCLOAK_CLIENT_SECRET}
    registration-redirect-url: ${app.keycloak.url}/realms/${app.keycloak.realm}/protocol/openid-connect/registrations?client_id=${app.keycloak.client-id}&redirect_uri=${app.base-url}/register&response_type=code&scope=openid profile email

# Superset removed from the local stack — the Superset beans fall back to
# harmless localhost defaults and are never contacted unless you add a
# Superset service and re-introduce these properties.
superset:
  base-url: ${SUPERSET_BASE_URL:http://localhost:8088}
  public-url: ${SUPERSET_PUBLIC_URL:http://localhost:8088}
  username: ${SUPERSET_USERNAME:admin}
  password: ${SUPERSET_PASSWORD:admin}

sendgrid:
  api-key: ${SEND...EY:}

# US-2.1 score-file upload pipeline (root + size caps). The root lives on the
# host's mounted volume (/mnt/sda1/my_media) — see deployment docs for how to
# persist it across Railway restarts.
windband:
  scores:
    root-path: ${SCORES_ROOT_PATH:/srv/windband-scores}
    max-file-size-bytes: 52428800        # 50 MB (PDF/JPEG/PNG)
    max-zip-file-size-bytes: 209715200  # 200 MB (ZIP)
