# Local development profile
# ========================
# Override application.yml for running on localhost (Mac/IntelliJ).
# application.yml stays untouched for Railway production.
#
# Prerequisites:
#   docker compose up -d db keycloak
#
# Run with:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
#
# IntelliJ: Run → Edit Configurations → Active profiles: local
#
# NOTE: H2 is NOT used here. PostgreSQL + Keycloak from Docker Compose
# gives realistic OIDC flow. If you want H2 + mock OIDC, use the 'test'
# profile instead (see TestSecurityConfig).

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:windband}
    username: ${DB_USER:windband}
    password: ${DB_PASS:windband}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
    show-sql: true      # helpful for local debugging

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Override OIDC URLs for localhost (plain HTTP, no HTTPS)
  security:
    oauth2:
      # v1 integration API (/api/v1/**): validate Bearer JWTs against the realm JWKS.
      # issuer-uri = trusted iss claim value. jwk-set-uri = where THIS process fetches
      # signing keys — must be reachable from the app runtime (container DNS in compose,
      # NOT the host port mapping consumed by browsers on localhost).
      # Production: set SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI and
      # WINDBAND_INVENTORY_API_JWK_SET_URI to the deployed Keycloak realm endpoints.
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/${KEYCLOAK_REALM:windband}
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:windband-local}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            redirect-uri: "http://localhost:8080/login/oauth2/code/keycloak"
        provider:
          keycloak:
            authorization-uri: http://localhost:8180/realms/${KEYCLOAK_REALM:windband}/protocol/openid-connect/auth
            token-uri: http://localhost:8180/realms/${KEYCLOAK_REALM:windband}/protocol/openid-connect/token
            user-info-uri: http://localhost:8180/realms/${KEYCLOAK_REALM:windband}/protocol/openid-connect/userinfo
            jwk-set-uri: http://localhost:8180/realms/${KEYCLOAK_REALM:windband}/protocol/openid-connect/certs
            user-name-attribute: preferred_username

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.springframework.security.oauth2: TRACE
    org.springframework.security.web: DEBUG
    org.springframework.web.client.RestTemplate: DEBUG
    org.springframework.boot.autoconfigure.security: DEBUG
    org.springframework.security.oauth2.client: DEBUG

app:
  base-url: ${BASE_URL:http://localhost:8080}
  # windband-inventory dev server (vite, port 5173 — matches the Keycloak
  # client's valid redirect URI http://localhost:5173/*).
  inventory-url: ${INVENTORY_URL:http://localhost:5173}
  # Score Analyzer — lokalny serwis Python (repo ~/score-analyzer, ./run.sh, port 8091).
  # Ustaw SCORE_ANALYZER_URL= (pusty), żeby wrócić do StubAiAnalysisRunner.
  scoreanalysis:
    analyzer-base-url: ${SCORE_ANALYZER_URL:http://localhost:8091}
  # DEV-ONLY: czytelna fraza 32-bajtowa jako lokalny klucz główny skarbca (to NIE jest
  # sekret — fixture dev; produkcja bierze LLM_KEYS_MASTER_KEY ze środowiska Railway,
  # generowany przez `openssl rand -base64 32`).
  llmkeys:
    master-key: ${LLM_KEYS_MASTER_KEY:windb…-32}
  keycloak:
    url: http://localhost:8180
    realm: ${KEYCLOAK_REALM:windband}
    client-id: ${KEYCLOAK_CLIENT_ID:windband-local}
    client-secret: ${KEYCLOAK_CLIENT_SECRET}

# v1 integration API (windband-inventory): where this process fetches the realm's
# signing keys. Must be reachable from inside the app runtime — container DNS in
# docker-compose, not the localhost host-port mapping browsers use. Trusted issuer
# (iss claim) stays spring.security.oauth2.resourceserver.jwt.issuer-uri above.
windband:
  inventory:
    api:
      jwk-set-uri: http://keycloak:8180/realms/${KEYCLOAK_REALM:windband}/protocol/openid-connect/certs