registerTitle=Rejestracja
backToLogin=Powrót do logowania
doLogIn=Zaloguj się
loggingIn=Logowanie…
doLogout=Wyloguj
doCancel=Anuluj
doContinue=Kontynuuj
rememberMe=Pamiętaj mnie
noAccount=Nie masz konta?
doForgotPassword=Nie pamiętasz hasła?
loginOtpTryAgain=Spróbuj ponownie

# --- pola formularza logowania ---
