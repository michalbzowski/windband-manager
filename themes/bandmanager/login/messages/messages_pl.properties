# Band Manager — polski bundle wiadomości dla motywu logowania (Keycloak 25/26)
# Temat bazowy nie dostarcza kompletnych tłumaczeń PL, a Keycloak renderuje
# nieznane klucze wprost jako tekst (np. "loginUsernameOrEmail" zamiast etykiety).
# Ten bundle uzupełnia teksty dla stron: logowanie, rejestracja, 2FA, reset hasła.

